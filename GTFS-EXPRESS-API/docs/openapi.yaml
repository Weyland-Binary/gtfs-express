  /gtfs/edit/validate:
    post:
      tags:
        - Validation
      summary: Re-run canonical validation on the session feed (rate-limited 5/min/session).
      description: |-
        The report the export preflight reads. A report that proves nothing is never answered as a
        report: without the validator (no JAR, an UNVERIFIED report) the call refuses with **503**
        `VALIDATOR_UNAVAILABLE` `{ reason: not_installed | unverified }`, and a validator that
        crashed with **503** `VALIDATOR_FAILED` `{ validator_error }` (validatorGate.wrap and
        assertVerified, the delivery paths' own readers), as `POST /gtfs/edit/validate.canonical`
        refuses a report that proves nothing; neither body carries `valid` or `counts`. An unverified report is still stored as the
        session's report, where no consumer reads it as valid.

        A verified report carries `delivery` (`ValidationDelivery`): what the export gate will decide
        on the same feed. Against the baseline saved at ingest only NEW errors hold an export (the
        errors the feed already had are not the user's); without a baseline (a network built here)
        any error holds it. The preflight reads it instead of counting errors on its own.
      parameters:
        - name: profile
          in: query
          required: false
          schema:
            type: string
            default: canonical
          description: "Severity profile: canonical | strict | lenient | fr-datagouv…"
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/ValidationOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: "The canonical validator could not answer, so no report is returned: VALIDATOR_UNAVAILABLE { reason: not_installed | unverified } (no JAR on this server, or an unverified report) or VALIDATOR_FAILED { validator_error } (the validator crashed or timed out)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /gtfs/edit/validate.canonical:
    post:
      tags:
        - Validation
      summary: Re-validate and return the raw MobilityData Canonical Validator JSON shape.
      parameters:
