  /gtfs/workspace/projects/{projectId}/owner:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
    post:
      tags:
        - Workspace
      summary: "Hand a project over to one of its members (its owner only: 403 ROLE_REQUIRED; to a member only: 404 MEMBER_NOT_FOUND) — what answers 409 ACCOUNT_PROJECTS_SHARED before deleting an account. The member becomes the owner (the project takes its retention), the former owner stays a member with the approver role, the journal says « handed_over ». → { project } as the caller now reads it."
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  description: The account id of the member who takes the project over.
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceProjectOk"
        "400":
