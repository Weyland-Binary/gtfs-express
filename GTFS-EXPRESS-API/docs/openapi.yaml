  /gtfs/telemetry/ui:
    post:
      tags:
        - Accounts
      summary: "A step of the way to the licence the web saw, counted for the operator's console (services/admin/funnel): a visit, « Modifier » clicked, the offer shown, the sign-in opened, a way to the licence chosen. Kept with where it was asked from (a closed list per step; anything else is « other »), the signed-in account if any, and a visitor key that changes every day (no address); a visit keeps the host name of the site it came from, and is kept once per visitor and day. Nothing is kept when accounts are off. 204 whether kept or not (past 120 steps per 10 minutes from one address, nothing is kept); 400 INVALID_INPUT for a step outside the list."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step]
              properties:
                step:
                  type: string
                  enum: [visit, modify.click, offer.shown, signin.open, offer.choice, mobile.share, mobile.relay]
                source:
                  type: string
                  description: "Where it was asked from — visit: home, reader, project, share; modify.click: home, reader; offer.shown: studio, edit, deliver, refusal, pricing; signin.open: header, offer, paywall, assistant, lock; offer.choice: trial, year, month, quote, quote_mail; mobile.share: home, relay; mobile.relay: shown, continue."
                ref:
                  type: string
                  description: The referring site's host name (a visit only).
      responses:
        "204":
          description: Received.
        "400":
          $ref: "#/components/responses/BadRequest"
  /gtfs/config/plans:
    get:
      tags:
        - Config
      summary: The offer (« free », reading, and « pro », the licence) with its prices, limits and checkout, and the caller's plan.
      description: >
        plans[].price_eur is the yearly price excluding VAT (the « pro » licence's is LICENCE_PRICE_EUR_YEAR, the
        price the payment provider charges), price_eur_month the monthly one. The « pro » plan carries
        launch: { offer: boolean, until: "YYYY-MM-DD" | null }: offer true while the yearly price is shown as the
        launch price (LICENCE_LAUNCH_OFFER, on by default), until its announced last day (LICENCE_LAUNCH_UNTIL, UTC)
        or null when no end is announced; past that day offer is false. quote says whether a quote can be asked.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
  /gtfs/diff:
    post:
      tags:
        - Diff
      summary: Compare the session feed against another uploaded session.
      description: >
        Read-only feed-to-feed comparison. The base feed is the caller's
        session (X-Session-ID); the comparison target is another uploaded
        session referenced by `otherSessionId` ("after" side). Returns
        per-table added/removed/changed counts plus up to `sampleLimit`
        example rows per category; tables with a surrogate primary key are
        compared by full row content and only report added/removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otherSessionId]
              properties:
                otherSessionId:
                  type: string
                  format: uuid
                  description: Session id of the feed to compare against.
      security:
        - SessionId: []
      responses:
        "200":
          description: Per-table diff with summary counts and bounded samples.
          content:
            application/json:
              schema:
                type: object
                properties:
                  base: { type: string, format: uuid }
                  other: { type: string, format: uuid }
                  sampleLimit: { type: integer }
                  summary:
                    type: object
                    properties:
                      added: { type: integer }
                      removed: { type: integer }
                      changed: { type: integer }
                      tablesWithChanges: { type: integer }
                  tables:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        keyed: { type: boolean }
                        added: { type: integer }
                        removed: { type: integer }
                        changed: { type: integer }
                        samples: { type: object }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /gtfs/sql:
    post:
      tags:
        - SQL
      summary: Run a read-only SQL query (SELECT / WITH / EXPLAIN / read-only PRAGMA).
      requestBody:
        $ref: "#/components/requestBodies/SqlQuery"
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/SqlOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/EditModeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
  /gtfs/sql/export.csv:
    post:
      tags:
        - SQL
      summary: Stream a read-only SQL result as CSV (bypasses the 10k-row UI cap).
      requestBody:
        $ref: "#/components/requestBodies/SqlQuery"
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/CsvOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /gtfs/sql/schema:
    get:
      tags:
        - SQL
      summary: SQLite schema introspection for the SQL console (read mode).
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/sql/nl2sql:
    post:
      tags:
        - AI
      summary: Generate a SQL query from a natural-language prompt (the model; a licensed account's caps).
      description: One-shot NL2SQL. The generated SQL is returned for review — never executed server-side.
        Kill-switched via `NL2SQL_ENABLED` (503 when off).
      requestBody:
        $ref: "#/components/requestBodies/NlPrompt"
      security:
        - SessionId: []
          SessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "403":
          $ref: "#/components/responses/EditModeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SessionSaturated"
  /gtfs/sql/nl2sql-chat:
    post:
      tags:
        - AI
      summary: Tool-using GTFS chat assistant (Server-Sent Events stream; the licence, or the reading companion's free questions).
      description: |
        The reader's assistant: it reads the feed and never changes it. Each turn streams `meta`,
        then any number of tool events (`tool_pending`, `step_start`/`step_result` for read-only
        SQL, `ui_action`, `chart`, `audit`, `journey`, `change`), `token` deltas of the markdown
        answer, optional `followups`, `usage`, `done`. A `change` { changeId, brief, sql? } (the
        `suggest_change` tool) is a change the user asked for, written as a brief: the web offers to
        prepare it in a draft with a brief (the direct mode: an agent makes it, an independent review
        checks it, the user decides), and with Expert on to open `sql` in the SQL console, never run.
        A licence holding `studio` grants full access. Under the paid offer a signed-in account
        without it gets the reading companion: `READER_AI_QUESTIONS_MONTH` questions per calendar
        month (UTC), counted per account, with the same read-only tools (a change written as a brief is
        prepared in a draft with the licence) and the licence's chat model; `meta` carries `reader: true` and `freeRemaining` (questions
        left this month). Spent: 403 `FREE_QUOTA_EXHAUSTED` { scope: "month", limit, resets
        (YYYY-MM-DD, the first day of the next month) }; its envelope in euros
        (`READER_AI_BUDGET_EUR_MONTH`) spent: 402 `AI_ALLOWANCE_EXHAUSTED` { allowance, retryAfterSec }.
        A visitor without an account: 401 `NOT_SIGNED_IN` { entitlement: "reader", paid: true }.
        With `READER_AI_QUESTIONS_MONTH=0` the others get a small free-trial allowance per session
        (`NL2SQL_FREE_MESSAGES_PER_SESSION`, typed 403 `FREE_QUOTA_EXHAUSTED` once spent), or 402
        `SUBSCRIPTION_REQUIRED` when it is 0. Model-generated mutations are never executed by this
        endpoint — they are surfaced as `sql_blocked` drafts the guided RepairFlow applies through
        the regular `/gtfs/edit/sql` pipeline. Kill-switched via `NL2SQL_CHAT_ENABLED` (503 when
        off). Pre-stream errors return JSON envelopes.
      requestBody:
        $ref: "#/components/requestBodies/ChatTurn"
      security:
        - SessionId: []
          SessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/SseOk"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "402":
          description: "SUBSCRIPTION_REQUIRED { entitlement: studio } (no licence, the reading companion off and no free message), or AI_ALLOWANCE_EXHAUSTED { allowance, retryAfterSec } (the reading companion's envelope of the month spent)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/EditModeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SessionSaturated"
  /gtfs/sql/nl2sql-chat/feedback:
    post:
      tags:
        - AI
      summary: Thumbs up/down on an assistant chat turn (quota-free telemetry).
      description: Appends a feedback record (turnId + rating "up"|"down") to the chat usage log and
        records a `chat.feedback` event. Session-gated; never consumes free-trial or AI quota.
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
  /gtfs/sql/nl2sql-chat/attachment:
    post:
      tags:
        - AI
      summary: Attach a tabular file (CSV/TSV/XLSX) to the chat — imported as a read-only session table.
      description: Parses the spreadsheet server-side (separator sniffing, Latin-1 fallback, SheetJS for
        XLSX) and imports it as a `_chat_att_<n>` TEXT table in the session DB so assistant SQL can
        JOIN it against GTFS data. Caps — 5 MB, 5000 rows, 64 columns, 3 tables/session (env-tunable).
        Same access gate as the chat endpoint; dedicated per-session rate limit. Typed errors —
        `UNSUPPORTED_FORMAT`, `ATTACHMENT_EMPTY`, `ATTACHMENT_TOO_MANY_COLUMNS` (400),
        `ATTACHMENT_LIMIT_REACHED` (409), `ATTACHMENT_TOO_LARGE` (413). Kill-switched with the chat
        via `NL2SQL_CHAT_ENABLED` (503 when off).
      requestBody:
        $ref: "#/components/requestBodies/ChatAttachmentUpload"
      security:
        - SessionId: []
          SessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SessionSaturated"
  /gtfs/sql/nl2sql-chat/attachment/{table}:
    delete:
      tags:
        - AI
      summary: Remove a chat attachment table from the session.
      description: Drops the `_chat_att_<n>` table and its metadata. Session-gated only (destroys the
        caller's own uploaded data; never consumes chat quota) and available even when the chat
        kill-switch is off, so leftover tables can always be removed.
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
            pattern: "^_chat_att_[0-9]+$"
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
  /gtfs/config/features:
    get:
      tags:
        - Config
      summary: "Public feature flags (NL2SQL / chat availability, accounts) consumed at frontend boot. `accounts` = { enabled, signedIn, entitlements } reflects the caller's session cookie when accounts are on. `chat.reader`, the reading companion under the paid offer for a caller without the licence: { limit, used, remaining, resets } for a signed-in account, { signInRequired: true, limit } for a visitor, null otherwise (no paid offer, the companion off, the licence, or the chat unavailable)."
      security: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
  /gtfs/auth/code:
    post:
      tags:
        - Accounts
      summary: "Send a six-digit sign-in code to an address (no password: the code verifies the address, and the first one creates the account). Always 202 for a well-formed address, whether an account exists or not (no enumeration; a disabled account gets no message). The code is kept as a keyed hash, expires after 10 minutes and allows 5 tries. 400 INVALID_INPUT, 429 LOGIN_CODE_TOO_SOON { retry_after_s } (one code a minute and six an hour per address; also 10 requests per 15 min per IP), 503 MAIL_UNAVAILABLE when the server has no e-mail provider, 502 MAIL_PROVIDER_ERROR when the provider refuses."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                language:
                  type: string
                  description: The message's language (en fr es de pt zh hi; French when absent).
      responses:
        "202":
          description: The code is on its way (or nothing is sent, the same answer).
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                  expires_in_s:
                    type: integer
                  resend_after_s:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /gtfs/auth/code/verify:
    post:
      tags:
        - Accounts
      summary: "Check the code and open a session (sets the gtfs_session cookie: HttpOnly, SameSite=Lax, Secure over https). The first verified code of an address creates its account (201, `created: true`), later ones sign in (200); the address is then verified. 401 LOGIN_CODE_INVALID { attempts_left }, 410 LOGIN_CODE_EXPIRED (or none asked), 429 LOGIN_CODE_LOCKED after 5 wrong tries (ask a new code), 403 ACCOUNT_DISABLED. With purpose « admin » (the operator's console) only an address of ADMIN_EMAILS is signed in; any other gets 403 ADMIN_ACCESS_DENIED, no account created and no session opened, and the refusal is recorded among the administrator's acts (console.denied, the address masked)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                purpose:
                  type: string
                  enum: [admin]
      responses:
        "200":
          $ref: "#/components/responses/AccountOk"
        "201":
          $ref: "#/components/responses/AccountOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/EntitlementRequired"
        "410":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/auth/logout:
    post:
      tags:
        - Accounts
      summary: "Sign out: deletes the session and clears the cookie (204 even when not signed in). With `everywhere: true`, a signed-in account ends every one of its sessions, on every device (each signs in again by a code)."
      security:
        - SessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                everywhere: { type: boolean, description: "End every session of the account, not only this one." }
      responses:
        "204":
          description: Signed out.
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/auth/me:
    get:
      tags:
        - Accounts
      summary: "The signed-in account (id, email, email_verified, display_name, entitlements, licence { active, source: owner | subscription | admin | trial, until, unlimited, trial_available, trial_until }, created_at)."
      security:
        - SessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/AccountOk"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
    patch:
      tags:
        - Accounts
      summary: "Change the account's display name (the name the projects' journal shows; up to 80 characters, empty clears it). 400 INVALID_INPUT."
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  nullable: true
                  maxLength: 80
      responses:
        "200":
          $ref: "#/components/responses/AccountOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
    delete:
      tags:
        - Accounts
      summary: "Delete the account, by its owner (the right to erasure). The account's e-mail is typed in `confirm` (400 CONFIRMATION_REQUIRED otherwise). A project the account holds and shares with other accounts is never deleted under them: 409 ACCOUNT_PROJECTS_SHARED, with the projects, their members and `action: hand_over`, until each is handed over to a member (POST /gtfs/workspace/projects/{projectId}/owner) or its members are removed. Then: every session of the account is revoked and its cookie cleared, the projects it holds are deleted (versions, documents, the public share link their delivery published), its name in the journal, reviews, acknowledgements and contract of the other projects it took part in — a project it was removed from included — is replaced by « compte supprimé » while the facts (what, when, which clause) stay, its memberships are removed, the public shares it created are deleted, its id in the event log is replaced by a pseudonym (deleted:<keyed hash>), and the account is deleted."
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: The account's e-mail address, typed by the person (trimmed, case-insensitive).
      responses:
        "200":
          description: The account is deleted; what was removed or anonymised, counted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  projects_deleted:
                    type: integer
                  projects_anonymised:
                    type: integer
                  shares_removed:
                    type: integer
                  sessions_revoked:
                    type: integer
                  studio:
                    type: object
                    properties:
                      deleted:
                        type: integer
                      anonymised:
                        type: integer
        "400":
          description: "CONFIRMATION_REQUIRED: the e-mail typed is missing or is not the account's."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "409":
          description: "ACCOUNT_PROJECTS_SHARED: projects held by the account are shared with others. `projects`: [{ kind: workspace | studio, id, name, members: [{ user_id, name, role }] }]; `action`: hand_over."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      action:
                        type: string
                        enum: [hand_over]
                      projects:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum: [workspace, studio]
                            id:
                              type: string
                            name:
                              type: string
                            members:
                              type: array
                              items:
                                type: object
                                properties:
                                  user_id:
                                    type: string
                                  name:
                                    type: string
                                    nullable: true
                                  role:
                                    type: string
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/auth/me/export:
    get:
      tags:
        - Accounts
      summary: "The account's data as a JSON file (the rights of access and portability), `Content-Disposition: attachment`, never cached: the profile (id, email, whether and when it was verified, display_name, entitlements, the licence and its end, dates), the dates of its sessions, the projects it holds or is a member of (id, name, job, its role, the members' count, dates, retention), and the journal lines, reviews, acknowledgements and contract decisions it signed in them and in the projects it was removed from (a record carrying an account id by that id alone, one without by its name or e-mail). No hash, password, code or token, and nothing of another person beyond the project names."
      security:
        - SessionCookie: []
      responses:
        "200":
          description: "The export (`format: gtfs-express/account-export@1`)."
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="gtfs-express-mes-donnees-YYYY-MM-DD.json"'
          content:
            application/json:
              schema:
                type: object
                properties:
                  format:
                    type: string
                  exported_at:
                    type: string
                    format: date-time
                  account:
                    type: object
                  sessions:
                    type: array
                    items:
                      type: object
                  projects:
                    type: array
                    items:
                      type: object
                  journal:
                    type: array
                    items:
                      type: object
                  reviews:
                    type: array
                    items:
                      type: object
                  acknowledgements:
                    type: array
                    items:
                      type: object
                  decisions:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/admin/mail/outbox:
    get:
      tags:
        - Accounts
      summary: "The last 50 messages of the `memory` mail provider (MAIL_PROVIDER=memory: the tests and the end-to-end runs read a sign-in code there), newest first; empty with any other provider."
      security:
        - AdminToken: []
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        to:
                          type: string
                        subject:
                          type: string
                        text:
                          type: string
                        at:
                          type: string
                          format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
  /gtfs/admin/users:
    get:
      tags:
        - Accounts
      summary: "List the accounts (no hashes; adds last_login_at, disabled, granted, grant_until, trial_until, and the console's columns: calls over 30 days, devices, last activity, projects, deliveries, the reading companion's questions this month)."
      security:
        - AdminToken: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/admin/users/{id}:
    get:
      tags:
        - Admin
      summary: "One account in full: the listing's fields, its AI cost (total, per month, function and model), the reading companion's questions this month, its API calls over 30 days (per day and route), its devices (sign-in sessions: created, last seen, expiry, a hashed user agent), its projects (owned or member), its last events, the e-mails it was sent (address masked) and the administrator's acts on it. 404 USER_NOT_FOUND, 503 ACCOUNTS_DISABLED."
      security:
        - AdminToken: []
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/admin/users/{id}/logout:
    post:
      tags:
        - Admin
      summary: "End every sign-in session of the account (its devices sign in again by a code); recorded among the administrator's acts. → { ended }. 404 USER_NOT_FOUND, 503 ACCOUNTS_DISABLED."
      security:
        - AdminToken: []
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/admin/users/{id}/entitlements:
    post:
      tags:
        - Accounts
      summary: "Grant or revoke entitlements ({ studio?, edit?, disabled? }, booleans; `until`: the grant's last day, YYYY-MM-DD, or null for no end — the licence bought on a quote). Disabling an account ends its sessions. 404 USER_NOT_FOUND."
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studio:
                  type: boolean
                edit:
                  type: boolean
                disabled:
                  type: boolean
                until:
                  type: string
                  format: date
                  nullable: true
                kind:
                  type: string
                  enum: [client, tester]
                  description: "A client's licence (bought on a quote) or a tester's: the same rights, the tester's own AI envelope (TESTER_AI_BUDGET_USD_MONTH), counted apart in the console."
      responses:
        "200":
          $ref: "#/components/responses/AccountOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/billing/checkout:
    post:
      tags:
        - Billing
      summary: "A payment page for a plan (pro | team): a Checkout session created server side (mode stripe; client reference and metadata = the account's id; the return address is BILLING_RETURN_URL, else the request's allowed Origin, with ?billing=success|cancel on `return_path`), or the plan's payment link with the account as client_reference_id (mode link). Returning from it proves nothing: only the webhook opens the paid features. 409 SUBSCRIPTION_ACTIVE { portal } when the account already has one, 503 BILLING_UNAVAILABLE when payments are not configured, 502 BILLING_PROVIDER_ERROR when the provider refuses."
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  enum: [pro, team]
                period:
                  type: string
                  enum: [year, month]
                  description: How the licence is billed (default year); month is without commitment, online only
                    (STRIPE_PRICE_PRO_MONTHLY or STRIPE_CHECKOUT_URL_PRO_MONTHLY; 503 BILLING_UNAVAILABLE without it).
                return_path:
                  type: string
                  description: The web page to come back to (a same-origin path; anything else returns to /).
      responses:
        "200":
          description: The payment page to open.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  mode:
                    type: string
                    enum: [stripe, link]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/billing/portal:
    post:
      tags:
        - Billing
      summary: "The provider's management page for the account's subscription (change the plan or the card, cancel), returning to `return_path` with ?billing=portal. 404 SUBSCRIPTION_NOT_FOUND without a subscription, 503 BILLING_UNAVAILABLE, 502 BILLING_PROVIDER_ERROR."
      security:
        - SessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                return_path:
                  type: string
      responses:
        "200":
          description: The management page to open.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/billing/subscription:
    get:
      tags:
        - Billing
      summary: "The account's subscription as the provider last said it (plan, status, active, current_period_end, cancel_at_period_end; null without one), its licence (where it comes from — the operator's own address, the subscription, the administrator's grant, the free trial — and its end), its effective entitlements and the plan it resolves to. Never cached."
      security:
        - SessionCookie: []
      responses:
        "200":
          description: The subscription, the entitlements, the plan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    type: object
                    nullable: true
                  entitlements:
                    type: array
                    items:
                      type: string
                  licence:
                    type: object
                  plan:
                    type: object
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/billing/trial:
    post:
      tags:
        - Billing
      summary: "Start the free trial of the licence (TRIAL_DAYS, 14 by default) with who tries it (name, organisation and its role — authority, operator, consultancy, other —, optionally the network and a phone; 400 INVALID_INPUT { missing, roles } without them; `language` writes the trial's three e-mails — started, ending in three days, ended — in that language): every modification and the assistant (capped at TRIAL_AI_DAILY_LIMIT a day and at TRIAL_AI_BUDGET_EUR in all, 5 € by default, summed from each call's real cost: spent, the AI routes answer 402 AI_ALLOWANCE_EXHAUSTED { allowance }) until its end, but the modified network never leaves during it — the paid exits (GET /edit/export, /network/{id}/export.zip, the workspace package, its marking and its download, a previewed plan's change list as CSV or JSON) answer 402 TRIAL_NO_DELIVERY { entitlement: deliver }, and a working copy changed under the trial is marked so that the free exits (POST /share and /share/{token}/versions, POST /sql/export.csv) refuse it the same way unless the account's licence is not a trial; the work is kept and leaves once the licence is taken. Once per mailbox, even after the account is deleted (a keyed hash of its canonical address is kept three years: a « + » suffix and Gmail's dots ignored). 409 LICENCE_ACTIVE when a licence already runs, 409 TRIAL_USED, 403 TRIAL_EMAIL_REFUSED for a throwaway address, 403 EMAIL_UNVERIFIED, 503 TRIAL_UNAVAILABLE when the server offers none."
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, organisation, role]
              properties:
                name: { type: string, maxLength: 80 }
                organisation: { type: string, maxLength: 160 }
                role: { type: string, enum: [authority, operator, consultancy, other] }
                network: { type: string, maxLength: 160 }
                phone: { type: string, maxLength: 40 }
                language: { type: string, description: "Two letters: the language of the trial's e-mails." }
      responses:
        "200":
          $ref: "#/components/responses/AccountOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/EntitlementRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /gtfs/billing/quote:
    post:
      tags:
        - Billing
      summary: "Ask the operator for a quote (purchase order, transfer): an e-mail to PLAN_CONTACT_EMAIL (else SUPPORT_EMAIL), the person's address as its reply-to; the operator then grants the licence with its end date (POST /gtfs/admin/users/{id}/entitlements, `until`). Signed in or not. 400 INVALID_INPUT, 503 QUOTE_UNAVAILABLE without an operator's address or an e-mail provider, 429 with the sign-in requests' limiter (10 per 15 min per IP)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation, name, email]
              properties:
                organisation:
                  type: string
                  maxLength: 160
                name:
                  type: string
                  maxLength: 120
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  maxLength: 40
                seats:
                  type: integer
                  minimum: 1
                message:
                  type: string
                  maxLength: 2000
      responses:
        "202":
          description: The request is sent to the operator.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /gtfs/billing/webhook:
    post:
      tags:
        - Billing
      summary: "The payment provider's events, raw body, signed (Stripe-Signature: HMAC-SHA256 of `<t>.<body>` with STRIPE_WEBHOOK_SECRET, five minutes' tolerance). checkout.session.completed links the subscription to the account named by its client reference; customer.subscription.created|updated|deleted write its plan, status and period. Each event is applied once (a retried one answers duplicate: true) and forgotten again when its handling fails, so that the provider's retry applies it. 400 BILLING_SIGNATURE_INVALID, 503 BILLING_UNAVAILABLE without the secret."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Received (handled, or a duplicate).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  handled:
                    type: boolean
                  duplicate:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/AccountsDisabled"
  /gtfs/edit/enter:
    post:
      tags:
        - Edit Session
      summary: Enter edit mode for the session (the licence's `edit` under the paid offer).
      security:
        - SessionId: []
          SessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/EditModeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
  /gtfs/edit/exit:
    post:
      tags:
        - Edit Session
      summary: Exit edit mode.
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
  /gtfs/session/status:
    get:
      tags:
        - Edit Session
      summary: When the working copy will be swept — read only, never a touch (the heartbeat prolongs it).
      description: >-
        The idle time the sweep counts (folder, database, WAL, heartbeat) and the moment the session
        expires, so the web says "expires in 10 min — Prolong" from T-10 min (target design §3.2, §9).
        When a workspace project runs on this working copy, `snapshot` says how many edits stand since
        its last version and the snapshot triggers (D38). 400 INVALID_SESSION without a valid id, 404
        SESSION_NOT_FOUND once the copy is gone.
      security:
        - SessionId: []
      responses:
        "200":
          description: The working copy's expiry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  ttlMs:
                    type: integer
                  idle_ms:
                    type: integer
                  expires_at:
                    type: string
                    format: date-time
                  remaining_ms:
                    type: integer
                  snapshot:
                    nullable: true
                    type: object
                    properties:
                      edits_since_version:
                        type: integer
                      version_id:
                        type: string
                        nullable: true
                        description: "The project's version this working copy is — restored from (« Reprendre », « Rouvrir vN ») or last frozen as — or null: an export with no retouch since delivers that version."
                      last_edit_at:
                        type: string
                        nullable: true
                      snapshot_at:
                        type: string
                        nullable: true
                      edits_threshold:
                        type: integer
                      idle_minutes:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"
  /gtfs/workspace/token:
    post:
      tags:
        - Workspace
      summary: "A new browser token (256 bits, base64url, 43 characters): returned once, stored hashed (HMAC-SHA256)."
      description: >-
        The browser keeps it (localStorage) and sends it in the X-Client-Token header, never in a URL; it
        owns the projects the browser keeps without an account (D39). Its own hourly budget per IP.
      responses:
        "201":
          description: The token, and the workspace's caps.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{43}$"
                  retention_days:
                    type: integer
                  max_projects:
                    type: integer
                  max_versions:
                    type: integer
                  max_version_bytes:
                    type: integer
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects:
    get:
      tags:
        - Workspace
      summary: "The caller's projects (account or browser token), the last written first — Home's list, never the whole documents; nothing of another owner."
      description: >-
        Signed in with this browser's live token too, the list holds the account's projects AND the
        token's projects not attached yet (`owner.via: browser`): signing in never hides a browser's work
        before it is attached (D5, D39). GET, PATCH and DELETE of a project follow the same rule.
      security:
        - ClientToken: []
        - SessionCookie: []
      responses:
        "200":
          description: One line per project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceProjectSummary"
                  retention_days:
                    type: integer
                  max_projects:
                    type: integer
                  max_versions:
                    type: integer
                  max_version_bytes:
                    type: integer
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
    post:
      tags:
        - Workspace
      summary: "Keep a project the web made (its 10-hex id, its job) on the server."
      description: >-
        400 INVALID_ID when the id is not 10 hexadecimal characters or is taken (the web draws another),
        400 INVALID_INPUT without a job, 409 TOO_MANY_PROJECTS past the browser's quota
        (WORKSPACE_MAX_PROJECTS; no quota on an account), 413 PROJECT_TOO_LARGE above 900 KB.
      security:
        - ClientToken: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  $ref: "#/components/schemas/WorkspaceProject"
      responses:
        "201":
          $ref: "#/components/responses/WorkspaceProjectOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
    get:
      tags:
        - Workspace
      summary: "The project in the JSON shape of target design §2.4, its versions merged with their zips; ETag = its data_version. 404 PROJECT_NOT_FOUND for a stranger's id as for an unknown one."
      security:
        - ClientToken: []
        - SessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceProjectOk"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
    patch:
      tags:
        - Workspace
      summary: "The autosave: the fields the web writes, compare-and-set on data_version (If-Match)."
      description: >-
        If-Match carries the data_version the write was made from ("2" or 2); a stale one answers 409
        AUTOSAVE_CONFLICT with `data_version` and the `project` as it now is ("Recharger / Garder ma
        copie"); If-Match: * writes over it on purpose and the journal records `actor`
        (action "overwrite"). Without If-Match: 400 INVALID_INPUT. The server's own fields (id, job,
        owner, created_at, updated_at, retention_until, data_version) are never taken from the body;
        every write moves updated_at and the retention. 413 PROJECT_TOO_LARGE above 900 KB. A version
        the document marks delivered (`delivered_at`) is protected from the purge from then on. The
        journal is append-only: the body's lines are merged over the stored ones, never replace them
        (the server's own lines — delivered, overwrite — stay). On a shared project (one with members) a
        version is delivered only approved (D19): `delivered_at` / `delivered_by` set on a version that
        is not approved, the `delivery` record (all but its `share`) naming one, and a new journal line
        "delivered" for one are not taken — the stored values stay; a version the server marked
        delivered keeps its marks.
      security:
        - ClientToken: []
        - SessionCookie: []
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The data_version read (ETag), or * to write over another writer.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  $ref: "#/components/schemas/WorkspaceProject"
                actor:
                  type: string
                  description: Who writes over another writer (If-Match *), for the journal.
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceProjectOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "403":
          $ref: "#/components/responses/RoleRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "AUTOSAVE_CONFLICT: the project changed since the version the write names."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [AUTOSAVE_CONFLICT]
                  message:
                    type: string
                  data_version:
                    type: integer
                  project:
                    $ref: "#/components/schemas/WorkspaceProject"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
    delete:
      tags:
        - Workspace
      summary: "Forget a project: its record, its versions' zips, its documents. Its owner only (a member: 403 ROLE_REQUIRED)."
      security:
        - ClientToken: []
        - SessionCookie: []
      responses:
        "204":
          description: Removed.
        "403":
          $ref: "#/components/responses/RoleRequired"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/bind:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
    post:
      tags:
        - Workspace
      summary: "The working copy (X-Session-ID) the project runs on: its edits are frozen as snapshot versions (D38) — after SNAPSHOT_EDITS edits, SNAPSHOT_IDLE_MINUTES after the last one, and before the sweeper removes the copy. The copy's country is kept with the project (its package validates under it). A draft's session id is refused 409 DRAFT_NOT_APPLIED."
      security:
        - ClientToken: []
          SessionId: []
      responses:
        "200":
          description: Bound.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bound:
                    type: boolean
                  last_edit_id:
                    type: integer
                  snapshot_edits:
                    type: integer
                  snapshot_idle_minutes:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/versions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
    post:
      tags:
        - Workspace
      summary: "Freeze the working copy (X-Session-ID) as a version of the project: a GTFS zip kept with it, never handed to anyone."
      description: >-
        The files as opened while nothing was edited (v0 is the network as opened, D46), else the
        edited tables. `n` is the web's number when it is free, else the next one. The caps per project
        (D49): WORKSPACE_MAX_VERSIONS zips and WORKSPACE_MAX_VERSION_BYTES in all; beyond them the
        oldest version that is neither the reference nor delivered is purged (`purged`, its record
        stays); with only protected versions left the new zip is refused (409 TOO_MANY_VERSIONS, 413
        VERSION_TOO_LARGE). kind "snapshot" with snapshot_reason "manual" is "Figer en version": refused
        with 409 NOTHING_TO_FREEZE while no retouch stands since the project's last version (an identical
        zip would only count against the caps). The reference (kind "reference") is always the files as
        opened, never a retouch. A draft's session id is refused 409 DRAFT_NOT_APPLIED: a draft is
        frozen only once applied on its working copy. Any kind but the reference is numbered from 1
        (0 is the reference's alone: a client-chosen 0 is not taken). A version is frozen once: an id already frozen (its zip kept or
        purged) is refused before anything is written, 409 VERSION_FROZEN { n } — its zip and its
        fingerprint never change under an approval or a delivery (D50); the one exception is the
        reference replaced when the network is chosen again at ①. 404 SESSION_NOT_FOUND when the
        working copy is gone. Its own hourly budget per IP.
      security:
        - ClientToken: []
          SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: object
                  required: [id, kind]
                  properties:
                    id:
                      type: string
                      pattern: "^[a-f0-9]{10}$"
                    n:
                      type: integer
                    kind:
                      type: string
                      enum: [reference, applied, snapshot, delivered]
                    name:
                      type: string
                    at:
                      type: string
                    snapshot_reason:
                      type: string
                      enum: [edits, idle, before_expiry, manual]
      responses:
        "201":
          description: The version frozen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    $ref: "#/components/schemas/WorkspaceVersion"
                  purged:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        n:
                          type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
      - $ref: "#/components/parameters/WorkspaceVersionId"
    delete:
      tags:
        - Workspace
      summary: "Withdraw a version and its zip (\"Annuler l'application\", D37): never the reference nor a delivered version (409 VERSION_PROTECTED)."
      security:
        - ClientToken: []
          SessionCookie: []
      responses:
        "204":
          description: Withdrawn.
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/versions/{versionId}/restore:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
      - $ref: "#/components/parameters/WorkspaceVersionId"
    post:
      tags:
        - Workspace
      summary: "« Reprendre » (D46): a new working copy from the version's frozen zip — never a new download of the catalogue."
      description: >-
        The zip is ingested like an upload (validated, migrated) into a new session bound to the project;
        its modification baseline is the PROJECT's (the validation of the network its work started
        from), never the restored version's own report — a snapshot's retouches are not "pre-existing"
        errors; a project without one demands zero errors. The session's own export, share and commit
        stay gated (G1). The zip's bytes are hashed before anything is extracted: 409 VERSION_CORRUPT when
        they no longer match the fingerprint recorded at the freeze (nothing restored), and `version.sha256`
        is the hash of the bytes restored. 409 VERSION_MISSING when the zip was purged, 404
        VERSION_NOT_FOUND. Its own hourly budget per IP.
      security:
        - ClientToken: []
        - SessionCookie: []
      responses:
        "201":
          description: The new working copy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  validationReport:
                    type: object
                    additionalProperties: true
                  counts:
                    type: object
                    additionalProperties: true
                  version:
                    type: object
                    properties:
                      id:
                        type: string
                      n:
                        type: integer
                      kind:
                        type: string
                      sha256:
                        type: string
                        description: The SHA-256 of the zip restored, computed at the restore (equal to the fingerprint frozen).
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/versions/{versionId}/coherence:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
      - $ref: "#/components/parameters/WorkspaceVersionId"
    get:
      tags:
        - Workspace
      summary: "A frozen version's coherence report (target design §6.2, WP10): the report of the network as the version froze it, read back from its zip — never the working copy."
      description: >-
        The zip's bytes are hashed against the fingerprint recorded at the freeze before they are read
        (409 VERSION_CORRUPT); a purged zip answers 409 VERSION_MISSING. The version is read into tables
        of its own, once per fingerprint, that no one holds (no export, share or commit can name them).
        Query as GET /gtfs/network/coherence: offset, limit, region, clauses (at most 240: 409 TOO_MANY_CLAUSES
        { max, count } beyond; a long list of clauses travel in the body of the POST form below). `version`
        adds the version's id, n and sha256. Its own hourly budget per IP (the workspace's).
      security:
        - ClientToken: []
        - SessionCookie: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: region
          in: query
          schema:
            type: string
        - name: clauses
          in: query
          description: The clauses (JSON) the anomalies cross-check.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "403":
          $ref: "#/components/responses/RoleRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
    post:
      tags:
        - Workspace
      summary: "The same frozen version's coherence report, the clauses in the body (2026-10-06: a long list of clauses — up to 240 — no longer fit a URL)."
      description: >-
        Same handler, same report, same budget as the GET form; offset, limit and region stay in the query, the
        clauses come in the JSON body ({ clauses }: every one, none cut; more than 240 → 409 TOO_MANY_CLAUSES
        { max, count }).
      security:
        - ClientToken: []
        - SessionCookie: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: region
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoherenceClausesBody"
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "403":
          $ref: "#/components/responses/RoleRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/versions/{versionId}/diff:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
      - $ref: "#/components/parameters/WorkspaceVersionId"
    get:
      tags:
        - Workspace
      summary: "« Diff v0 → vN » (WP10): what changed between two frozen versions, per table — the explorer's comparison (POST /gtfs/diff) on the versions read back from their zips."
      description: >-
        `from` names the older version; without it, the project's reference (v0), else its first frozen
        version. → { from: { id, n, kind }, to: { id, n, kind }, sampleLimit, summary { added, removed,
        changed, tablesWithChanges }, tables { <table>: { added, removed, changed, samples } } }. 409
        VERSION_MISSING / VERSION_CORRUPT as the coherence route; 400 INVALID_INPUT for a version
        compared with itself.
      security:
        - ClientToken: []
        - SessionCookie: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            pattern: "^[a-f0-9]{10}$"
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "403":
          $ref: "#/components/responses/RoleRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/versions/{versionId}/review:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
      - $ref: "#/components/parameters/WorkspaceVersionId"
    post:
      tags:
        - Workspace
      summary: "The approval of a version (D19, with accounts): submit (contributor), approve or reject (approver) — named, commented."
      description: >-
        Transitions: none or rejected → in_review (submit), in_review → approved (approve) or rejected
        (reject, a comment required). Named after the account that makes it (its display name, else its
        email) — a `by` in the body is ignored: the journal and the manifest's approval print the
        account's name, never one the request supplies. Bound to the zip it reviewed: the review keeps
        the version's fingerprint, and a review whose fingerprint is not the version's counts as none.
        401 NOT_SIGNED_IN without an account, 409 PROJECT_NOT_ATTACHED for a project only a browser
        holds, 403 ROLE_REQUIRED below the action's role, 409 INVALID_TRANSITION from a status the action
        cannot leave, 409 VERSION_MISSING for a version whose zip is not kept, 400 INVALID_INPUT for the
        reference (never submitted) or an unknown action. A shared project (one with members) delivers a
        version only once approved.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [submit, approve, reject]
                comment:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: "{ approval: { status, review }, review, project } — the project as GET returns it."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/RoleRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/versions/{versionId}/package:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
      - $ref: "#/components/parameters/WorkspaceVersionId"
    post:
      tags:
        - Workspace
      summary: "« Tout le paquet » (D50): the version's deliverables in one zip with its manifest.json. A DELIVERY: the version's zip goes through the canonical validator before anything is written."
      description: >-
        The zip holds `<network>_v<N>_<date>.zip` (the version's GTFS, its bytes checked against the
        fingerprint frozen — 409 VERSION_CORRUPT otherwise), the version's coherence report as a
        workbook and a PDF (mission step 7, read from the version), the summary note when the web sends
        one (`note.content`, HTML, 600 KB at most), and `manifest.json`: { schema, generated_at, author,
        project, network, version { id, n, label, kind, at, by, sha256, verdict }, validator { engine,
        version, report_sha256, errors, warnings, rules, preexisting_errors, new_errors, checked_at },
        and — since the owner's rule of 2026-10-05, from the proof the server recorded with the version
        when it was frozen (versions.proof: the applications' gates of its working copy),
        never from the project document — decision, verdict (the engine's, also version.verdict), open_items
        [{ kind: clause | sources | baseline_errors | current_errors | changes_not_asked | direct_report | hand_decision |
        retouched, id, …, accepted_by { name } | null, accepted_at, basis }] (names
        only, never an e-mail), proof { gates [{ scope, at, edit_id?, acknowledgements }],
        retouched_edits }, acknowledgements
        (the ids of the named records the server recorded with that proof), client_acknowledgements
        (the ids the project document, written by the client, lists up to the version beyond those:
        declared, never attested), approval (named after the approver's
        account, and only when the review's zip fingerprint is the version's), note ({ included: true,
        name } or { included: false, reason: retouched · unavailable · not_sent } — the reason the web
        sends in `note_omitted`), files [{ name, role, bytes, sha256 }] }. Refusals: 503 VALIDATOR_UNAVAILABLE / VALIDATOR_FAILED, 409 VALIDATION_NEW_ERRORS
        above the project's baseline, 409 VALIDATION_ERRORS on any error without one, 409 NOT_APPROVED for a shared project's version not approved (D19), 400
        ACKNOWLEDGEMENT_UNNAMED without the delivering person's name, 409 PROOF_MISSING { n, kind } for a
        version frozen without a gate (the reference, a working copy nothing applied), 409
        BASELINE_ERRORS { errors, rules, preexisting } while the reference feed's own errors are accepted
        by nobody (at an application, or here: `accept.baseline_errors`), 409 OPEN_ITEMS_UNACCEPTED
        { items, count, n } for anything left open nobody accepted (the edits by hand after the last
        gate: `accept.retouched`), 409 VERSION_MISSING; nothing is
        written on a refusal. Kept 24 hours (§2.4), served by GET …/packages/{packageId}. Queued behind
        the compute gate (429 BUSY); the workspace's hourly budget per IP.
      security:
        - ClientToken: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                by:
                  type: object
                  properties:
                    name:
                      type: string
                lang:
                  type: string
                  description: The language of the coherence files (fr by default).
                note:
                  type: object
                  properties:
                    content:
                      type: string
                      description: The summary note (HTML) the flow wrote for this version.
                note_omitted:
                  type: string
                  enum: [retouched, unavailable]
                  description: "Without a note: why (the version is a retouch no note describes, or the note could not be written where the package was asked). Recorded in manifest.note; anything else is recorded as not_sent."
                accept:
                  type: object
                  description: "What the person delivering (`by.name`) accepts here, recorded in manifest.open_items with basis package: `baseline_errors` (the reference feed's own errors the zip still carries), `retouched` (the edits by hand after the last gate)."
                  properties:
                    baseline_errors:
                      type: boolean
                    retouched:
                      type: boolean
      responses:
        "201":
          description: "{ package: { id, name, bytes, sha256, created_at, version_id, n }, manifest, manifest_sha256 }."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "403":
          $ref: "#/components/responses/RoleRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ValidationRefused"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ValidatorUnavailable"
  /gtfs/workspace/projects/{projectId}/packages/{packageId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
      - name: packageId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-f0-9]{16}$"
    get:
      tags:
        - Workspace
      summary: "The package's zip, as POST …/package built it (kept 24 hours; 404 PACKAGE_NOT_FOUND after). X-Manifest-Sha256 carries the SHA-256 of its manifest.json."
      security:
        - ClientToken: []
        - SessionCookie: []
      responses:
        "200":
          description: The package.
          headers:
            X-Manifest-Sha256:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
