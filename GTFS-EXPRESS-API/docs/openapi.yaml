  /gtfs/network/coherence/clauses:
    post:
      tags:
        - Network Studio
      summary: "« Chaque ligne cochée devient une clause » (mission step 7): the rows of the coherence report a person ticks — named by their `key`, never by a value — become clauses of the step-2 vocabulary, built by the server from the report it computes itself on the VERSION (the session's feed; `journey: create` — a network designed here, whose next build measures the design with no feed before it — refuses `keep` row by row, keep_not_measurable): departure_at for the first and the last departure (at the trip's first stop, towards its last), span, headway_max per band window (the longest wait the checker reads, edges counted, rounded up), trips_count, running_time (the main pattern's ends, min and max) and, for « garder cette ligne telle quelle » (`keep`), unchanged_except. Each clause is dated with the dates of the row that run the same timetable of the line as its representative date (`dates`, at most 400; `keep`: every date of the row), carries its provenance (`source`: the report, the version and its date, the version's fingerprint, the row; `origin`: { kind: coherence_row, key, fingerprint, version, date, figures } — the row's figures as the report showed them; never a `quote`, which is the brief's words) and the decision of the named person (decided_by user, decision.by.name, the server's date) — and is MEASURED on that version by the conformance engine before it is returned: one that does not pass is listed in `refused` (self_check_failed), never returned. With `contract`, the clauses are merged into it by the step-3 rules (judge.mergeClauses by the user: a clause a person decided is never reshaped; an empty contract becomes decided by the person) and the merged contract is returned: the next change is measured against them. A DRAFT contract is refused (409 CONTRACT_UNDECIDED): nobody decided it, its clauses are measured by nobody and a version made from it records it empty — step ② decides it first."
      security:
        - SessionId: []
      parameters:
        - $ref: "#/components/parameters/CoherenceRegion"
        - $ref: "#/components/parameters/CoherenceClauses"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoherenceClausesRequest"
      responses:
        "200":
          description: The clauses built and measured, and the contract they were merged into.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoherenceClausesResponse"
        "400":
          description: "INVALID_INPUT (rows: 1 to 40 { key, measures? }; report.fingerprint; a malformed contract), ACKNOWLEDGEMENT_UNNAMED { required: [by.name] } (the clauses are decided by a named person, 2–120 characters), COHERENCE_ROW_UNKNOWN { keys } (no row of the report the server computes has this key: a forged row), INVALID_SESSION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "SESSION_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "CONTRACT_UNDECIDED { status: draft } (the contract sent is a draft: decide it at step ② under a name first), COHERENCE_STALE { fingerprint } (the rows are of another version: report.fingerprint is not the fingerprint of the feed the server reads now — read the report again), TOO_MANY_CLAUSES { max: 240, count } (the contract would hold more than 240 clauses, or more than 240 clauses were sent for the report to cross-check)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "RATE_LIMITED (COHERENCE_EXPORT_RATE_LIMIT_MAX a minute)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
