  /gtfs/edit/undo:
    post:
      tags:
        - History
      summary: Undo the most recent edit (SAVEPOINT replay of stored undo ops).
      description: |-
        Optional body `{ expectedEntryId }`: when provided and the newest active (not undone)
        edit-log entry has a different id, nothing is changed and the call answers **409**
        `{ error: "UNDO_TARGET_NOT_LATEST", latestId, expectedEntryId }`. The success body is
        `{ undone: <HistoryEntry incl. id>, currentState }`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedEntryId:
                  type: integer
                  minimum: 1
                  description: Id of the edit-log entry the client expects to undo (e.g. the
                    `undoEntryId` returned by the mutation).
      security:
        - SessionId: []
      responses:
        "200":
          description: Entry undone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  undone:
                    $ref: "#/components/schemas/HistoryEntry"
                  currentState:
                    type: object
                    nullable: true
                    additionalProperties: true
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session not in edit mode (`SESSION_NOT_IN_EDIT_MODE`), or the newest active
            entry is not the one the client expected (`UNDO_TARGET_NOT_LATEST`, with `latestId`
            and `expectedEntryId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
