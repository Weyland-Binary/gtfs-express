  /gtfs/edit/shapes/{shape_id}:
    get:
      tags:
        - Edit
      summary: Get the ordered point list of a shape.
      parameters:
        - name: shape_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EditModeRequired"
    put:
      tags:
        - Edit
      summary: Replace the full point list of a shape.
      description: |-
        Body `{ points: [{ lat, lon }, …] }`. Sequences are reassigned and `shape_dist_traveled`
        recomputed (metres). For every trip linked to the shape whose stop_times already carry
        `shape_dist_traveled`, the stops are re-projected onto the new polyline and the values
        rewritten (non-decreasing along stop_sequence) in the same transaction / edit-log entry.
        The response carries `stopTimesDistancesUpdated` (number of trips rewritten); the same
        field is returned by `POST /gtfs/edit/shapes` when `link_trip_ids` is used.
      parameters:
        - name: shape_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/EntityCreate"
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/EditOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EditModeRequired"
    delete:
      tags:
        - Edit
      summary: Delete a shape.
      parameters:
        - name: shape_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/EditOk"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EditModeRequired"
