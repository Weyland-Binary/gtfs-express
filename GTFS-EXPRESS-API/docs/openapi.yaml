# GTFS Express API — OpenAPI 3.0.3 surface.
#
# Source of truth for the HTTP contract: src/routes/gtfsRoutes.js (mounted
# under /gtfs) plus GET /health (src/app.js). The Jest test
# src/__tests__/openapiCoverage.test.js enforces a strict bijection between
# this file and the router: adding/removing/renaming a route without
# updating this spec fails the suite.
#
# Served at runtime by src/app.js:
#   GET /gtfs/openapi.yaml — this document
#   GET /gtfs/docs         — interactive Swagger UI
openapi: 3.0.3
info:
  title: GTFS Express API
  version: 1.0.0
  description: |-
    Professional GTFS Schedule editor and validator — REST surface of the GTFS Express backend.

    ## Session model

    The API is **session-based**: `POST /gtfs/upload` (or `GET /gtfs/load-sample`) creates an
    isolated, in-memory-style SQLite database under `uploads/{sessionId}/gtfs.db` and returns a
    UUIDv4 `sessionId`. Every subsequent call targets that database through the `X-Session-ID`
    header. There is **no global persistent database**: sessions expire after a TTL (2 h dev / 1 h
    prod) and the server enforces a concurrent-session cap (HTTP 503 beyond it). Work is persisted
    by re-exporting the feed as a GTFS ZIP (`GET /gtfs/edit/export`) and by the workspace's projects
    and their frozen versions (`/gtfs/workspace`).

    ## Validation engine

    Validation is performed by a single engine: the **MobilityData Canonical Validator** (Java JAR,
    embedded in the Docker image). Reports are normalised to the internal shape documented in the
    `ValidationReport` schema; `POST /gtfs/edit/validate.canonical` returns the untouched
    canonical JSON instead. Severity profiles (canonical / strict / lenient / fr-datagouv) only
    override severities — the rule set itself stays aligned with MobilityData.

    ## Delivery guarantees

    Every path that delivers a GTFS — `POST /gtfs/transform/commit`, `GET /gtfs/edit/export`,
    `POST /gtfs/share`, `POST /gtfs/share/{token}/versions`,
    `POST /gtfs/network/compile` and a project version's package
    (`POST /gtfs/workspace/projects/{projectId}/versions/{versionId}/package`) — is gated by
    deterministic server code, whatever the client or the model says:

    - **No delivery without a verified validator report.** The canonical validator runs on the feed
      as it would be delivered. A validator that is not installed, that answers an unverified
      report or that crashes REFUSES the delivery: **503** `VALIDATOR_UNAVAILABLE`
      `{ reason: not_installed | unverified }` or **503** `VALIDATOR_FAILED` `{ validator_error }`;
      nothing is written or streamed. There is no "unavailable, let it through" state in any
      environment, and no bypass: the former `?force=true` export bypass is removed (**400**
      `INVALID_INPUT`, audited). The report the export preflight reads (`POST /gtfs/edit/validate`)
      refuses the same way (**503**, never a report that proves nothing) and carries `delivery`
      (`ValidationDelivery`): what the export gate will decide on the same feed.
    - **0 new error for a modification, 0 error for a creation.** The verified report of the feed as
      ingested (upload, demo feed, catalog open, share open, Network Studio build) is the session's
      modification baseline, written once per feed. A delivery of a modified feed refuses errors
      above that baseline with `VALIDATION_NEW_ERRORS` `{ new_errors: [{ code, before, after }],
      preexisting }` (**409**; **422** on the two exports, their historical status, with the
      `report`); a creation, or a session without a baseline, refuses any error with
      `VALIDATION_ERRORS` `{ errors, warnings, by_rule }`. Neither can be acknowledged:
      `acknowledge.validation` is ignored, not refused. Pre-existing errors travel announced: the
      `X-GTFS-Validation: preexisting-errors=<n>` header on the exports,
      `validation.preexisting_errors` on a share card, `validation.preexisting` on a deliverable.
    - **A named acknowledgement for what the brief does not get.** A `must` clause that fails or
      cannot be measured (`unknown`), an operation whose quote the engine could not verify, an
      assumption of a build's contract: each is delivered only when a named person accepts it —
      `acknowledge: { by: { name }, clauses: [ids], sources: true, assumptions: [ids], note }`
      (`AcknowledgeRequest`). Otherwise **409** `CLAUSES_FAILING` / `CLAUSES_UNKNOWN`
      `{ clauses, unacknowledged }`, `SOURCES_UNVERIFIED` `{ operations }`,
      `ASSUMPTIONS_UNVALIDATED` `{ assumptions, unacknowledged }` (a build); a change is applied
      on the person's one named decision (`acknowledge.direct`: the direct mode's review report;
      `acknowledge.hand`: a change made by hand); an acknowledgement that names
      nobody is **400** `ACKNOWLEDGEMENT_UNNAMED` (the signed-in account's display name is the
      default). The record (`AcknowledgementRecord`: who, what, when on the server clock) is written
      with the delivery — the `_acknowledgements` table next to the edit log (`GET /gtfs/edit/history`
      returns it next to its edit), the network report's `gate`, the project review and version —
      and never reaches a GTFS zip. No automatic acknowledgement exists anywhere.
    - **The verdict is the server's.** The Network Studio's planner (`POST /gtfs/network/plan`,
      the project scenario turn) emits a `verdict` SSE event
      (`VerdictEvent`) computed by the engine from the conformance results, apart from the model's
      prose, with the sentences of the prose that contradict it; the `done` event carries the same
      verdict and the gate. A plan written or a design edited by hand reads the same verdict, from
      the same function (`verdictOf`), in the response of the endpoint that measures it:
      `POST /gtfs/transform/preview` (`verdict` of the conformance after the plan, with its gate) and
      `POST /gtfs/network/evaluate` (`verdict` of the conformance, `deliverable` null before the
      build); the client shows it and never recomputes it. The Network Studio readiness carries the
      server's `ready_once_acknowledged`. The brief's clauses are merged server-side: the model may
      add or refine one, never drop, waive or downgrade one.
    - Every refusal answers `{ error: <code>, message, ...details }` (`Refusal`).
    - Measurement is not delivery: previewing or evaluating a plan replays it on an in-memory copy — nothing written, no acknowledgement — and
      always returns the failing and unknown clause ids. Only `POST /gtfs/transform/preview` runs
      the canonical validator, by default wherever it is available (`validate: false` asks for the
      fast preview alone), so that a preview says what the commit will find; the planner's previews
      do not.
    - Accepted limitations: new errors are compared by rule code (an edit that removes one
      occurrence of a rule and adds another of the same rule is invisible); a session loaded before
      this behaviour has no baseline and delivers only with 0 error until the feed is loaded again;
      the contradiction detector covers French and English and only annotates.

    ## Edit CRUD pattern

    All `/gtfs/edit/{table}` families (stops, routes, trips, stop_times, calendar, fares v1/v2,
    flex, levels, pathways, transfers, translations, attributions, frequencies…) share one generic
    envelope, documented once and referenced everywhere:

    - `POST /gtfs/edit/{table}` — create. Body: JSON map of GTFS column → value
      (`EntityCreate`). Returns **201** with the created row echoed under a key named after the
      entity.
    - `PATCH /gtfs/edit/{table}/{pk}` — partial update. Body: JSON map restricted to the
      server-side whitelist of editable columns (`EntityPatch`). Returns the full post-image row
      plus the `changed` column list.
    - `DELETE /gtfs/edit/{table}/{pk}` — delete. Returns `{ deleted: "<pk>" }`.
    - `GET /gtfs/edit/{table}` — list.

    Every mutation requires edit mode (`POST /gtfs/edit/enter`; the licence under the paid offer), is recorded in the
    session edit log (undo/redo via `/gtfs/edit/undo|redo|jump`), and returns the `EditResult`
    envelope. Sessions not in edit mode are rejected with **409** `SESSION_NOT_IN_EDIT_MODE`.

    ## The reader's lens on a simulated draft (`X-View-Preview`)

    A read of the reader — `GET /gtfs/agencies`, `/routes/{agency_id}`, `/directions/…`,
    `/stops_and_times/…`, the calendars, the shapes, the details, `/statistics`,
    `/quality_audit`, `GET /gtfs/sql/schema` and the read-only `POST /gtfs/sql` — may carry
    `X-View-Preview: <id>`, the id of a change plan simulated on the session
    (`POST /gtfs/transform/preview`). It is then answered from the feed that simulation would
    produce: the working copy with the plan's changeset replayed in an in-memory copy, read only,
    never written back. The read cache's ETag names the lens and `Vary` lists the header. The
    change engine, the workspace and the documents ignore it; a write that carries it is refused
    **409** `DRAFT_VIEW_READ_ONLY` (a draft is changed by its operations). An expired or another
    session's simulation answers **404** `PREVIEW_NOT_FOUND`, one older than the working copy
    **409** `PREVIEW_STALE`, as its commit would. A malformed value is no lens.

    ## Accounts and access levels

    Behind `ACCOUNTS_ENABLED` (off by default). Reading a feed stays free and needs no account.
    Signing in is a six-digit code sent by e-mail (`POST /gtfs/auth/code`, then
    `POST /gtfs/auth/code/verify`), no password: the first verified code creates the account.
    Under the paid offer (`PAID_ACCESS_ENABLED`) every modification needs the licence (`edit` and
    `studio`): a subscription (`POST /gtfs/billing/checkout`), the administrator's grant with its end
    (`POST /gtfs/admin/users/{id}/entitlements`, after a quote: `POST /gtfs/billing/quote`), the free
    trial (`POST /gtfs/billing/trial`, once per address), or an address of `ADMIN_EMAILS` (the
    operator's own, without an end). Without the paid offer everything is open. The session is a cookie
    (`gtfs_session`; HttpOnly, SameSite=Lax, Path=/, Secure over https, 30 days sliding on use).
    Error codes: `ACCOUNTS_DISABLED` (503), `INVALID_INPUT` (400), `LOGIN_CODE_INVALID` (401),
    `LOGIN_CODE_EXPIRED` (410), `LOGIN_CODE_LOCKED` / `LOGIN_CODE_TOO_SOON` (429),
    `MAIL_UNAVAILABLE` (503), `MAIL_PROVIDER_ERROR` (502), `ACCOUNT_DISABLED` (403),
    `NOT_SIGNED_IN` (401), `ENTITLEMENT_REQUIRED` (403, with `entitlement`), `USER_NOT_FOUND` (404),
    `RATE_LIMITED` (429: 10 code requests or checks per 15 min per IP).

    ## Servers & proxying

    Direct (development) access is `http://localhost:3004` with paths as documented here. In
    production the frontend reverse proxy exposes the same surface behind the `/api` prefix
    (e.g. `/api/gtfs/agencies`).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
    description: "Direct access (development: http://localhost:3004). In production the API is exposed
      behind the /api prefix by the reverse proxy."
tags:
  - name: Health
    description: Liveness probe.
  - name: Upload
    description: "Feed ingestion: GTFS ZIP upload, demo feed, public upload counters."
  - name: Read
    description: Read-only feed exploration endpoints (HTTP-cached against the session edit counter).
  - name: Diff
    description: Read-only feed-to-feed comparison between two uploaded sessions.
  - name: Search & Stats
    description: Free-text search and aggregated feed statistics.
  - name: Edit Session
    description: "Edit-mode lifecycle: enter (the licence under the paid offer), exit, status."
  - name: Edit
    description: Transactional mutations on GTFS tables — generic CRUD envelope, see the Edit CRUD
      pattern section.
  - name: History
    description: Edit log, undo, redo and history jump (backend-driven).
  - name: Validation
    description: On-demand canonical validation, profiles, locales and the rule catalogue.
  - name: Quick Fixes
    description: Auto-repair proposals derived from the validation report.
  - name: SQL
    description: "SQL console: read-only public surface plus the edit-mode mutation surface."
  - name: AI
    description: NL2SQL one-shot generation and multi-turn chat (the model; a licence's caps or the free messages; read-only).
  - name: Share
    description: Public read-only shares of a feed (snapshot behind a token, card, hosted GTFS zip, published versions with a changelog).
  - name: Documents
    description: Passenger-facing documents (line timetables, stop posters) as print-ready HTML.
  - name: Realtime
    description: GTFS-Realtime feeds checked against the loaded static feed.
  - name: Network Studio
    description: Build a GTFS from a Network Spec (stops, lines, services) — validation, geocoding, road routing, compilation.
  - name: Transform
    description: "Change plans on the loaded feed: typed, deterministic operations run on a sandbox, previewed (semantic diff, integrity, brief conformance, canonical validator) and committed as one undoable edit. The commit is a delivery: the canonical validator must answer (503 otherwise), a new error refuses it (409 VALIDATION_NEW_ERRORS, no override) and what the gate lists is applied only under a named acknowledgement."
  - name: Export
    description: "Re-export the (edited) feed as a GTFS ZIP: a delivery, validated by the canonical validator before anything streams (503 when it cannot answer, 422 on errors above the session's baseline; the force bypass is removed)."
  - name: Admin
    description: Operator dashboard endpoints, gated by X-Admin-Token.
  - name: Config
    description: Public feature flags.
  - name: Workspace
    description: "The journey's projects, kept on the server for everyone (target design §2.4, §9): owned by an account, or without one by a 256-bit browser token (X-Client-Token, minted by POST /workspace/token, stored hashed, never in a URL, never listed across owners — a stranger's project answers 404 like an unknown one). The project is the JSON document the web keeps (§2.4); the autosave is compare-and-set on data_version (If-Match, 409 AUTOSAVE_CONFLICT); versions are frozen zips within caps per project (WORKSPACE_MAX_VERSIONS, WORKSPACE_MAX_VERSION_BYTES: the oldest version that is neither the reference nor delivered is purged first), restored from their zip (D46), and snapshots of the edits are taken by the server (D38). Retention: PROJECTS_RETENTION_DAYS after the last write without an account, ACCOUNT_PROJECTS_RETENTION_DAYS with one; a daily purge. WORKSPACE_ENABLED=false — or a production server without its own CLIENT_TOKEN_SECRET, the tokens' hashes never following another secret's rotation — answers 503 WORKSPACE_DISABLED (the web keeps its projects in the browser). Since WP10 the project's versions are read back (their diff, their coherence report), approved (with accounts: roles reader · contributor · approver, the owner holding every role; a shared project's versions are delivered only once approved) and delivered as « Tout le paquet » — a validated zip with its manifest.json — then marked delivered."
  - name: Billing
    description: "The paid offer (PAID_ACCESS_ENABLED with ACCOUNTS_ENABLED, off by default): reading stays free (explore, validate, share, the coherence report, the public feeds); editing the open network (entering edit mode, every change under /edit, importing a project, GET /edit/export and the project file) and the Network Studio (create and modify, by hand or with the assistant: /network, /transform, /contract and /spreadsheet except the catalogue, the coherence report and the open network's operations, overview and health; and the workspace project's work: creating, saving, freezing and restoring a version, adding a document, building and marking the delivery package) need an account holding the entitlement, from an active subscription or granted by the administrator. Checked on every request: 401 NOT_SIGNED_IN { entitlement, paid: true } without an account, 402 SUBSCRIPTION_REQUIRED { entitlement } without the entitlement, 503 ACCOUNTS_DISABLED when the server has no accounts. GET /config/features announces the same states (access.edit, access.studio_access) before any work. Stripe is the payment provider: Checkout and Customer Portal sessions are created server side (STRIPE_SECRET_KEY, STRIPE_PRICE_PRO, STRIPE_PRICE_TEAM), or the payment links are used (STRIPE_CHECKOUT_URL_*) with the account as client reference; the signed webhook (STRIPE_WEBHOOK_SECRET) is the only writer of a subscription."
  - name: Accounts
    description: "User accounts (ACCOUNTS_ENABLED, off by default: every route answers 503 ACCOUNTS_DISABLED). Three access levels: reading a feed is free and needs no account; signing in is a code sent by e-mail (no password); under the paid offer the licence (a subscription, the administrator's grant, the free trial, the operator's own address) holds the `edit` and `studio` entitlements. Cookie session `gtfs_session` (HttpOnly, SameSite=Lax, Secure over https, 30 days sliding)."
paths:
  /health:
    get:
      tags:
        - Health
      summary: Liveness probe (no session required).
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    description: Process uptime in seconds.
  /gtfs/upload:
    post:
      tags:
        - Upload
      summary: Upload a GTFS ZIP and create an isolated session (SQLite DB).
      description: Validates the archive (canonical MobilityData engine), migrates it to a per-session
        SQLite database and returns the session ID to use in `X-Session-ID`. If the header carries
        an existing session ID, the session content is replaced (any open edit session is dropped).
        Rate-limited per IP. The verified report of the feed as uploaded is the session's
        modification baseline, written once per feed, and every later delivery (commit, export,
        share) refuses only the errors above it (see Delivery guarantees).
      requestBody:
        $ref: "#/components/requestBodies/GtfsZipUpload"
      security: []
      responses:
        "200":
          $ref: "#/components/responses/UploadOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SessionSaturated"
  /gtfs/load-sample:
    get:
      tags:
        - Upload
      summary: Load the bundled demo GTFS feed into a new session.
      description: Its verified validation report is the session's modification baseline (written once), like an upload's.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/UploadOk"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/SessionSaturated"
  /gtfs/agencies:
    get:
      tags:
        - Read
      summary: List all agencies of the session feed.
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/routes/{agency_id}:
    get:
      tags:
        - Read
      summary: List routes operated by an agency.
      parameters:
        - name: agency_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/directions/{route_id}/{date}:
    get:
      tags:
        - Read
      summary: List directions served by a route on a given date.
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: path
          required: true
          schema:
            type: string
          description: Service date in YYYYMMDD format.
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/stops_and_times/{route_id}/{direction_id}/{date}:
    get:
      tags:
        - Read
      summary: Stop-by-trip departure time grid for a route, direction and date.
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
        - name: direction_id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: path
          required: true
          schema:
            type: string
          description: Service date in YYYYMMDD format.
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/stops/all:
    get:
      tags:
        - Read
      summary: List every stop in the feed.
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/shapes/{route_id}/{direction_id}:
    get:
      tags:
        - Read
      summary: Shape polylines for a route and direction.
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
        - name: direction_id
          in: path
          required: true
          schema:
            type: integer
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/calendar/{route_id}:
    get:
      tags:
        - Read
      summary: Calendar rows attached to a route.
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/calendar_dates/{route_id}:
    get:
      tags:
        - Read
      summary: Calendar date exceptions attached to a route.
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/calendar_service/{service_id}:
    get:
      tags:
        - Read
      summary: Calendar row for a service_id.
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/calendar_dates_service/{service_id}:
    get:
      tags:
        - Read
      summary: Calendar date exceptions for a service_id.
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/average_trip_times:
    get:
      tags:
        - Search & Stats
      summary: Average trip duration per route.
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/statistics:
    get:
      tags:
        - Search & Stats
      summary: Aggregated feed statistics (entity counts, service span, frequencies).
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/quality_audit:
    get:
      tags:
        - Search & Stats
      summary: Semantic quality audit of the feed (speeds, duplicate stops, naming, shape fit, calendars, unused objects, colours).
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/all_shapes:
    get:
      tags:
        - Read
      summary: Every shape of the feed (map overview).
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/shapes_for_route/{route_id}:
    get:
      tags:
        - Read
      summary: Shapes referenced by the trips of a route.
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/route_patterns/{route_id}:
    get:
      tags:
        - Read
      summary: Stop patterns of a route (ordered stops, trips following each pattern, shapes in use).
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/shape_coverage/{agency_id}:
    get:
      tags:
        - Read
      summary: Per-route trip counts, trips without shape and distinct shapes for an agency.
      parameters:
        - name: agency_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
