                territory:
                  type: string
                  description: A territory already loaded (its place).
                requirements:
                  type: object
                  description: "The recorded brief (set_requirements), including `school_zone`: the school-holiday zone (A, B or C in France, else an ISO 3166-2 subdivision; 8 characters at most), kept across refinements."
                documents:
                  type: array
                  items:
                    type: string
                dataIds:
                  type: array
