  /gtfs/edit/exit:
    post:
      tags:
        - Edit Session
      summary: Exit edit mode.
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
  /gtfs/session/status:
    get:
      tags:
        - Edit Session
      summary: When the working copy will be swept — read only, never a touch (the heartbeat prolongs it).
      description: >-
        The idle time the sweep counts (folder, database, WAL, heartbeat) and the moment the session
        expires, so the web says "expires in 10 min — Prolong" from T-10 min (target design §3.2, §9).
        When a workspace project runs on this working copy, `snapshot` says how many edits stand since
        its last version and the snapshot triggers (D38). 400 INVALID_SESSION without a valid id, 404
        SESSION_NOT_FOUND once the copy is gone.
      security:
        - SessionId: []
      responses:
        "200":
          description: The working copy's expiry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  ttlMs:
                    type: integer
                  idle_ms:
                    type: integer
                  expires_at:
                    type: string
                    format: date-time
                  remaining_ms:
                    type: integer
                  snapshot:
                    nullable: true
                    type: object
                    properties:
                      edits_since_version:
                        type: integer
                      version_id:
                        type: string
                        nullable: true
                        description: "The project's version this working copy is — restored from (« Reprendre », « Rouvrir vN ») or last frozen as — or null: an export with no retouch since delivers that version."
                      last_edit_at:
                        type: string
                        nullable: true
                      snapshot_at:
                        type: string
                        nullable: true
                      edits_threshold:
                        type: integer
                      idle_minutes:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"
  /gtfs/workspace/token:
    post:
      tags:
        - Workspace
      summary: "A new browser token (256 bits, base64url, 43 characters): returned once, stored hashed (HMAC-SHA256)."
      description: >-
        The browser keeps it (localStorage) and sends it in the X-Client-Token header, never in a URL; it
        owns the projects the browser keeps without an account (D39). Its own hourly budget per IP.
      responses:
        "201":
          description: The token, and the workspace's caps.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{43}$"
                  retention_days:
                    type: integer
                  max_projects:
                    type: integer
                  max_versions:
                    type: integer
                  max_version_bytes:
                    type: integer
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects:
    get:
      tags:
        - Workspace
      summary: "The caller's projects (account or browser token), the last written first — Home's list, never the whole documents; nothing of another owner."
      description: >-
        Signed in with this browser's live token too, the list holds the account's projects AND the
        token's projects not attached yet (`owner.via: browser`): signing in never hides a browser's work
        before it is attached (D5, D39). GET, PATCH and DELETE of a project follow the same rule.
      security:
        - ClientToken: []
        - SessionCookie: []
      responses:
        "200":
          description: One line per project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceProjectSummary"
                  retention_days:
                    type: integer
                  max_projects:
                    type: integer
                  max_versions:
                    type: integer
                  max_version_bytes:
                    type: integer
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
    post:
      tags:
        - Workspace
      summary: "Keep a project the web made (its 10-hex id, its job) on the server."
      description: >-
        400 INVALID_ID when the id is not 10 hexadecimal characters or is taken (the web draws another),
        400 INVALID_INPUT without a job, 409 TOO_MANY_PROJECTS past the browser's quota
        (WORKSPACE_MAX_PROJECTS; no quota on an account), 413 PROJECT_TOO_LARGE above 900 KB.
      security:
        - ClientToken: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  $ref: "#/components/schemas/WorkspaceProject"
      responses:
        "201":
          $ref: "#/components/responses/WorkspaceProjectOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
    get:
      tags:
        - Workspace
      summary: "The project in the JSON shape of target design §2.4, its versions merged with their zips; ETag = its data_version. 404 PROJECT_NOT_FOUND for a stranger's id as for an unknown one."
      security:
        - ClientToken: []
        - SessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceProjectOk"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
    patch:
      tags:
        - Workspace
      summary: "The autosave: the fields the web writes, compare-and-set on data_version (If-Match)."
      description: >-
        If-Match carries the data_version the write was made from ("2" or 2); a stale one answers 409
        AUTOSAVE_CONFLICT with `data_version` and the `project` as it now is ("Recharger / Garder ma
        copie"); If-Match: * writes over it on purpose and the journal records `actor`
        (action "overwrite"). Without If-Match: 400 INVALID_INPUT. The server's own fields (id, job,
        owner, created_at, updated_at, retention_until, data_version) are never taken from the body;
        every write moves updated_at and the retention. 413 PROJECT_TOO_LARGE above 900 KB. A version
        the document marks delivered (`delivered_at`) is protected from the purge from then on. The
        journal is append-only: the body's lines are merged over the stored ones, never replace them
        (the server's own lines — delivered, overwrite — stay). On a shared project (one with members) a
        version is delivered only approved (D19): `delivered_at` / `delivered_by` set on a version that
        is not approved, the `delivery` record (all but its `share`) naming one, and a new journal line
        "delivered" for one are not taken — the stored values stay; a version the server marked
        delivered keeps its marks.
      security:
        - ClientToken: []
        - SessionCookie: []
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The data_version read (ETag), or * to write over another writer.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  $ref: "#/components/schemas/WorkspaceProject"
                actor:
                  type: string
                  description: Who writes over another writer (If-Match *), for the journal.
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceProjectOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "403":
          $ref: "#/components/responses/RoleRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "AUTOSAVE_CONFLICT: the project changed since the version the write names."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [AUTOSAVE_CONFLICT]
                  message:
                    type: string
                  data_version:
                    type: integer
                  project:
                    $ref: "#/components/schemas/WorkspaceProject"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
    delete:
      tags:
        - Workspace
      summary: "Forget a project: its record, its versions' zips, its documents. Its owner only (a member: 403 ROLE_REQUIRED)."
      security:
        - ClientToken: []
        - SessionCookie: []
      responses:
        "204":
          description: Removed.
        "403":
          $ref: "#/components/responses/RoleRequired"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/bind:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
    post:
      tags:
        - Workspace
      summary: "The working copy (X-Session-ID) the project runs on: its edits are frozen as snapshot versions (D38) — after SNAPSHOT_EDITS edits, SNAPSHOT_IDLE_MINUTES after the last one, and before the sweeper removes the copy."
      security:
        - ClientToken: []
          SessionId: []
      responses:
        "200":
          description: Bound.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bound:
                    type: boolean
                  last_edit_id:
                    type: integer
                  snapshot_edits:
                    type: integer
                  snapshot_idle_minutes:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/versions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
    post:
      tags:
        - Workspace
      summary: "Freeze the working copy (X-Session-ID) as a version of the project: a GTFS zip kept with it, never handed to anyone."
      description: >-
        The files as opened while nothing was edited (v0 is the network as opened, D46), else the
        edited tables. `n` is the web's number when it is free, else the next one. The caps per project
        (D49): WORKSPACE_MAX_VERSIONS zips and WORKSPACE_MAX_VERSION_BYTES in all; beyond them the
        oldest version that is neither the reference nor delivered is purged (`purged`, its record
        stays); with only protected versions left the new zip is refused (409 TOO_MANY_VERSIONS, 413
        VERSION_TOO_LARGE). kind "snapshot" with snapshot_reason "manual" is "Figer en version": refused
        with 409 NOTHING_TO_FREEZE while no retouch stands since the project's last version (an identical
        zip would only count against the caps). The reference (kind "reference") is always the files as
        opened, never a retouch. A version is frozen once: an id already frozen (its zip kept or
        purged) is refused before anything is written, 409 VERSION_FROZEN { n } — its zip and its
        fingerprint never change under an approval or a delivery (D50); the one exception is the
        reference replaced when the network is chosen again at ①. 404 SESSION_NOT_FOUND when the
        working copy is gone. Its own hourly budget per IP.
      security:
        - ClientToken: []
          SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: object
                  required: [id, kind]
                  properties:
                    id:
                      type: string
                      pattern: "^[a-f0-9]{10}$"
                    n:
                      type: integer
                    kind:
                      type: string
                      enum: [reference, built, applied, snapshot, delivered]
                    name:
                      type: string
                    at:
                      type: string
                    snapshot_reason:
                      type: string
                      enum: [edits, idle, before_expiry, manual]
      responses:
        "201":
          description: The version frozen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    $ref: "#/components/schemas/WorkspaceVersion"
                  purged:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        n:
                          type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
      - $ref: "#/components/parameters/WorkspaceVersionId"
    delete:
      tags:
        - Workspace
      summary: "Withdraw a version and its zip (\"Annuler l'application\", D37): never the reference nor a delivered version (409 VERSION_PROTECTED)."
      security:
        - ClientToken: []
          SessionCookie: []
      responses:
        "204":
          description: Withdrawn.
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/versions/{versionId}/restore:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
      - $ref: "#/components/parameters/WorkspaceVersionId"
    post:
      tags:
        - Workspace
      summary: "« Reprendre » (D46): a new working copy from the version's frozen zip — never a new download of the catalogue."
      description: >-
        The zip is ingested like an upload (validated, migrated) into a new session bound to the project;
        its modification baseline is the PROJECT's (the validation of the network its work started
        from), never the restored version's own report — a snapshot's retouches are not "pre-existing"
        errors; a project without one demands zero errors. The session's own export, share and commit
        stay gated (G1). The zip's bytes are hashed before anything is extracted: 409 VERSION_CORRUPT when
        they no longer match the fingerprint recorded at the freeze (nothing restored), and `version.sha256`
        is the hash of the bytes restored. 409 VERSION_MISSING when the zip was purged, 404
        VERSION_NOT_FOUND. Its own hourly budget per IP.
      security:
        - ClientToken: []
        - SessionCookie: []
      responses:
        "201":
          description: The new working copy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  validationReport:
                    type: object
                    additionalProperties: true
                  counts:
                    type: object
                    additionalProperties: true
                  version:
