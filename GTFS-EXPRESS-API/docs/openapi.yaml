      summary: "Upload a specification document for the planner (PDF read natively by the model, and its text layer read at ingestion, a scan without one read by OCR there (tesseract.js, French and English; the document answers text_ocr and ocr_pages) — deterministically, the parser in a child process — and stored with the document: `text_chars` in the answer, 0 for a scan without a text layer; the quote checks (G2) and the coverage detector (G5) read it; Word .docx and OpenDocument .odt reduced to text; spreadsheets .xlsx, .xlsm, .xls, .ods reduced to one text table per sheet; text, Markdown, CSV, JSON). Kept two hours; the plan request references it by id. With ACCOUNTS_ENABLED the `studio` entitlement is required (401 NOT_SIGNED_IN / 403 ENTITLEMENT_REQUIRED)."
