  /gtfs/network/evaluate:
    post:
      tags:
        - Network Studio
      summary: "Design quality report of a Network Spec: coverage, stop spacing, directness, service level, connectivity, plausibility, compliance; score out of 100, findings and recommendations. With `requirements`, also the conformance to the brief: a verdict (pass, fail, unknown, waived) per clause, with what was expected and measured. The response carries the engine's `verdict` (Verdict): verdictOf of that conformance, the function the planner's SSE `verdict` event uses, so a design edited by hand reads the same verdict before the build, never recomputed by the client; null without clauses, and its `deliverable` is null (nothing is built). With the project's `contract`, its clauses are measured as the person's over `requirements`, and the verdict carries the coverage of the brief by it (G5: not deliverable while a requirement sentence is uncovered under a decided or assumed contract); a design over the offer's lines says so (over_plan_limit, not deliverable for the reason offer, D9)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec:
                  type: object
                  description: The Network Spec.
                place:
                  type: string
                  description: A territory already loaded (coverage, accessibility).
                geometry:
                  type: array
                  items:
                    type: object
                contract:
                  $ref: "#/components/schemas/Contract"
                brief:
                  type: string
                  description: "The brief's text pasted by the person (the coverage detector reads it with the documents and the text the contract was extracted from)."
                documents:
                  type: array
                  description: The ids of the project's documents whose text the coverage detector reads.
                  items:
                    type: string
                requirements:
                  type: object
                  description: "The recorded brief. `clauses` is a list of checkable clauses {id, kind, level (must|should), status (stated|assumed|confirmed|waived), params}; kinds: line_exists, termini, via, serves, headway_max, span, days, no_service, mode, lines_max, lines_min, fleet_max, budget_max, od_max_time, running_time {line, from_stop, to_stop, minutes ± tolerance_min | min_minutes / max_minutes, measure each|median}, trips_count {line, min / max / exactly, per direction|total, direction | towards, at_stop, occurrence, from, to}, departure_at {line, stop, occurrence, times, towards, event departure|arrival, tolerance_min, present} (occurrence — also of headway_max's stop —: which call the stop is when a trip bears that name several times, first | last | its rank; without it such a clause is unknown, never measured at the first call), stop_pattern {line, stops in order, avoid, trips through|all|any, ends, exact, direction}, same_as {line | lines, like_date | like_week, like_in before|after} and unchanged_except {line | lines, except {lines, from, to, direction, stops}} (the Change Studio only: compared with the feed before the plan; unknown on a designed network). Stops are named (exact names first, else partial ones); a name no stop matches is unknown. A line is named by its number first, then its id, then its long name (a route id equal to another line's number never shadows that line); the relational kinds (same_as, unchanged_except) find a named line in the feed measured and pair it with the feed before the plan by its id, so a renumbered line is named by its new number (a line only the feed before has is found there by its name). A kind not listed is kept and reported status unknown with note \"unsupported clause kind: …\" (counted in summary.unsupported). Time clauses (every kind but line_exists, termini, via, serves, mode, lines_max, lines_min, fleet_max, budget_max) accept `day`, `dates` [YYYY-MM-DD…], `from_date` / `to_date` (YYYY-MM-DD or YYYYMMDD, inclusive) and `period` (school_days | school_holidays | public_holidays | a period of the plan's calendars, with `region` for a school zone) and are measured on EVERY distinct timetable of their scope, never a sample: the dates of the window whose day type the clause asks, grouped by the services the measured line runs (per line when the clause names none); an undated clause is measured on the whole validity from the preview's `today`; only od_max_time is capped (12 timetables, else unknown). A date's day type is its weekday — a weekday of the school holidays stays a weekday; a public holiday counts as the Sunday or Saturday whose timetable it runs, or is left out (the country's public holidays when known, else read from the feed's calendar). Each time result carries `grid` {timetables, dates, failing, from, to} and `measured_on`, one date per measured timetable (all of them); the relational kinds carry `baseline` (before | self). Places (serves, via, termini, od_max_time) are located on authority — clause coordinates, the territory's places and existing stops, the designer's stops, then the network's stops of that name (ground truth for a real feed, a mere candidate for a designed plan) — named in each result's `located_by` (coordinates | territory | design | feed | plan_stop); serves is never satisfied by a stop merely named after the place (unknown when only the plan's own homonymous stop locates it). `lines_requested` alone is checked too (line, termini, vias)."
      responses:
        "200":
          description: "{ ok, territory, …the design quality report, conformance?, verdict }."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                    description: The spec normalised without blockers.
                  territory:
                    type: boolean
                    description: The territory dossier of `place` (already loaded) was used.
                  conformance:
                    type: object
                    additionalProperties: true
                    description: With `requirements` only — the conformance to the brief, per clause.
                  verdict:
                    $ref: "#/components/schemas/Verdict"
        "400":
          $ref: "#/components/responses/BadRequest"
  /gtfs/contract/coverage:
    post:
      tags:
        - Network Studio
      summary: "G5, the coverage of the brief by a contract (step ② « Exigences sans clause »): deterministic, no model. The requirement sentences of the brief typed at ② (contract.brief), of the text the contract was extracted from (contract.extracted.note and documents), of `brief` and of the `documents` named (20 at most), each answered by a clause whose quote stands inside that one sentence (the quote verifier decides; a quote not found never counts; a quote spanning several sentences covers none of them — the detail names it, `spanned_by`), a wish « à vérifier à la main », a named dismissal — or uncovered. A document it cannot read is never skipped: listed in `unread` (missing — unknown, expired, or kept by a project the caller does not own —, no_text, truncated) and counted as one uncovered entry (id doc:<id>) until a named person acknowledges it (contract.dismissed { sentence: \"doc:<id>\", by: { name } }). `gated`: a decided or assumed contract, whose uncovered entries hold the delivery (an empty one is reported only, D15). The caller is someone: with the workspace on, an account, the browser's X-Client-Token or a live X-Session-ID (else 401 CLIENT_TOKEN_REQUIRED); the route answers with the words of the documents it reads, so a document a workspace project keeps is read only through its owner's project, and one no project keeps by its id (the uploader's handle). Bounded: its own rate limit per IP (COVERAGE_RATE_LIMIT_MAX per minute, 429), at most 2000 sentences and 120 quotes, and a time budget past which the sentences not checked are reported uncovered (`incomplete`)."
      security: []
      parameters:
        - in: header
          name: X-Client-Token
          required: false
          schema:
            type: string
          description: "The browser's workspace token (POST /gtfs/workspace/token): the caller, and the owner a kept document is read through."
        - in: header
          name: X-Session-ID
          required: false
          schema:
            type: string
          description: "A live working copy: a caller too (its documents are still read through their owner)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract]
              properties:
                contract:
                  $ref: "#/components/schemas/Contract"
                brief:
                  type: string
                documents:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: "{ coverage: ContractCoverage }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  coverage:
                    $ref: "#/components/schemas/ContractCoverage"
        "400":
          description: "INVALID_INPUT (no contract, or a malformed one); ACKNOWLEDGEMENT_UNNAMED { required: [by.name] } (a decision, a tick or a dismissal without a name)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: "CLIENT_TOKEN_REQUIRED — the workspace is on and the request names nobody: no account, no known X-Client-Token, no live X-Session-ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "429":
          description: "RATE_LIMITED — the route's own per-minute budget per IP (COVERAGE_RATE_LIMIT_MAX, licensed accounts BETA_COVERAGE_RATE_LIMIT_MAX)."
  /gtfs/spreadsheet/parse:
    post:
      tags:
        - Network Studio
      summary: "An operator's offer sheet read deterministically, cell by cell (mission step 6; no model, nothing stored, the feed never written). Formats .xlsx, .xlsm, .xls, .ods, .csv (SheetJS). Recognised layouts: the « service méthode » table (per line, direction and day type: first and last departure, headway by time band as columns « 6h-9h » or as rows « Plage horaire » / « Fréquence », trips), the full timetable (stops × trips, a row of day types and of trip numbers above the trips, « | », « … », « ..... » for a stop not served; a time before 06:00 after one past 18:00 is the service day's 24:xx; a trip marked by a note « (1) » in a « Renvois » row keeps the mark, never its first or last departure, its count a range), the same timetable written across (its stops in one row, one trip per row numbered at its left « F1 », « 12 », « Course 3 »: read the right way only when that is certain — trips' labels at its left, stops' names in its header, every trip's times running forward, and the working copy's stop names holding the header when X-Session-ID names one —, else left unread whole and counted in aggregates.timetables_unsure, never read inverted; a column of trips' labels or day types is never a stop column), the desserte grid of an authority's line specification (stops marked « oui » / « x » / « ✓ » served without a time, an empty cell not served, times on its timing stops — first, last or between —, a cell « 7h-9h : 15 min » merged over trips without times; blocks stacked by direction under section titles « SEMAINE PS », « SAMEDI »: a title naming no day type gives its blocks none), the summary table (« Fréquence », « Courses », « Amplitude » rows per direction « Dir … » under a header row of day types; a header naming several, « Semaine PS PVS », gives its column to those no other header names alone; the columns « Date », « Qui », « Commentaires » are said, reason comment, an author's name never repeated), and the titles completing them (« Ligne 4 — Direction Gare », « Type de jour : LàV », « du 01/09/2026 au 03/07/2027 », « zone B »); French and English headers, merged cells (a value written once over its rows, cited where it is written), times as Excel serials or text (« 6:05 », « 06h05 », « 6h »), day types « LàV », « Lundi-Vendredi », « Sa », « Di/JF », « Scolaire », « Vacances », « Semaine PS » (school_days), « PVS » (school_holidays), « GVS » / « grandes vacances » (summer_holidays: a period the plan's calendars may define, else asked), « forte » / « faible » (read as an assumption), periods as date ranges. Every value of the model carries its sheet and cell; every non-empty cell not read is listed in model.unread with its reason (unknown_header, unknown_column, not_recognised, invalid_time, not_a_time, no_time, invalid_headway, headway_range, unknown_day_type, invalid_date, invalid_period, not_a_number, error_value, formula_without_value, conflicting_value — a second value for what another cell states, a band's headway given twice —, band_incomplete — a band row with its range and no headway, or a headway and no range —, unknown_direction, too_many — every cell of the lines past 200 and of the trips past 400 of a timetable —, comment) — nothing is guessed. A « Sens » written as a number (« 1 », « 2 ») is the operator's own numbering (`sens`), never a GTFS direction_id, which only a column headed « direction_id » states; title keywords are whole words (« Tous les jours » is a day type, never a destination); « Lundi, Vendredi » is two days, never a range. The reading walks the cells there are (never the sheet's declared range). Also answered: the clauses of the step-2 vocabulary the sheet states (departure_at for the first and last departures, span, headway_max per band between the first and last departure, trips_count, days, no_service; `source` = « file · Sheet!A1 », `quote` = the cell's text, `text` = the clause in `lang`), added to the contract by ② like any clause (merged server-side); the values that give no clause and why, each with its cell and the cell's text (not_converted: direction_unresolved — span, headway_max and a trips_count without a destination need the feed's direction, given by the working copy named by X-Session-ID when the sheet's destination (or a « direction_id » column's 0/1) matches it, never guessed from « Aller » or « Sens 1 »; a count on a « les deux sens » row needs its header to say « par sens » or « total » —, band_without_service — a band the sheet says has no departure: no clause of the vocabulary bounds hours without service —, headway_without_window — a summary's « Fréquence » states no hours, a headway_max needs them —, origin_unknown, line_unknown, day_type_unknown); a day type stating only its count of trips gives its days and its trips_count; a desserte grid gives departure_at at each timing stop with all its times (an arrival at its last stop), its span only when the times are at its first stop; a summary gives trips_count towards its « Dir … » and a span (assumed when measured « at the timing stop »), never an operation; and the aggregates. ② records every not_converted value, every unread cell and every clause the person leaves out in the contract's wishes « à vérifier à la main » (document = the file, cell = the cell), so the coverage of the order never loses them. Its own rate limit per IP (SPREADSHEET_RATE_LIMIT_MAX per minute, 429)."
      security: []
      parameters:
        - in: header
          name: X-Session-ID
          required: false
          schema:
            type: string
          description: "A live working copy: its lines and directions resolve the sheet's directions, its stop names decide whether a timetable written across is read (read only)."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                lang:
                  type: string
                  description: "The language of the clauses' `text` (fr by default)."
      responses:
        "200":
          description: "{ model: SpreadsheetModel, clauses: [Clause], not_converted: [{ sheet, cell, kind, reason, text }], aggregates: { sheets, layouts, lines, day_types, bands, timetables, timetables_unsure? (timetables left unread, their orientation not certain), cells, read, unread, unread_by_reason }, resolved: { session } }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    $ref: "#/components/schemas/SpreadsheetModel"
                  clauses:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  not_converted:
                    type: array
                    items:
                      type: object
                      properties:
                        sheet:
                          type: string
                        cell:
                          type: string
                        kind:
                          type: string
                        reason:
                          type: string
                        text:
                          type: string
                  aggregates:
                    type: object
                    additionalProperties: true
                  resolved:
                    type: object
                    properties:
                      session:
                        type: boolean
        "400":
          description: "INVALID_INPUT (no file in the multipart field `file`), UNREADABLE_DOCUMENT (not a workbook of its extension, or SheetJS cannot read it), EMPTY_DOCUMENT (no cell)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "413":
          description: "DOCUMENT_TOO_LARGE { max } (more than 20 MB) or DOCUMENT_TOO_LONG { max } (more than 250 000 cells, merged ranges counted on each cell they cover: a dataset, not an offer; or one sheet's cells spanning a box of more than 2 000 000 addresses — a stray cell far from the offer — max 2000000)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "415":
          description: "UNSUPPORTED_DOCUMENT — not a .xlsx, .xlsm, .xls, .ods or .csv file."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "429":
          description: "RATE_LIMITED — the route's own per-minute budget per IP (SPREADSHEET_RATE_LIMIT_MAX, licensed accounts BETA_SPREADSHEET_RATE_LIMIT_MAX)."
  /gtfs/network/needs:
    post:
      tags:
        - Network Studio
      summary: "What the system still needs from the user to design well: each need (territory, brief, operator, holidays, school zone, service level, caps, costs, typical trips, unlocated stops…) with its state (missing, defaulted, unconfirmed) and impact (high, medium, low), plus the service levers: fleet and yearly cost as planned and with other peak headways or without weekend service."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spec:
                  type: object
                requirements:
                  type: object
                place:
                  type: string
                quality:
                  type: object
                  description: The client's latest quality report (operations, conformance), optional.
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
  /gtfs/network/demand:
    post:
      tags:
        - Network Studio
      summary: "Where people travel in a territory, and how many would ride a plan. The demand inputs (residents, jobs, students, trip generators, observed flows and ridership, with their sources and quality), map layers (≤ 2 000 cells, ≤ 300 generators) and, with a spec, the ridership ESTIMATE (boardings per line and stop, passenger-km, peak load vs capacity, annual boardings; calibration status, uncertainty and method) and the KPIs. Figures are estimates, never counts."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place]
              properties:
                place:
                  type: string
                  description: Town or area (the territory dossier; cached).
                spec:
                  type: object
                  description: A Network Spec to estimate (optional).
                dataIds:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                  description: The user's demand data (POST /gtfs/network/demand/data) to merge.
      responses:
        "200":
          description: Inputs, layers and, with a spec, the estimate and KPIs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  place:
                    type: string
                  inputs:
                    type: object
                    description: "{ totals, quality, sources, warnings }"
                  layers:
                    type: object
                    description: "{ cells: [{lat, lon, pop, jobs}], generators: [{id, name, category, lat, lon, weight}], truncated? }"
                  estimate:
                    $ref: "#/components/schemas/DemandEstimate"
                  kpis:
                    $ref: "#/components/schemas/DemandKpis"
                  warnings:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The place was not found.
  /gtfs/network/optimize:
    post:
      tags:
        - Network Studio
      summary: "The plan's frequencies optimised: the headway of each line and period on a ladder (5–60 min, at most two steps from today per run) for an objective — ridership (most trips within the caps; without caps, at today's cost and fleet), balanced (service moves to where riders cost less than the network average) or cost (lowest cost keeping 95 % of the trips) — under the fleet and budget caps, keeping every clause of the brief that passes. Returns the optimised spec, the changes with their effect, the KPIs before and after (full re-assignment), assumptions and warnings. Proposals to validate, never applied by themselves."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place, spec, objective]
              properties:
                place:
                  type: string
                spec:
                  type: object
                objective:
                  type: string
                  enum: [ridership, balanced, cost]
                constraints:
                  $ref: "#/components/schemas/DemandConstraints"
                requirements:
                  type: object
                  description: The recorded brief; its passing clauses must keep passing (fleet_max / budget_max are caps).
                dataIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: "{ objective, spec, changes: [{ line, line_id, calendar, days, period, headway_before, headway_after, vehicles_delta, cost_delta, trips_delta }], kpis_before, kpis_after, caps, incremental, estimate_after, assumptions, warnings }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  spec:
                    type: object
                  changes:
                    type: array
                    items:
                      type: object
                  kpis_before:
                    $ref: "#/components/schemas/DemandKpis"
                  kpis_after:
                    $ref: "#/components/schemas/DemandKpis"
        "400":
          $ref: "#/components/responses/BadRequest"
  /gtfs/network/scenarios:
    post:
      tags:
        - Network Studio
      summary: "Three contrasted networks for the territory — trunk (1–3 strong lines at 10 min and feeders at 30), coverage (more lines at 20–30 min, most residents within 400 m) and balanced (the coverage lines with frequencies optimised for ridership under the cap) — each a valid Network Spec with its rationale, KPIs, conformance to the brief and warnings (stops placed on the straight line are flagged), plus a comparison flagging the dominated ones (trips, cost, coverage)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place]
              properties:
                place:
                  type: string
                requirements:
                  type: object
                constraints:
                  $ref: "#/components/schemas/DemandConstraints"
                strategies:
                  type: array
                  items:
                    type: string
                    enum: [trunk, coverage, balanced]
                dataIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: "{ scenarios: [{ id, name, strategy, rationale, spec, kpis, estimate, conformance?, notes, warnings }], comparison: { criteria, rows: [{ id, …KPIs, dominated, dominated_by }] }, warnings }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarios:
                    type: array
                    items:
                      type: object
                  comparison:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: The territory has no corridor to design lines on.
  /gtfs/transform/demand:
    post:
      tags:
        - Transform
      summary: "The ridership ESTIMATE of the loaded feed (boardings per line and stop, peak load vs capacity, annual boardings, calibration status and uncertainty) and its KPIs — or, with `previewId`, of the feed a previewed change plan would produce (a scenario, on the same demand, so the two compare). With a place, the territory's residents and places; without, the area the feed's stops cover (official data where available), else a stop-based population proxy, flagged as such."
      security:
        - SessionId: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                place:
                  type: string
                dataIds:
                  type: array
                  items:
                    type: string
                costs:
                  $ref: "#/components/schemas/DemandCosts"
                previewId:
                  type: string
                  pattern: "^[a-f0-9]{18}$"
                  description: A preview of this session (POST /gtfs/transform/preview) to estimate as a scenario.
      responses:
        "200":
          description: "{ estimate, kpis, inputs, warnings, basis: feed | scenario, previewId? }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimate:
                    $ref: "#/components/schemas/DemandEstimate"
                  kpis:
                    $ref: "#/components/schemas/DemandKpis"
                  inputs:
                    type: object
                  basis:
                    type: string
                    enum: [feed, scenario]
                  previewId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: "No feed loaded for the session, or (PREVIEW_NOT_FOUND) the preview expired or belongs to another session."
        "409":
          description: "PREVIEW_STALE: the feed changed since the preview; preview the plan again."
  /gtfs/transform/operations:
    get:
      tags:
        - Transform
      summary: "The catalogue of transformation operations: type, title, category, parameters (name, type, required, description), requires_one_of and examples. requires_one_of (always an array) lists the groups of parameters that stand in for each other — [[\"route\", \"routes\"]] for adjust_running_times and set_dwell, [[\"end_date\", \"start_date\"]] for extend_validity, [[\"direction\", \"pattern\"], [\"days\", \"dates\"]] for add_trips, [[\"days\", \"dates\"]] for set_span: one parameter of each group is needed, none of them is marked required on its own, and an operation given none of a group asks its usual question (which line, until when, which direction, which days). With ?lang= (fr, en…) the titles, descriptions and parameter labels are in that language. One bound rule for every operation: a time window from–to (set_headway, a create_route service period, an add_trips series, a trip selection, running-time bands) holds the departures at or after `from` and before `to` (`to` excluded: the next band starts there; a window ending on its own grid names the departure it leaves out), and a date range (from_date–to_date, a named calendar's from–to, end_date) includes both of its dates. The scope parameters include `holiday_weekdays` (weekday | network): the Monday–Friday dates on which the network runs its Saturday timetable (school holidays on some networks), asked by set_headway, add_trips, remove_trips, shift_trips, set_span and create_route when their weekday change meets them (the other operations never ask). set_headway covers its window from `from` on the grid of the line's first departure (`start: keep_first` keeps that departure as the first) and reads the window at `at_stop` when given (a headway_max clause measures a feed at each direction's trunk stop, named in `measured` when the trips start elsewhere); extend_validity asks `repeat` (before | last_week) when the feed's last week runs another timetable than the weeks before. build_timetable (mission step 6) builds exactly the trips an offer order states for one line, one direction and one day type — first, last and bands [{ from, to, headway_min }] (each departure the previous one plus its band's headway, a more frequent band starting at its start, the last always a departure), `times`, or a full `timetable` { stops, trips: [[HH:MM | null | \"pass\"]], numbers? } (null: no time given, placed by the running times; \"pass\": a stop the trip does not serve, never given a time) — on the existing stop patterns, in place of the direction's trips on the scope's dates, and asks what the order does not say: `pattern` when the direction runs several, `running_times` (existing: the pattern's trip nearest in time; not asked when a timetable gives every stop), `new_dates` (add | skip) for dates the direction runs nothing on, `others` (replace | keep) for the direction's other patterns, `gaps` (band_start) for a departure no band holds, `pass_stops` (serve) when every pattern holding a timetable trip calls at a stop it marks \"pass\". A band whose headway is null has no departure: a departure that would fall in it is not run (the next one is the start of the next band with a headway, or the last departure)."
      security: []
      parameters:
        - name: lang
          in: query
          required: false
          description: "The reader's language (fr, en, fr-FR…): titles, descriptions and parameter labels in it; without it, the English a model reads."
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
  /gtfs/transform/overview:
    get:
      tags:
        - Transform
      summary: "The feed as the transformation engine reads it: counts, validity range, a representative date per weekday, and each route with its patterns, termini and service per day type (trips, first/last departures, headways by period, running time, vehicles at peak)."
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
  /gtfs/transform/preview/{id}/alerts:
    get:
      tags:
        - Transform
      summary: "What riders must be told about a previewed plan, from what it really changes: GTFS-Realtime service alerts (one per line and period; lines changed the same way share one; effect NO_SERVICE, DETOUR, STOP_MOVED, REDUCED_SERVICE, ADDITIONAL_SERVICE, MODIFIED_SERVICE or OTHER_EFFECT; active period in the agency's timezone; lines and stops concerned) and a notice to post, in French or English. format=json (the structured alerts, the FeedMessage in the protobuf JSON mapping, the notice), pb (the FeedMessage as application/x-protobuf) or txt (the notice)."
      security:
        - SessionId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, pb, txt]
        - name: language
          in: query
          schema:
            type: string
            example: fr
        - name: cause
          in: query
          schema:
            type: string
            enum: [OTHER_CAUSE, TECHNICAL_PROBLEM, STRIKE, DEMONSTRATION, ACCIDENT, HOLIDAY, WEATHER, MAINTENANCE, CONSTRUCTION, POLICE_ACTIVITY, MEDICAL_EMERGENCY]
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          description: Bad preview id or format.
        "404":
          description: The preview expired or belongs to another session.
  /gtfs/transform/preview/{id}/coherence:
    get:
      tags:
        - Transform
      summary: "The coherence report of a previewed plan, before → after (target design §6.2): the feed as the plan would leave it (its changeset replayed on an in-memory copy, nothing written) against the feed as it is, one row per line × direction × day type × period — the dates where the plan changes the day's trips form periods (a gap over a week opens a new one), the unchanged ones the `rest` (dropped when they are a few outliers); each row carries `before`, the same measures on the same date, and `changed`. Anomalies are those of the feed after the plan, `preexisting` when the feed had them already, plus day_type_touched_out_of_scope when the framing (day_types, from, to: project.context) is given and the plan changes a day type or dates outside it. Computed once per preview and parameters, cancelled when the client leaves."
      security:
        - SessionId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{18}$"
        - name: offset
          in: query
          required: false
          description: The first line of the page (lines sorted by route_sort_order, then name).
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Lines per page (default 200, at most 500). The anomalies come whole with every page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: region
          in: query
          required: false
          description: "The school zone (France: A, B or C, a région or an académie). Without it: the zone of the design's school calendars, else the one the feed's own calendars follow (region_source: inferred), else the holidays common to every zone (region_source: common)."
          schema:
            type: string
            example: C
        - name: clauses
          in: query
          required: false
          description: "The contract's clauses as a JSON array (at most 240, the contract's own bound: 409 TOO_MANY_CLAUSES beyond, never a silent cut): the kinds days, headway_max and span are cross-checked by the anomalies no_service_vs_clause and headway_one_direction; waived ones are ignored. A long list outgrows a URL (a request line past 16 KB is refused 431, about fifty clauses): send it in the body of the POST form of this path. The report never judges a clause (the verdict is the conformance engine's)."
          schema:
            type: string
            example: '[{"id":"c2","kind":"days","params":{"line":"A","days":["sun"]}}]'
        - name: day_types
          in: query
          required: false
          description: "The change's framing: the day types it concerns, comma-separated (school_weekday, holiday_weekday, weekday, saturday, sunday_holiday)."
          schema:
            type: string
            example: school_weekday
        - name: from
          in: query
          required: false
          description: The framing's first date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: The framing's last date (YYYY-MM-DD).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "The report (CoherenceReport, mode `compare`) with `preview_id` and the plan's `title`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoherenceReport"
        "400":
          description: "INVALID_INPUT (a malformed preview id), INVALID_SESSION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "PREVIEW_NOT_FOUND (the preview expired or belongs to another session), SESSION_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "PREVIEW_STALE: the feed changed since the preview — preview the plan again. TOO_MANY_CLAUSES { max: 240, count }: more clauses than the contract's bound were sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Transform
      summary: "The same report as GET /gtfs/transform/preview/{id}/coherence, the contract's clauses in a JSON body: a long contract (a specification read from offer sheets states some thirty clauses a line) outgrows a URL — a request line past 16 KB is refused 431, about fifty clauses — so the body carries them, every one, up to the contract's bound of 240 (409 TOO_MANY_CLAUSES beyond, never a silent cut). The query's other parameters (offset, limit, region, the framing) are read as for the GET; the body's clauses win over a `clauses` query parameter. The same report, the same cache, the same refusals."
      security:
        - SessionId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{18}$"
        - name: offset
          in: query
          required: false
          description: The first line of the page (lines sorted by route_sort_order, then name).
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Lines per page (default 200, at most 500). The anomalies come whole with every page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - $ref: "#/components/parameters/CoherenceRegion"
        - $ref: "#/components/parameters/CoherenceDayTypes"
        - $ref: "#/components/parameters/CoherenceFrom"
        - $ref: "#/components/parameters/CoherenceTo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoherenceClausesBody"
      responses:
        "200":
          description: "The report (CoherenceReport, mode `compare`) with `preview_id` and the plan's `title`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoherenceReport"
        "400":
          description: "INVALID_INPUT (a malformed preview id), INVALID_SESSION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "PREVIEW_NOT_FOUND (the preview expired or belongs to another session), SESSION_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "PREVIEW_STALE: the feed changed since the preview — preview the plan again. TOO_MANY_CLAUSES { max: 240, count }: more clauses than the contract's bound were sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /gtfs/transform/preview/{id}/coherence.xlsx:
    get:
      tags:
        - Transform
      summary: "The coherence report as an operator's service-méthode sheet (mission step 7): a previewed plan's report (after the change, with « avant » columns and « modifié »; one sheet per day type and period), WHOLE (every page of lines), as a workbook (SheetJS): the anomalies first (with the header), then one worksheet per day type (and period), lines × directions in rows — first and last departure, headway at peak and off-peak (minutes, numbers), trips, patterns, running time min and max; times as text (GTFS's clock runs past 24:00), no formula. Rendered by the server from the same data as the JSON report (one model, two files: the same figures, cell for cell); the header names the network, the version and its date, the date of the report, the canonical validator's engine and the SHA-256 fingerprint of its report (the session's latest one; a simulation's validation for a preview; « none » said otherwise) and the version's fingerprint (report.version.fingerprint). Read only; the filename is attachment `rapport-coherence_<network>_<version>_<date>.xlsx`; the header X-Coherence-Fingerprint repeats the version's fingerprint."
