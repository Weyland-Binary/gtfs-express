  /gtfs/workspace/projects/{projectId}/versions/{versionId}/delivered:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
      - $ref: "#/components/parameters/WorkspaceVersionId"
    post:
      tags:
        - Workspace
      summary: "« Marquer livrée » (D19, D50): the version marked delivered — kept as long as the project, never purged over the caps — the delivery recorded and journaled, under the named person."
      description: >-
        `package_id` names the package delivered, REQUIRED since the owner's rule of 2026-10-05 (409
        PACKAGE_REQUIRED without it: a version is delivered only through a package built here): the
        delivery records its files and its manifest's SHA-256 (404 PACKAGE_NOT_FOUND once gone or for
        another version's); a client's `files` list is ignored. 400 ACKNOWLEDGEMENT_UNNAMED without a name,
        400 INVALID_INPUT for the reference, 409 NOT_APPROVED for a shared project's version not approved.
        The autosave never marks a version delivered (its delivered_at / delivery fields keep the
        server's). → { project } (data_version moved: the web adopts it).
      security:
        - ClientToken: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                by:
                  type: object
                  properties:
                    name:
                      type: string
                package_id:
                  type: string
                  description: The id of a package POST …/package built for this version (kept 24 hours). Required.
                files:
                  type: array
                  description: Ignored since 2026-10-05 (the files are the package's).
                  items:
                    type: string
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceProjectOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "403":
          $ref: "#/components/responses/RoleRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
    post:
      tags:
        - Workspace
      summary: "Share a project of an account with another account at a role (reader · contributor · approver); the owner and the approvers manage the members."
      description: >-
        401 NOT_SIGNED_IN without an account, 409 PROJECT_NOT_ATTACHED for a project only a browser holds,
        403 ROLE_REQUIRED below approver, 400 INVALID_INPUT for an unknown role. An email no account has (or the
        owner's) gets the same 201 and adds nobody: the route never tells which addresses have an account. A member
        already listed takes the new role. → { project }.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                role:
                  type: string
                  enum: [reader, contributor, approver]
      responses:
        "201":
          $ref: "#/components/responses/WorkspaceProjectOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/RoleRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/projects/{projectId}/members/{userId}:
    parameters:
