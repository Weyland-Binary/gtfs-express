  /gtfs/edit/export:
    get:
      tags:
        - Export
      summary: "Export the session feed as a GTFS ZIP: a DELIVERY, validated by the canonical validator before anything streams. The feed is compared with the session's baseline (the report of the feed as ingested): 422 VALIDATION_NEW_ERRORS { new_errors: [{ code, before, after }], preexisting } on errors above it, 422 VALIDATION_ERRORS { errors, warnings, by_rule } on any error when the session has no baseline — both with errorCount, warningCount, infoCount and the full report; 503 VALIDATOR_UNAVAILABLE / VALIDATOR_FAILED when the validator cannot answer (nothing is exported unverified, in any environment). The former admin bypass is gone: `?force=true` is refused with 400 INVALID_INPUT and audited. Pre-existing errors of the baseline are delivered announced in the `X-GTFS-Validation: preexisting-errors=<n>` header."
      security:
        - SessionId: []
      parameters:
        - name: lineEnding
          in: query
          required: false
          description: "`crlf` for RFC 4180 / Excel consumers; anything else is LF (advisory, never a 400)."
          schema:
            type: string
        - name: profile
          in: query
          required: false
          description: Advisory (the canonical engine's report is the same whatever it says); kept for the query contract.
          schema:
            type: string
        - name: force
          in: query
          required: false
          description: "REMOVED. `true` or `1` is refused with 400 INVALID_INPUT (force is no longer supported: fix the validation errors) and recorded as export.force_refused. No token, no header, no environment restores the bypass."
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: "The project's version this file delivers, 1 to 9999 (the web passes the version it marks delivered: the last one, or a new version frozen from the working copy when retouches stand after it): the file is named `<network>_v<N>_<date>.zip`. v1 when absent; anything else is 400 INVALID_INPUT."
          schema:
            type: string
            pattern: "^[1-9][0-9]{0,3}$"
      responses:
        "200":
          description: "GTFS ZIP archive (application/zip), named `<network>_v<N>_<date>.zip` (Content-Disposition). The `X-GTFS-Validation` header is set when the baseline already carried errors: they travel with the export, announced, never hidden."
          headers:
            X-GTFS-Validation:
              description: "`preexisting-errors=<n>`: n ERROR-severity findings were already in the feed as ingested and are not counted as new. Absent when the baseline was clean."
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: "Bad session id, `?force=true` (INVALID_INPUT: the bypass is removed), or a `version` that is not an integer from 1 to 9999 (INVALID_INPUT)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          $ref: "#/components/responses/EditModeRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "BASELINE_ERRORS { errors, rules, preexisting, deliver: package } — a Studio project's working copy (bound to a workspace project) still carries errors its reference feed already had: since the owner's rule of 2026-10-05 they leave only through the project's package, accepted by name there (POST …/versions/{versionId}/package `accept.baseline_errors`), never by this download. Nothing streamed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: "Export refused, nothing streamed: VALIDATION_NEW_ERRORS { new_errors, preexisting } (errors above the session's baseline) or VALIDATION_ERRORS { errors, warnings, by_rule } (a session without a baseline carrying errors); both carry `errorCount`, `warningCount`, `infoCount` and the full `report` (ValidationReport). No override: the errors are fixed, never delivered."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          $ref: "#/components/responses/ValidatorUnavailable"
components:
  securitySchemes:
    SessionId:
      type: apiKey
      in: header
      name: X-Session-ID
      description: UUIDv4 returned by POST /gtfs/upload or GET /gtfs/load-sample. Required by every
        session-scoped route; strictly validated server-side (path-traversal guard).
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: "Operator token (ADMIN_TOKEN env var) for the /gtfs/admin/* console endpoints: scripts and servers without accounts. The operator's own account (ADMIN_EMAILS, signed in: the gtfs_session cookie) opens them too, its acts attributed to it."
    ClientToken:
      type: apiKey
      in: header
      name: X-Client-Token
      description: "The browser's workspace token (43 base64url characters, 256 bits) minted by POST /gtfs/workspace/token: it owns the projects kept without an account. Stored hashed (HMAC-SHA256) by the server, never accepted in a URL; revoked and replaced by POST /gtfs/workspace/attach."
    SessionCookie:
      type: apiKey
      in: cookie
      name: gtfs_session
      description: Account session cookie set by POST /gtfs/auth/register and /gtfs/auth/login
        (ACCOUNTS_ENABLED). HttpOnly, SameSite=Lax, Path=/, Secure over https, 30 days sliding.
  parameters:
    ImportProgress:
      name: X-Import-Progress
      in: header
      required: false
      description: A UUID the page chose to follow this opening on GET /gtfs/import/progress/{id}.
      schema:
        type: string
        format: uuid
    CoherenceRegion:
      name: region
      in: query
      required: false
      description: "The school zone (France: A, B or C, a région or an académie), as for GET /network/coherence."
      schema:
        type: string
        example: C
    CoherenceClauses:
      name: clauses
      in: query
      required: false
      description: "The clauses as a JSON array, cross-checked by the anomalies (days, headway_max, span), as for GET /network/coherence: at most 240 (409 TOO_MANY_CLAUSES beyond); a long list rides in the JSON body of the POST form instead (`clauses`, which wins over this parameter), a URL past 16 KB being refused 431."
      schema:
        type: string
    CoherenceDayTypes:
      name: day_types
      in: query
      required: false
      description: "The change's framing: the day types it concerns, comma-separated."
      schema:
        type: string
    CoherenceFrom:
      name: from
      in: query
      required: false
      description: The framing's first date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    CoherenceTo:
      name: to
      in: query
      required: false
      description: The framing's last date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    CoherenceNetworkLabel:
      name: network
      in: query
      required: false
      description: "The network's name as the project says it (at most 120 characters), printed in the header as it is — a label, never a figure. Without it: the feed's operators (agency_name)."
      schema:
        type: string
    CoherenceVersionLabel:
      name: version
      in: query
      required: false
      description: "The version's name as the project says it (« v1 », at most 40 characters), printed in the header."
      schema:
        type: string
        example: v1
    CoherenceVersionAt:
      name: version_at
      in: query
      required: false
      description: The version's date as the project records it, printed in the header.
      schema:
        type: string
    CoherenceLang:
      name: lang
      in: query
      required: false
      description: "The language of the file's words: fr (default) or en; any other language reads English."
      schema:
        type: string
        example: fr
    WorkspaceProjectId:
      name: projectId
      in: path
      required: true
      description: A workspace project (10 hexadecimal characters, drawn by the web).
      schema:
        type: string
        pattern: "^[a-f0-9]{10}$"
    WorkspaceVersionId:
      name: versionId
      in: path
      required: true
      description: A version of the project (10 hexadecimal characters).
      schema:
        type: string
        pattern: "^[a-f0-9]{10}$"
  responses:
    PayloadTooLarge:
      description: "Too large to keep: PROJECT_TOO_LARGE (a project document above 900 KB), VERSION_TOO_LARGE (a project's versions above WORKSPACE_MAX_VERSION_BYTES once every purgeable one is purged), or the 1 MB JSON body limit."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ClientTokenRequired:
      description: "No account and no live browser token (CLIENT_TOKEN_REQUIRED): the web mints one (POST /workspace/token) and retries; a token replaced by an attachment to an account is dead."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WorkspaceDisabled:
      description: "The workspace is off on this server (WORKSPACE_DISABLED; WORKSPACE_ENABLED=false, or a production server without its own CLIENT_TOKEN_SECRET): the web keeps its projects in the browser only."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RoleRequired:
      description: "ROLE_REQUIRED { role, needed } — the caller's role on the project is below the one the action needs (WP10: reader · contributor · approver; the owner holds every role)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WorkspaceProjectOk:
      description: The project in the JSON shape of target design §2.4, with its data_version (also in ETag), the caller's `role`, the `members`, the `reviews` and each version's `approval` (WP10).
      headers:
        ETag:
          description: The project's data_version, quoted — the If-Match of the next write.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            properties:
              project:
                $ref: "#/components/schemas/WorkspaceProject"
    SessionNotFound:
      description: "The working copy expired or was never opened here (SESSION_NOT_FOUND): the web offers « Reprendre » (the project's version restored from its zip)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotSignedIn:
      description: "No valid account session (NOT_SIGNED_IN), or wrong credentials on sign-in
        (INVALID_CREDENTIALS)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EntitlementRequired:
      description: "The account lacks the entitlement the feature needs (ENTITLEMENT_REQUIRED, with
        `entitlement`: edit | studio), the account is disabled (ACCOUNT_DISABLED), or its address is not
        verified yet (EMAIL_UNVERIFIED)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountsDisabled:
      description: User accounts are disabled on this server (ACCOUNTS_DISABLED; set ACCOUNTS_ENABLED=true).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: "A service the route needs is not configured or refused (MAIL_UNAVAILABLE, MAIL_PROVIDER_ERROR, TRIAL_UNAVAILABLE, QUOTE_UNAVAILABLE)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountOk:
      description: The account, without any hash.
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                $ref: "#/components/schemas/Account"
    OkJson:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    EditOk:
      description: Mutation applied and logged in the session edit history.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EditResult"
    EditCreated:
      description: Record created and logged in the session edit history.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EditResult"
    UploadOk:
      description: "Feed ingested: session created (or replaced) and validated."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadResult"
    ValidationOk:
      description: "Verified validation report in the normalised internal shape, with `delivery` (ValidationDelivery): what the export gate will decide on the same feed."
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ValidationReport"
              - type: object
                properties:
                  delivery:
                    $ref: "#/components/schemas/ValidationDelivery"
    HistoryOk:
      description: "Edit-log entries, most recent first; an edit committed under a named acknowledgement carries it as `acknowledgement` (EditAcknowledgement), the others carry none."
      content:
        application/json:
          schema:
            type: object
            properties:
              history:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/HistoryEntry"
                    - type: object
                      properties:
                        acknowledgement:
                          $ref: "#/components/schemas/EditAcknowledgement"
              since_edit_id:
                type: integer
                nullable: true
                description: The last edit the working copy's project version holds; null without a project.
    SqlOk:
      description: SQL result set (rows are capped server-side, by count and by size; `truncated` flags the cut).
      content:
        application/json:
          schema:
            type: object
            properties:
              columns:
                type: array
                items:
                  type: string
              rows:
                type: array
                items:
                  type: object
                  additionalProperties: true
              rowCount:
                type: integer
              truncated:
                type: boolean
              cellsTruncated:
                type: boolean
                description: Present when a text cell was cut past 64 KB or a blob was replaced by `[BLOB n B]`.
              undoEntryId:
                type: integer
                nullable: true
                description: Mutations only (POST /gtfs/edit/sql) — id of the edit-log entry
                  created for the batch, usable as `expectedEntryId` on `POST /gtfs/edit/undo`.
            additionalProperties: true
    CsvOk:
      description: CSV stream.
      content:
        text/csv:
          schema:
            type: string
    ZipOk:
      description: GTFS ZIP archive.
      content:
        application/zip:
          schema:
            type: string
            format: binary
    SseOk:
      description: Server-Sent Events stream (token, sql_blocked, done… events).
      content:
        text/event-stream:
          schema:
            type: string
    HtmlOk:
      description: Human-readable HTML page.
      content:
        text/html:
          schema:
            type: string
    BadRequest:
      description: "Invalid input: missing/invalid X-Session-ID, validation failure, or malformed body."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Invalid admin token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EditModeRequired:
      description: Rejected by an access guard. Returned as 403 when a mutation is attempted on the
        read-only SQL surface; edit handlers reject sessions that
        are not in edit mode with 409 and code SESSION_NOT_IN_EDIT_MODE.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Session, feed or record not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "State conflict: attachment limit reached, or a referenced chat-attachment table is
        no longer present in the session (ATTACHMENT_LIMIT_REACHED / ATTACHMENT_NOT_FOUND)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded (global, upload, SQL, revalidation or sign-in limiter).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SessionSaturated:
      description: "Service unavailable: concurrent-session cap reached, the validation engine is
        unavailable, or the requested server-side feature is disabled (NL2SQL kill-switch, admin
        token unset)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidatorUnavailable:
      description: "The canonical validator could not answer, so nothing is delivered: VALIDATOR_UNAVAILABLE { reason: not_installed | unverified } (no JAR on this server, or an unverified report) or VALIDATOR_FAILED { validator_error } (the validator crashed or timed out). Nothing was written; retry once the operator installs or repairs the validator. There is no environment in which a delivery goes through unvalidated."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refusal"
    ValidationRefused:
      description: "The feed as it would be delivered carries errors, and nothing was written: VALIDATION_NEW_ERRORS { new_errors: [{ code, before, after }], preexisting } — errors above the session's baseline (the verified report of the feed as ingested) — or, for a creation or a session without a baseline, VALIDATION_ERRORS { errors, warnings, by_rule: { ruleCode: count } }. No override and no acknowledgement: the plan or the feed is fixed."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refusal"
  requestBodies:
    EntityCreate:
      description: JSON map of GTFS column names to values for the new record (spec field names, e.g.
        stop_id, stop_name, stop_lat…). Unknown columns are rejected by the server-side whitelist.
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    EntityPatch:
      description: Partial JSON map of GTFS column names to values. Only whitelisted editable columns are
        applied; primary-key mutation is forbidden.
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    SqlQuery:
      description: SQL statement to execute against the session database.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - sql
            properties:
              sql:
                type: string
                example: SELECT route_id, route_long_name FROM routes LIMIT 50
            additionalProperties: true
    NlPrompt:
      description: Natural-language request to translate into SQL.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - prompt
            properties:
              prompt:
                type: string
                example: List the 10 stops with the most departures
            additionalProperties: true
    ChatTurn:
      description: "Chat turn: user message plus prior conversation context."
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              history:
                type: array
                items:
                  type: object
                  additionalProperties: true
              attachments:
                type: array
                maxItems: 1
                description: References to chat-attachment tables previously imported via
                  /gtfs/sql/nl2sql-chat/attachment. Revalidated server-side (409
                  ATTACHMENT_NOT_FOUND when stale).
                items:
                  type: object
                  properties:
                    table:
                      type: string
                      pattern: "^_chat_att_[0-9]+$"
            additionalProperties: true
    QuickFixRequest:
      description: "Quick-fix selector: the rule code to repair (plus optional scoping fields)."
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - rule
            properties:
              rule:
                type: string
                example: missing_stop_name
            additionalProperties: true
    GtfsZipUpload:
      description: Multipart form upload with the GTFS archive under the `gtfsZip` field (max 50 MB, max
        50 entries).
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - gtfsZip
            properties:
              gtfsZip:
                type: string
                format: binary
    ChatAttachmentUpload:
      description: Multipart form upload with the tabular file (.csv, .tsv, .txt or .xlsx) under the
        `chatAttachment` field (max 5 MB).
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - chatAttachment
            properties:
              chatAttachment:
                type: string
                format: binary
  schemas:
    WorkspaceVersion:
      type: object
      description: "A version of a project (target design §2.4): the web's record (name, by, at, verdict, validation, acknowledgement_id, build_id, counts…) merged with its frozen zip; a snapshot the server took (origin server) carries its snapshot_reason."
      additionalProperties: true
      properties:
        id:
          type: string
        n:
          type: integer
        kind:
          type: string
          enum: [reference, built, applied, snapshot, delivered]
        origin:
          type: string
          enum: [client, server]
        snapshot_reason:
          type: string
          nullable: true
          enum: [edits, idle, before_expiry, manual, null]
        delivered:
          type: boolean
        zip:
          type: object
          nullable: true
          properties:
            bytes:
              type: integer
              nullable: true
            sha256:
              type: string
              nullable: true
            purge_after:
              type: string
              nullable: true
            purged_at:
              type: string
              description: Set once the zip was purged over the caps (the record stays).
    WorkspaceProject:
      type: object
      description: "A project in the JSON shape of target design §2.4 — { id, job, name, owner, created_at, updated_at, retention_until, step, steps, network, documents, context, deliverables_wanted, contract, scenarios, versions, acknowledgements, journal, delivery } — plus its data_version. The web writes name, step, steps, network, documents, context, deliverables_wanted, contract, scenarios, versions, acknowledgements, journal and delivery; the rest is the server's."
      additionalProperties: true
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{10}$"
        job:
          type: string
          enum: [create, modify]
        name:
          type: string
        owner:
          type: object
          properties:
            user_id:
              type: string
              nullable: true
            client_token_hash:
              type: string
              nullable: true
              description: Always null in an answer (the hash never travels back).
            via:
              type: string
              enum: [account, browser]
              description: "Who holds it: the account, or the browser's token (a project not attached yet — signed in with that browser's live token, the person still reaches it, and Home offers « Rattacher mes travaux à mon compte »)."
        created_at:
          type: string
        updated_at:
          type: string
        retention_until:
          type: string
        step:
          type: integer
        versions:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceVersion"
        data_version:
          type: integer
        role:
          type: string
          enum: [owner, reader, contributor, approver]
          description: "The caller's role (WP10): the owner (the account or the browser that holds it) holds every role; a member reads, contributes or approves."
        members:
          type: array
          description: The accounts the project is shared with (its owner is not listed).
          items:
            type: object
            properties:
              user_id:
                type: string
              name:
                type: string
                nullable: true
              email:
                type: string
                nullable: true
                description: The account's email, to the owner and the approvers only (null for a reader or a contributor).
              role:
                type: string
                enum: [reader, contributor, approver]
              added_at:
                type: string
        reviews:
          type: array
          description: "The approval's record, oldest first: { id, version_id, action submit|approve|reject, from_status, to_status, by: { name, user_id }, role, comment, at }."
          items:
            type: object
            additionalProperties: true
        approval:
          type: object
          description: "Each version's approval status (none · in_review · approved · rejected) and whether a delivery needs it (`required`: the project is shared, D19)."
          properties:
            required:
              type: boolean
            versions:
              type: object
              additionalProperties:
                type: string
                enum: [none, in_review, approved, rejected]
    WorkspaceProjectSummary:
      type: object
      description: One line of Home's list.
      properties:
        id:
          type: string
        job:
          type: string
        name:
          type: string
        owner:
          type: object
          properties:
            via:
              type: string
              enum: [account, browser, member]
              description: "member: a project another account shared with the caller (WP10)."
        role:
          type: string
          enum: [owner, reader, contributor, approver]
        step:
          type: integer
        steps:
          type: object
          nullable: true
          additionalProperties: true
        network:
          type: object
          nullable: true
          additionalProperties: true
        scenario:
          type: object
          nullable: true
          additionalProperties: true
        versions:
          type: array
          items:
            type: object
            additionalProperties: true
        delivered:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string
        retention_until:
          type: string
        data_version:
          type: integer
    Account:
      type: object
      description: A user account as returned to its owner (the admin listing adds `last_login_at`,
        `disabled`, `granted`, `grant_until` and `trial_until`). No hash is ever returned.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
          nullable: true
        entitlements:
          type: array
          items:
            type: string
            enum: [edit, studio]
        email_verified:
          type: boolean
        licence:
          type: object
          description: "Whether the licence runs and where it comes from: { active, source: owner | subscription | admin | trial | null, until (null: no end), unlimited, trial_available, trial_until }."
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      description: Standard error envelope. `message`, `code` and `details` are present on a subset of
        endpoints.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error (or machine code on gate endpoints).
        message:
          type: string
          description: Optional human-readable detail.
        code:
          type: string
          description: Optional machine-readable code (e.g. SESSION_NOT_IN_EDIT_MODE).
        details:
          type: array
          items: {}
          description: Optional structured validation violations.
    Refusal:
      type: object
      description: "A refusal of a gate, as every delivery path answers it: the stable code in `error`, a human `message`, and the refusal's details spread at the top level (new_errors, preexisting, errors, warnings, by_rule, report, clauses, unacknowledged, operations, assumptions, reason, validator_error, required, integrity, steps…)."
      required: [error]
      additionalProperties: true
      properties:
        error:
          type: string
          description: "The code: VALIDATOR_UNAVAILABLE | VALIDATOR_FAILED (503); VALIDATION_ERRORS | VALIDATION_NEW_ERRORS (409; 422 on the two exports); CLAUSES_FAILING | CLAUSES_UNKNOWN | SOURCES_UNVERIFIED | PLAN_BLOCKED | PREVIEW_STALE | INTEGRITY_FAILED (409); ACKNOWLEDGEMENT_UNNAMED | NOT_A_SANDBOX | INVALID_INPUT (400)."
        message:
          type: string
    AcknowledgeRequest:
      type: object
      description: "What a named person accepts knowingly, for a delivery the gate would otherwise refuse (POST /gtfs/transform/commit). The name is required as soon as anything is acknowledged (2–120 characters with at least one letter; the signed-in account's display name is the default when accounts are on): 400 ACKNOWLEDGEMENT_UNNAMED { required: [by.name] } otherwise, 400 INVALID_INPUT when the object is malformed. Ids of clauses that pass are ignored. `validation` is IGNORED, not refused: the canonical validator's new errors are never acknowledgeable."
      properties:
        by:
          type: object
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 120
        changes:
          type: boolean
          description: "true: the lines and dates the plan changes, and the rows of the other tables it writes, that no clause of the plan asks for (gate.acknowledgeable changes_not_asked, judge/changeAccounting), or an accounting that could not run, are accepted. The commit of a change plan."
        clauses:
          type: array
          maxItems: 100
          description: The ids of the must clauses accepted as failing or not measurable (gate.acknowledgeable clauses_failing / clauses_unknown; the refusal bodies list them).
          items:
            type: string
        sources:
          type: boolean
          description: "true: the operations whose quote the engine could not verify are accepted (gate.acknowledgeable sources_unverified). The commit of a change plan."
        baseline_errors:
          type: boolean
          description: "true: the errors the client's reference feed already carried, still there after the plan (none new), are accepted by this person (gate.acknowledgeable baseline_errors; 409 BASELINE_ERRORS { errors, rules, preexisting } otherwise, since 2026-10-05). A NEW error is never acknowledgeable."
        current_errors:
          type: boolean
          description: "true: the errors the working copy carried before the plan that the loaded feed's baseline did not (an edit by hand), still there after the plan (none new), are accepted by this person (gate.acknowledgeable current_errors; 409 CURRENT_ERRORS { errors, rules, preexisting } otherwise). Recorded as its own item, never as the reference feed's errors."
        direct:
          type: boolean
          description: "true: the direct mode's one decision (POST /gtfs/transform/direct) — the person delivers the review report as it was shown, whatever it says is done, not done or unproven and whatever changed without being asked, and the errors the reference feed already carried. Recorded by name as an item { kind: direct_report, preview_id, report, facts }. A direct preview's commit without it: 409 DIRECT_REPORT_UNACCEPTED { report }."
        hand:
          type: boolean
          description: "true: the decision on a change made by hand — the person applies it as its steps list it, under their name. Recorded as an item { kind: hand_decision, title, operations }; what the gate still lists (the reference feed's errors, unverified sources) is accepted with it, by its own field."
        note:
          type: string
          maxLength: 400
    AcknowledgementRecord:
      type: object
      nullable: true
      description: "The record of an acknowledgement, written with the delivery (the `_acknowledgements` table next to the edit log — kept by an undo —, the network report's `gate.acknowledgement`, the project review and the approved version's `measures.gate`). `at` is the server's clock. Null when the delivery asked for nothing. Telemetry carries only its id, its scope and a keyed hash of the name; a public share card drops `by`."
      properties:
        id:
          type: string
        by:
          type: object
          properties:
            name:
              type: string
            user_id:
              type: string
              nullable: true
        at:
          type: string
          format: date-time
        scope:
          type: string
          enum: [commit, compile, approve, waive]
        clauses:
          type: array
          description: The ids of the clause items.
          items:
            type: string
        items:
          type: array
          description: "{ kind: clause, id, status: fail | unknown, text, expected, measured, note } | { kind: sources, operations: [{ id, reason: not_found | pdf | unchecked | generated }] } | { kind: assumption, id, text } | { kind: baseline_errors, errors, rules: { ruleCode: count } } (the reference feed's own errors, accepted by name) | { kind: current_errors, errors, rules: { ruleCode: count } } (the errors the working copy carried before the plan, not the reference feed's, accepted by name) | { kind: simplified_baseline, losses } (a simplified import built)."
          items:
            type: object
            additionalProperties: true
            required: [kind]
            properties:
              kind:
                type: string
                enum: [clause, sources, baseline_errors, current_errors, direct_report, hand_decision]
        note:
          type: string
          nullable: true
    GateClause:
      type: object
      description: "A must clause of the brief the delivery does not meet, as the gates list it: `status` fail (measured against its expectation) or unknown (not measurable: a place not located, a kind the checker does not know, a checker that threw — `note` says why). In a preview gate and a readiness reason `kind` is the clause's own kind (headway_max, running_time…); in the refusal bodies of the compile and the approval and in the acknowledgement record it is the item kind `clause`."
      required: [id, status]
      properties:
        id:
          type: string
        kind:
          type: string
          nullable: true
        status:
          type: string
          enum: [fail, unknown]
        text:
          type: string
          nullable: true
        expected: {}
        measured: {}
        note:
          type: string
          nullable: true
    VerdictTally:
      type: object
      properties:
        total:
          type: integer
        pass:
          type: integer
        fail:
          type: integer
        unknown:
          type: integer
    CoherenceReport:
      type: object
      description: "The coherence report (target design §6.2): read from the feed, never a verdict. Rows are measured on a representative date of their day type (and period); `before` and `changed` only when comparing a previewed plan. Anomalies carry their parameters and an English `text`; the web phrases them in the reader's language."
      required: [computed_at, day_types, rows, anomalies]
      properties:
        computed_at:
          type: string
          format: date-time
        mode:
          type: string
          enum: [single, compare]
        day_types:
          type: array
          description: The day types present in the validity, in order.
          items:
            type: string
            enum: [school_weekday, holiday_weekday, weekday, saturday, sunday_holiday]
        day_type_dates:
          type: object
          description: "Per day type: { dates, representative (YYYY-MM-DD), variants (distinct timetables among its dates), changed? (dates the plan changes) }."
          additionalProperties:
            type: object
            additionalProperties: true
        validity:
          type: object
          nullable: true
          description: "{ from, to, truncated? } — the dates read (at most 800 days)."
          additionalProperties: true
        school_calendar:
          type: object
          nullable: true
          description: "{ status: ok | not_france | no_country | unavailable | region_unknown, country, region, region_source: asked | inferred | common, source: openholidays, covered_until, periods: [{ name, from, to, assumed? }], region_scores?, asked_region?, reason? }."
          additionalProperties: true
        framing:
          type: object
          description: "The framing asked (preview): { day_types, from, to }."
          additionalProperties: true
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CoherenceRow"
        anomalies:
          type: array
          items:
            type: object
            required: [code, text]
            properties:
              code:
                type: string
                enum: [no_service_vs_clause, school_pattern_in_holidays, headway_one_direction, uncovered_dates, stop_without_coords, calendar_without_day, day_type_touched_out_of_scope]
              route_id:
                type: string
              route_short_name:
                type: string
              direction_id:
                type: string
              day_type:
                type: string
              clause_id:
                type: string
              period:
                type: object
                additionalProperties: true
              trips:
                type: integer
              count:
                type: integer
              id:
                type: string
              from:
                type: string
              to:
                type: string
              reason:
                type: string
                enum: [day_type, dates]
              preexisting:
                type: boolean
              text:
                type: string
            additionalProperties: true
        routes_total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        next_offset:
          type: integer
          nullable: true
        preview_id:
          type: string
        title:
          type: string
          nullable: true
        version:
          type: object
          description: "The version the rows were measured on (the session's feed; a preview's: the feed the plan starts from): { fingerprint } — SHA-256 of every service with its dates and the whole content of its trips (every stop's arrival and departure, the headsign, the frequencies), every line's names and colour, every stop's name and position: a time moved at an intermediate stop or a headsign renamed is another version."
          properties:
            fingerprint:
              type: string
              pattern: "^[a-f0-9]{64}$"
    CoherenceClausesBody:
      type: object
      description: "The body of the POST form of the report and its files: the clauses, every one, as the `clauses` query parameter would carry them — the JSON array itself (`[{ id, kind, level?, params, status? }]`: the kinds days, headway_max and span are cross-checked, waived ones ignored). At most 240: 409 TOO_MANY_CLAUSES { max, count } beyond, never a silent cut. An empty array cross-checks none."
      required: [clauses]
      properties:
        clauses:
          type: array
          maxItems: 240
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
              kind:
                type: string
                enum: [days, headway_max, span]
              level:
                type: string
                enum: [must, should]
              params:
                type: object
                additionalProperties: true
          example: [{ id: "c2", kind: "days", level: "must", params: { line: "A", days: ["sun"] } }]
    CoherenceMeasure:
      type: object
      properties:
        first_departure:
          type: string
          nullable: true
          description: HH:MM on GTFS's clock (25:10 is past midnight).
        last_departure:
          type: string
          nullable: true
        headway:
          type: object
          description: "Median minutes between departures at the trunk: { peak, offpeak } (null with fewer than two departures in the windows)."
          properties:
            peak:
              type: integer
              nullable: true
            offpeak:
              type: integer
              nullable: true
        trips:
          type: integer
          description: Departures on the date (frequencies.txt expanded).
        patterns:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              stops:
                type: integer
              trips:
                type: integer
              from:
                type: string
                nullable: true
              to:
                type: string
                nullable: true
        running_time:
          type: object
          nullable: true
          properties:
            min:
              type: integer
            max:
              type: integer
    CoherenceRow:
      allOf:
        - $ref: "#/components/schemas/CoherenceMeasure"
        - type: object
          properties:
            key:
              type: string
              pattern: "^r[a-f0-9]{16}$"
              description: "The row's identity in its report (its line, direction, day type and period, hashed): what POST …/coherence/clauses names."
            route_id:
              type: string
            route_short_name:
              type: string
              nullable: true
            route_long_name:
              type: string
              nullable: true
            route_color:
              type: string
              nullable: true
            direction_id:
              type: string
            direction_name:
              type: string
              nullable: true
            day_type:
              type: string
            period:
              type: object
              description: "{ from, to, name: null | rest, changed } — only when a plan changes part of the day type's dates."
              additionalProperties: true
            date:
              type: string
              format: date
              description: The representative date the row is measured on.
            days:
              type: integer
              description: The dates the row stands for.
            before:
              $ref: "#/components/schemas/CoherenceMeasure"
            changed:
              type: boolean
    Verdict:
      type: object
      nullable: true
      description: "The engine's conformance verdict, recomputed from the conformance results (never from a summary, never from the model) by one server function (verdictOf): null when nothing was measured. `conforms`: no must clause failing nor unknown. `deliverable` is the gate's word (gate.deliverable; null when no gate applies). Carried by the responses of POST /gtfs/transform/preview (with the preview's gate); the client shows it and never recomputes it."
      properties:
        conforms:
          type: boolean
        must:
          $ref: "#/components/schemas/VerdictTally"
        should:
          $ref: "#/components/schemas/VerdictTally"
        failing:
          type: array
          description: "[{ id, kind, text, expected, measured }]"
          items:
            type: object
            additionalProperties: true
        unknown:
          type: array
          description: "[{ id, kind, text, note }]"
          items:
            type: object
            additionalProperties: true
        waived:
          type: integer
        deliverable:
          type: boolean
          nullable: true
          description: "The gate's word (gate.deliverable); null when no gate applies."
        checked_at:
          type: string
          format: date-time
    DemandKpis:
      type: object
      description: "The figures a network is arbitrated with, for a feed. Ridership figures are ESTIMATES (trips = boardings), with their calibration status and uncertainty; a figure that cannot be measured is left out, and `basis` says what each rests on."
      required: [lines, stops, veh_km_year, veh_hours_year, fleet_peak, cost_year, currency, calibrated, uncertainty]
      properties:
        lines:
          type: integer
        stops:
          type: integer
        veh_km_year:
          type: number
        veh_hours_year:
          type: number
        fleet_peak:
          type: integer
          description: Vehicles at peak, no interlining.
        fleet_with_reserve:
          type: integer
        cost_year:
          type: number
        currency:
          type: string
        trips_day:
          type: number
          description: Boardings on the reference weekday (estimate).
        trips_year:
          type: number
          description: Boardings a year (estimate; day-type factors in the estimate's method).
        calibrated:
          type: boolean
        uncertainty:
          type: string
          nullable: true
          description: "±50 % uncalibrated, ±30 % calibrated on a network total, ±20 % on line counts, ±70 % / ±40 % with a stop-based population proxy."
        cost_per_trip:
          type: number
        pop_400m_pct:
          type: number
          description: Residents within 400 m of a served stop (%).
        pop_400m_frequent_pct:
          type: number
          description: Residents within 400 m of a stop with ≥ 4 departures an hour towards the same next stop, 07:00–09:00 (%).
        jobs_400m_pct:
          type: number
        hubs_30min_pct:
          type: number
          description: Mean share of residents reaching the main destinations within 30 min at 08:00 (%).
        commercial_speed_kmh:
          type: number
        basis:
          type: object
          additionalProperties:
            type: string
    DemandEstimate:
      type: object
      description: "Ridership ESTIMATE of a timetable (never a count)."
      properties:
        calibrated:
          type: boolean
        uncertainty:
          type: string
        partial:
          type: boolean
          description: The time budget ran out; the figures are scaled and flagged.
        total_boardings_day:
          type: number
        total_boardings_year:
          type: number
        transit_trips_day:
          type: number
        trips_day_all_modes:
          type: number
        transit_share:
          type: number
        per_line:
          type: array
          items:
            type: object
            properties:
              line_id:
                type: string
              short_name:
                type: string
              mode:
                type: string
              boardings_day:
                type: number
              pkm_day:
                type: number
              peak_load:
                type: number
              capacity_ratio:
                type: number
                nullable: true
              overcrowded:
                type: boolean
              boardings_by_period:
                type: object
        per_stop:
          type: array
          items:
            type: object
            properties:
              stop_id:
                type: string
              name:
                type: string
              boardings_day:
                type: number
        calibration:
          type: object
          nullable: true
        method:
          type: object
          description: Every assumption of the model (departure times, walking, wait, logit, car, capacity, annualisation).
        assumptions:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    DemandCosts:
      type: object
      properties:
        cost_per_km:
          type: number
        cost_per_hour:
          type: number
        currency:
          type: string
    EditResult:
      type: object
      description: "Envelope returned by every edit mutation. The mutated row is echoed under a key named
        after the entity (e.g. `stop`, `route`, `trip`); updates add the `changed` column list,
        deletes return the primary key under `deleted`. The `validation` envelope is always present
        and currently always `skipped: true` — full canonical validation runs on demand via POST
        /gtfs/edit/validate."
      properties:
        changed:
          type: array
          items:
            type: string
          description: Columns actually modified (updates only).
        deleted:
          type: string
          description: Primary key of the removed record (deletes only).
        validation:
          type: object
          description: Per-edit incremental validation envelope (skipped under the canonical-only engine).
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
            skipped:
              type: boolean
            reason:
              type: string
              example: incremental_validation_disabled_canonical_only
            elapsedMs:
              type: number
            truncated:
              type: integer
            totalAvailable:
              type: integer
      additionalProperties: true
    ValidationFinding:
      type: object
      description: A single validator finding, normalised from the MobilityData canonical report.
      properties:
        ruleCode:
          type: string
          description: Rule code from the rules.json catalogue.
        severity:
          type: string
          enum:
            - error
            - warning
            - info
        message:
          type: string
      additionalProperties: true
    ValidationReport:
      type: object
      description: Normalised validation report produced by the canonical-validator adapter.
      properties:
        valid:
          type: boolean
          description: True when no error-severity finding remains after profile overrides.
        errors:
          type: object
          description: Findings grouped by GTFS file name (e.g. `stops.txt`).
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ValidationFinding"
        counts:
          type: object
          properties:
            errors:
              type: integer
            warnings:
              type: integer
            infos:
              type: integer
        profile:
          type: string
          example: canonical
        engine:
          type: string
          example: mobilitydata-canonical
    ValidationDelivery:
      type: object
      description: "What the export gate (GET /gtfs/edit/export, exportService.assertExportable) will decide on a verified report, as POST /gtfs/edit/validate returns it: against the session's baseline (the verified report of the feed as ingested) only the errors above it hold the export, by rule code — the errors the feed already had are not the user's; a session without a baseline (a network built here) must have no error at all. The export preflight reads it instead of counting errors on its own."
      properties:
        baseline:
          type: boolean
          description: The session has a modification baseline.
        preexisting:
          type: integer
          description: The baseline's error count (0 without a baseline).
        new_errors:
          type: array
          nullable: true
          description: "The errors above the baseline by rule code (what the edits broke); null without a baseline."
          items:
            type: object
            properties:
              code:
                type: string
              before:
                type: integer
              after:
                type: integer
        exportable:
          type: boolean
          description: "No new error against the baseline; without a baseline, no error at all."
    UploadResult:
      type: object
      description: Response of POST /gtfs/upload and GET /gtfs/load-sample.
      properties:
        sessionId:
          type: string
          format: uuid
          description: Session ID to send back in X-Session-ID.
        valid:
          type: boolean
        validationReport:
          $ref: "#/components/schemas/ValidationReport"
        migration_ms:
          type: number
          description: CSV → SQLite migration duration.
        editSessionDropped:
          type: boolean
          description: "Upload only: true when re-uploading over a session that had an open edit DB."
        pendingEditsLost:
          type: integer
          description: "Upload only: count of pending edits discarded by the re-upload."
        meta:
          type: object
          properties:
            bomStripped:
              type: array
              items:
                type: string
            encodingFallbacks:
              type: array
              items:
                type: string
    HistoryEntry:
      type: object
      description: One row of the session `_edit_log` (undo/redo journal).
      properties:
        id:
          type: integer
        ts:
          type: string
          description: Timestamp of the edit.
        entity:
          type: string
          example: stop
        entity_id:
          type: string
        action:
          type: string
          example: update
        description:
          type: string
        undone:
          type: integer
          enum:
            - 0
            - 1
          description: 1 when the edit is currently undone.
        actor:
          type: string
          nullable: true
          description: "The account that made the edit (WP10's named journal); null without an account, and on the rows written before the column existed."
        actor_name:
          type: string
          nullable: true
          description: "The name it was made under: the account's display name, else the name the browser declares in X-Actor-Name (URI-encoded, 2–120 characters with a letter), else — for a change plan — the name of its acknowledgement."
        reason:
          type: string
          nullable: true
          description: "Why: manual (a direct retouch, D20), plan (a change plan applied), sql (the SQL console)."
    EditAcknowledgement:
      type: object
      description: "The named acknowledgement recorded with an edit (the `_acknowledgements` table, by edit id; see AcknowledgementRecord), as GET /gtfs/edit/history returns it next to its entry: who (`by.name`), what (`clauses`, `items`), when (`at`, the server's clock), the `note`, and `description`, the one-line sentence the edit log already carries (acknowledgement.describe). Absent from an entry delivered without one."
      properties:
        id:
          type: string
        by:
          type: object
          properties:
            name:
              type: string
        at:
          type: string
          format: date-time
        scope:
          type: string
          example: commit
        clauses:
          type: array
          description: The ids of the clause items.
          items:
            type: string
        items:
          type: array
          description: "{ kind: clause, id, status: fail | unknown, text, expected, measured, note } | { kind: sources, operations: [{ id, reason }] } | { kind: assumption, id, text }."
          items:
            type: object
            additionalProperties: true
            required: [kind]
            properties:
              kind:
                type: string
                enum: [clause, sources, assumption]
        note:
          type: string
          nullable: true
        description:
          type: string
          description: "\"acknowledged by <name>: clauses <id> (<status>), …; sources <id> (<reason>), …; assumptions <id>, …\" (the parts present only)."
          example: "acknowledged by A. Martin: clauses c3 (fail)"
    DemandInputs:
      type: object
      description: "What the demand model knows about a territory (services/demand/inputs.js): the feed territory's layers upgraded with official data where it exists (France: commune populations or the INSEE 200 m grid, SIRENE establishments, the school directory with enrolments, INSEE commuting flows). Every typical value is flagged `estimated` and stated in `warnings`; a source that failed leaves a warning and `partial: true`."
      properties:
        cells:
          type: array
          description: "The territory's bounding box on a grid of `grid.cell_m` metres. pop = residents; jobs = jobs at the workplace; students = pupils and students at their place of study; commune = official code (France). totals are the sums of the cells."
          items:
            type: object
            properties:
              id:
                type: string
                example: c19576_605
              lat:
                type: number
              lon:
                type: number
              pop:
                type: number
              jobs:
                type: number
              students:
                type: number
              commune:
                type: string
        generators:
          type: array
          description: "Named places for display, targeting and non-commute attraction. weight = persons attracted on a weekday (jobs, enrolment or typical visits). Their jobs and students are already in their cell."
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              category:
                type: string
                description: "school, college (higher education), hospital, civic, market, station, leisure, work, or the user's category."
              lat:
                type: number
              lon:
                type: number
              weight:
                type: number
              jobs:
                type: number
              students:
                type: number
              level:
                type: string
                enum: [preschool, primary, lower_secondary, upper_secondary, other]
              source:
                type: string
                enum: [osm, sirene, education, user]
              estimated:
                type: boolean
        od:
          type: array
          description: "Flows between places: INSEE commuting flows at commune level (unit people) or the user's table (unit trips, observed)."
          items:
            type: object
            properties:
              from:
                $ref: "#/components/schemas/DemandPlace"
              to:
                $ref: "#/components/schemas/DemandPlace"
              flow:
                type: number
              unit:
                type: string
                enum: [people, trips]
              purpose:
                type: string
                enum: [work, school, other]
              source:
                type: string
                enum: [mobpro, mobsco, user]
              observed:
                type: boolean
        observed:
          type: object
          nullable: true
          description: The user's ridership for a typical weekday.
          properties:
            network_daily:
              type: number
            per_line:
              type: object
              additionalProperties:
                type: number
            per_stop:
              type: object
              additionalProperties:
                type: number
            day_type:
              type: string
              nullable: true
            source:
              type: string
        totals:
          type: object
          properties:
            pop:
              type: number
            jobs:
              type: number
            students:
              type: number
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              url:
                type: string
                nullable: true
              license:
                type: string
                nullable: true
              used_for:
                type: array
                items:
                  type: string
        quality:
          type: object
          properties:
            population:
              type: string
              enum: [none, default_density, osm_residential, official_commune_scaled, official_grid, user]
            jobs:
              type: string
              enum: [none, osm_proxy, sirene, user]
            schools:
              type: string
              enum: [none, osm, education_annuaire, user]
            od:
              type: string
              enum: [none, mobpro, user]
            observed:
              type: string
              enum: [none, user]
        warnings:
          type: array
          items:
            type: string
        grid:
          type: object
          properties:
            cell_m:
              type: number
        place:
          type: object
          nullable: true
          properties:
            name:
              type: string
            country_code:
              type: string
            lat:
              type: number
            lon:
              type: number
            bbox:
              type: array
              items:
                type: number
        partial:
          type: boolean
        generatedAt:
          type: string
    DemandPlace:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        lat:
          type: number
        lon:
          type: number