  /gtfs/network/plan:
    post:
      tags:
        - Network Studio
      summary: "The planner (SSE): a brief → a Network Spec through tools (geocoding, validation, routing, questions). Gated like the chat. A brief that MODIFIES the network that runs is not designed: the planner finds its published feed and hands the brief over (event `handoff`), and the studio opens the real feed in the Change Studio."
      description: |-
        Events: `meta`, `token`, `tool_pending`, `retry` (the model's answer was cut in its stream and the round is sent again on its own, up to three attempts: { attempt, max, code, status }; the words streamed so far are not the answer), `budget` (the turn's ceiling AI_TURN_MAX_WEIGHTED_TOKENS is spent: { code: TURN_BUDGET, weighted, max }; one closing call without tools follows and the turn ends `incomplete`, never ready), `step`, `requirements` (the record set_requirements keeps, merged server-side: clauses by id — the model may add or refine a clause, never drop a must clause, never set one waived or confirmed, never lower a must to should; a clause the user decided is kept whole — and `lines_requested` by name: a line the model leaves out of a shorter list stays on the record, and the clauses derived from the lines already recorded (`req_<line>_exists`, `_termini`, `_via`) become explicit must clauses of the record before the merge, so a shorter list or a should-level clause naming the same line never drops them), `territory`, `corridors`, `feeds`, `spec` (with `imported` and `losses` after a simplified import), `geometry`, `coverage`, `quality`, `questions`, `handoff` (NetworkHandoff: the turn then ends), `levers`, `usage` (the turn's tokens, with `budget: { weighted, max }` against that ceiling), `error`, then — once per turn, before `done` — `verdict` (VerdictEvent: the engine's verdict recomputed from the conformance results, the readiness { ready, clean, reasons, acknowledgeable, ready_once_acknowledged }, and the sentences of the model's prose contradicting it; the prompt forbids the model to state a conformance count), and `done` { reason: complete | incomplete | empty | aborted | error, specOk, specChanged, asked, handoff, ready, clean, conforms, not_ready_reasons, acknowledgeable, ready_once_acknowledged, verdict, quality, requirements, needs, corrections (PlannerCorrections) }.

        Self-correction (llm/selfCorrection): when the model ends a turn in which it changed the spec or the requirements, the engine checks the result — the spec's blockers (a stop without coordinates aside), a high-impact open question recorded and never asked, the must clauses not met (measured as evaluate_plan does), then the canonical validator on the compiled feed — and its refusals go back to the model as a user message: `correction` (PlannerCorrection) { attempt, max, phase: "retry", reasons }. After PLANNER_CORRECTION_ATTEMPTS attempts (default 3) the refusals left end the turn on the person's decision: `correction` { phase: "escalated" }, then `questions` built by the server (each { id, question, options, default, why, origin: "engine", clause? }), and `asked` true (`questions_pending`). Not corrected: a turn that asked, handed over, was cut off or refused, or changed nothing; a simplified baseline; a missing validator; the offer's line limit; uncovered requirement sentences. The prose before a correction is superseded: the verdict's `prose` judges the text streamed after the last `correction` only.

        `ready` is the server's readiness, the same gate the compile enforces: false while a HARD reason stands — `refused`, `incomplete`, `questions_pending`, `handoff` (the brief was handed over), `simplified_baseline` (a simplified import is never ready to project), `no_plan`, `blockers`, `stops_unlocated`, `over_plan_limit`, `validator_unavailable` (no canonical validator on this server: the build could not be validated), `clause_failed` and `clause_unknown` ({ code, clause: GateClause } — a must clause measured as failing, or not measurable; a plan whose conformance was never measured lists every must clause of the brief that is not waived as `clause_unknown`, its clause carrying `note` "not measured: evaluate the plan"). The soft reasons (`major_finding`, `fleet_over`, `budget_over`, `direction_unserved`, `accessibility`) only make `clean` false. `acknowledgeable` is the subset of clause reasons a named person may accept to build anyway: POST /gtfs/network/compile derives the same clauses again server-side and refuses without their acknowledgement. `ready_once_acknowledged` (in the `verdict` event's readiness and in `done`) is the server's own answer to "ready once a named person accepts the clauses": true when the plan is not ready only because of must clauses — `acknowledgeable` is not empty and every hard reason standing is `clause_failed` or `clause_unknown` (soft reasons do not count) — so the studio offers the named acknowledgement the compile asks for, never a build that would be refused; false otherwise, and false when the plan is ready. The client shows it as it is and never re-derives it from the reasons.

        With ACCOUNTS_ENABLED the `studio` entitlement is required (401 NOT_SIGNED_IN / 403 ENTITLEMENT_REQUIRED); the free trial stays for the chat assistant only.

        Contract first (mission step 3): until the project's `contract` is decided, assumed or recorded empty (none, or a draft), the turn is phase "extract" ONLY — the objectives extractor reads the brief and its documents (one model turn, one tool: record_objectives), nothing is designed — and emits `meta` { phase: "extract" }, `contract` { contract (a draft: each clause with its quote and the quote verifier's word, the wishes « à vérifier à la main », `extracted` kept verbatim with the model and the date), coverage (ContractCoverage) }, `usage`, `verdict` and `done` { phase: "extract", ready: false, contract, coverage }. Once ready, the contract's clauses are the record's (a decided clause returned whole whatever the model sends), the model reads it above the conversation, and the readiness holds the plan while a requirement sentence is uncovered (hard reason `requirements_uncovered`). The offer's line limit is a question before the design (never lines merged or dropped to fit): when the ready contract itself names more lines (its clauses' distinct lines, or lines_min) than the offer allows and the person has not answered yet, the server asks it without any model call — `questions` [{ id: "offer_limit", question, options (design them all, delivered after an upgrade of the offer; limit the design), default, why }], `verdict`, then `done` { asked: true, ready: false, offer_limit: { lines, max } } — and the answer, sent back as the next message ("question → answer"), is read by the model; a design over the limit carries `over_plan_limit` in the verdict (D9). A contract with an unnamed decision is refused before the stream opens (400 ACKNOWLEDGEMENT_UNNAMED).
      security:
        - {}
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief]
              properties:
                brief:
                  type: string
                spec:
                  type: object
                messages:
                  type: array
                  items:
