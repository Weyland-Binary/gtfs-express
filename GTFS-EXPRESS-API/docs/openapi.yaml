      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/calendar_service/{service_id}:
    get:
      tags:
        - Read
      summary: Calendar row for a service_id.
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/calendar_dates_service/{service_id}:
    get:
      tags:
        - Read
      summary: Calendar date exceptions for a service_id.
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/average_trip_times:
    get:
      tags:
        - Search & Stats
      summary: Average trip duration per route.
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/statistics:
    get:
      tags:
        - Search & Stats
      summary: Aggregated feed statistics (entity counts, service span, frequencies).
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/quality_audit:
    get:
      tags:
        - Search & Stats
      summary: Semantic quality audit of the feed (speeds, duplicate stops, naming, shape fit, calendars, unused objects, colours).
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/all_shapes:
    get:
      tags:
        - Read
      summary: Every shape of the feed (map overview).
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/shapes_for_route/{route_id}:
    get:
      tags:
        - Read
      summary: Shapes referenced by the trips of a route.
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/route_patterns/{route_id}:
    get:
      tags:
        - Read
      summary: Stop patterns of a route (ordered stops, trips following each pattern, shapes in use).
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/shape_coverage/{agency_id}:
    get:
      tags:
        - Read
      summary: Per-route trip counts, trips without shape and distinct shapes for an agency.
      parameters:
        - name: agency_id
          in: path
          required: true
          schema:
            type: string
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/shapes_unused:
    get:
      tags:
        - Read
      summary: Shapes no trip references (up to 200, with their points).
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/upload-stats:
    get:
      tags:
        - Upload
      summary: Public aggregate upload statistics.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
  /gtfs/admin/stats:
    get:
      tags:
        - Admin
      summary: Aggregated usage statistics for the dashboard (30 s TTL cache).
      security:
        - AdminToken: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/admin/ping:
    get:
      tags:
        - Admin
      summary: Lightweight admin-token validation ping.
      security:
        - AdminToken: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/admin/ai-usage:
    get:
      tags:
        - Admin
      summary: Live AI cost-limiter counters (hourly / daily windows).
      security:
        - AdminToken: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/admin/active:
    get:
      tags:
        - Admin
