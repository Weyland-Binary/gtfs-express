  /gtfs/workspace/projects/{projectId}/documents:
    parameters:
      - $ref: "#/components/parameters/WorkspaceProjectId"
    post:
      tags:
        - Workspace
      summary: "Keep a document (uploaded by POST /network/documents) with the project: same retention, and its `sent_to_assistant` as the person left it; the studios' memory brings it back from here once it forgot it."
      security:
        - ClientToken: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id]
              properties:
                document_id:
                  type: string
                  pattern: "^[a-f0-9]{24}$"
      responses:
        "201":
          description: The document, kept.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      kind:
                        type: string
                      pages:
                        type: integer
                        nullable: true
                      size:
                        type: integer
                      sent_to_assistant:
                        type: boolean
                      expires_at:
                        type: string
                        format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
