      summary: "The public GTFS feeds serving a territory, most relevant first. France: the National Access Point (transport.data.gouv.fr) matched through the official geography (commune, EPCI, département, région) — local network, département, région, neighbours, national operators with stops at the place — with each feed's validity, size and page; then the Mobility Database entries it does not already publish. Elsewhere: the Mobility Database. `sources` says which answered."
      security: []
