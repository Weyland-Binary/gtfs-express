  /gtfs/network/coherence:
    get:
      tags:
        - Network Studio
      summary: "The coherence report of the session's feed (target design §6.2, D11): one row per line × direction × day type — first and last departure, headway at the trunk in the peak (07–09, 16–19) and off-peak (09–16, 19–end) windows, departures, the patterns used, running time — measured on the day type's representative date (the most common timetable among its dates), and the anomalies first (no_service_vs_clause, school_pattern_in_holidays, headway_one_direction, uncovered_dates, stop_without_coords, calendar_without_day). Day types come from calendar.txt and calendar_dates.txt and the school calendar the server knows (a French network: its public holidays computed, its school holidays from the territory dossier, else OpenHolidays — SCHOOL_HOLIDAYS_FETCH_ENABLED=false keeps the server offline); outside France, or without the school calendar, weekdays are one `weekday` and `school_calendar.status` says why. A network built here contributes its brief's clauses and its school calendars' zone. Read only, paginated by line, computed once per state of the feed, cancelled when the client leaves."
      security:
        - SessionId: []
      parameters:
        - name: offset
          in: query
          required: false
          description: The first line of the page (lines sorted by route_sort_order, then name).
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Lines per page (default 200, at most 500). The anomalies come whole with every page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: region
          in: query
          required: false
          description: "The school zone (France: A, B or C, a région or an académie). Without it: the zone of the design's school calendars, else the one the feed's own calendars follow (region_source: inferred), else the holidays common to every zone (region_source: common)."
          schema:
            type: string
            example: C
        - name: clauses
          in: query
          required: false
          description: "The contract's clauses as a JSON array (at most 240, the contract's own bound: 409 TOO_MANY_CLAUSES beyond, never a silent cut): the kinds days, headway_max and span are cross-checked by the anomalies no_service_vs_clause and headway_one_direction; waived ones are ignored. Without the parameter, a network built here cross-checks its brief's clauses; an empty array (`[]`) cross-checks none (the contract is not decided). A long list outgrows a URL (a request line past 16 KB is refused 431, about fifty clauses): send it in the body of the POST form of this path. The report never judges a clause (the verdict is the conformance engine's)."
          schema:
            type: string
            example: '[{"id":"c2","kind":"days","params":{"line":"A","days":["sun"]}}]'
      responses:
        "200":
          description: The report (CoherenceReport, mode `single`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoherenceReport"
        "400":
          description: INVALID_SESSION.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: SESSION_NOT_FOUND (the working copy expired or was never opened here).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "TOO_MANY_CLAUSES { max: 240, count }: more clauses than the contract's bound were sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Network Studio
      summary: "The same report as GET /gtfs/network/coherence, the contract's clauses in a JSON body: a long contract (a specification read from offer sheets states some thirty clauses a line) outgrows a URL — a request line past 16 KB is refused 431, about fifty clauses — so the body carries them, every one, up to the contract's bound of 240 (409 TOO_MANY_CLAUSES beyond, never a silent cut). The query's other parameters (offset, limit, region) are read as for the GET; the body's clauses win over a `clauses` query parameter. The same report, the same cache, the same refusals."
      security:
