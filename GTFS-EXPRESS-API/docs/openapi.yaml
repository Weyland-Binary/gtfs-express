  /gtfs/share:
    post:
      tags:
        - Share
      summary: "Create a public read-only share of the loaded feed: a snapshot behind a token, with its card (counts, validation, Diagnostic, network report). A DELIVERY: the snapshot (the edited state when an edit database exists) goes through the canonical validator before the share exists — 503 VALIDATOR_UNAVAILABLE / VALIDATOR_FAILED when it cannot answer, 409 VALIDATION_NEW_ERRORS { new_errors, preexisting } on errors above the session's baseline (409 VALIDATION_ERRORS { errors, warnings, by_rule } on any error when the session has no baseline); on a refusal the share folder is removed, nothing is published. The validator run costs seconds on big feeds: queued behind the compute gate (429 BUSY with Retry-After beyond it)."
      security:
        - SessionId: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
                include_names:
                  type: boolean
                  default: false
                  description: "« Inclure les acceptations nominatives » (D39): keep the names (and notes) of the acknowledgements the shared state stands on. Default false: the records are anonymised when the share is created."
      responses:
        "201":
          description: "{ token, secret, expiresAt, card }. `card.acknowledgements` lists the named acknowledgements the shared state stands on (the working copy's `_acknowledgements`, the build's gate): { id, at, scope, clauses, items } — with `by` and `note` only when `include_names` was true (`card.includes_names`, D39). `card.validation` is the report of THIS snapshot, never a stored report of an older state: { errors, warnings, infos, valid, engine, preexisting_errors (what the baseline already carried), new_errors: [] }. For a feed built by the Network Studio, `card.gate` carries the build's verdict, validation and acknowledgement without the person's name."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ValidationRefused"
        "429":
          description: "BUSY — the compute gate is full (the validator run is queued like the demand and project work); `Retry-After` says when to try again."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          $ref: "#/components/responses/ValidatorUnavailable"
  /gtfs/share/{token}:
    get:
      tags:
        - Share
      summary: "The card of a share: title, counts, validation of the shared snapshot itself ({ errors, warnings, infos, valid, engine, preexisting_errors: what the baseline already carried, new_errors: [] }), Diagnostic, design quality, sources, versions, and `gate` for a feed built by the Network Studio (the build's verdict, validation and acknowledgement — without the person's name unless the share was created with include_names); `acknowledgements` and `includes_names` (D39)."
