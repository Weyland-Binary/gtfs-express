  /gtfs/admin/client-address:
    get:
      tags:
        - Admin
      summary: The caller's address as the API sees it behind the proxies.
      description: >-
        To set TRUST_PROXY_HOPS from what the server receives (DEPLOYMENT.md,
        "Client addresses behind the proxies"). `ip` is req.ip under the
        current setting (`trust_proxy_hops`); `forwarded_for` is the
        X-Forwarded-For header as received, left to right; `chain` gives, for
        each possible hop count, the address req.ip would be (`hops` 0: the
        socket's peer, 1: the last X-Forwarded-For entry, and so on). Called
        from the owner's own computer, the right setting is the smallest
        `hops` whose `ip` is the owner's public address. Not cached.
      security:
        - AdminToken: []
      responses:
        "200":
          description: The address and the forwarding chain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ip:
                    type: string
                  trust_proxy_hops:
                    type: integer
                    minimum: 0
                  forwarded_for:
                    type: array
                    items:
                      type: string
                  chain:
                    type: array
                    items:
                      type: object
                      properties:
                        hops:
                          type: integer
                        ip:
                          type: string
                          nullable: true
                  ts:
                    type: string
                    format: date-time
        "401":
          description: Missing or wrong X-Admin-Token.
        "503":
          description: ADMIN_TOKEN is not set (the admin surface is off).
