  /gtfs/transform/preview:
    post:
      tags:
        - Transform
      summary: "Run a change plan on a sandbox copy of the feed. Nothing is written (measurement, not delivery). Returns each step (applied, skipped, blocked with the questions to answer, failed; with the verdict on its quote), the rows changed per table, the semantic diff (per route, day type and period) with readable lines, new integrity problems, the impact (km, hours, cost, THE fleet), brief conformance before/after (the clauses normalised server-side: a waived or confirmed status counts only with a named user decision), the canonical validator's comparison (run by default wherever the validator is available, see `validate`), the commit `gate` (what POST /transform/commit will refuse and what it will ask a named person to acknowledge), the engine's `verdict` (Verdict: verdictOf of the conformance after the plan, with the gate; the client shows it and never recomputes it) and the change's geometry `geo`. `id` is the preview to commit (null when nothing changes); a stored preview lives 30 minutes. The plan's own « inchangé » clauses (unchanged_except with params.derive) are made concrete from the operations' lines and windows (unknown, with the reason, when they cannot be)."
      security:
        - SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plan
              properties:
                plan:
                  type: object
                  required:
                    - operations
                  properties:
                    title:
                      type: string
                    operations:
                      type: array
                      items:
                        type: object
                        required:
                          - type
                        properties:
                          id:
                            type: string
                          type:
                            type: string
                          params:
                            type: object
                          source:
                            type: object
                            description: "Where the brief asks for it: { quote, document?, page? }. The engine verifies the quote against the brief, the user's messages and attached text documents and records `verified` (true|false) and `verify_reason` (not_found | pdf | missing); operations generated by the optimizer carry `generated_by: \"optimizer\"` instead of a quote."
                    requirements:
                      type: object
                      description: "Clauses that must hold afterwards (the judge's clause kinds and date parameters). Named periods of `period` resolve with the plan's `calendars`, `region` and the session's country."
                    costs:
                      type: object
                      description: "{ cost_per_km, cost_per_hour, currency }: the one cost basis of the impact and of budget_max clauses (defaults 4.2 EUR/km, stated as an assumption)."
                    calendars:
                      type: object
                      description: "Named periods { name: { from, to } | { dates } | { ranges } } for operations and clauses."
                    region:
                      type: string
                      description: School zone for school_days / school_holidays periods.
                    weekend:
                      type: array
                      items:
                        type: string
                validate:
                  type: boolean
                  description: "Run the canonical validator on the feed before and after, with the preview (tens of seconds on a big feed), so that the preview says what the commit will find. Unsaid (absent or null), it defaults to true wherever the validator is available and to false on a server without it; `false` asks for the fast preview alone (a client re-runs it at each edit, before validating the stable plan), and the validator then runs at commit. On a server without the validator the gate blocks with `validator_unavailable` whatever is asked, and a preview asked with `validate: true` there stores `validation: { error }`: a preview never reads as valid on a report that proves nothing."
                today:
                  type: string
                  format: date
                  description: "YYYY-MM-DD: the date undated time clauses are measured from (when inside the feed's validity). Defaults to the server's clock — the date the chat's change plans and the projects measure from — so one plan gets one verdict wherever it is previewed; an evaluation freezes it. Anything but YYYY-MM-DD falls back to the clock."
      responses:
        "200":
          description: "The preview, with `verdict`: verdictOf(conformance.after, { gate }) — the must and should tallies, the failing and unknown clauses, `deliverable` = gate.deliverable; null when the plan carries no clause (the gate still says whether it can be delivered)."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id:
                    type: string
                    nullable: true
                  steps:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        quote_verified:
                          type: boolean
                          nullable: true
                          description: "true: the quote is in what the user wrote; false: not found, or from a PDF the server cannot read; null: not checked (generated by the optimizer, or a plan previewed without its brief)."
                        quote_reason:
                          type: string
                          enum: [not_found, pdf, missing, generated, unchecked]
                        notes:
                          type: array
                          description: "Structured facts behind a step: `timing_basis` { basis: observed_hops|line_band|network_band|mode_default, speed_kmh, line, band, legs, samples, distance: road|straight|mixed, precision: minutes|seconds } — what the new running times rest on; `suspicious_leg` { from_stop, to_stop, from_name, to_name, straight_m, routed_m, ratio } — a road leg over twice the straight distance."
                          items:
                            type: object
                            additionalProperties: true
                            properties:
                              code:
                                type: string
                                enum: [timing_basis, suspicious_leg]
                  validation:
                    type: object
                    nullable: true
                    additionalProperties: true
                    description: "When the validator ran with the preview (`validate` true, or unsaid where the validator is available) and the plan changes something: { before: counts, after: counts, valid_after, new_errors: [{ code, before, after }], engine } — new errors by rule code (what the plan breaks, not what was already broken) — or { error } when the validator could not answer. Null otherwise (`validate: false`, nothing to change, or no validator here and `validate` unsaid)."
                  gate:
                    type: object
                    description: "What the commit will refuse or ask (POST /transform/commit enforces it server-side, whatever the client sends). `can_commit`: something to commit and nothing blocking (acknowledgements may still be required). `deliverable`: can_commit, nothing to acknowledge and a validator to run — the only state a chat card may apply from."
                    properties:
                      can_commit:
                        type: boolean
                      deliverable:
                        type: boolean
                      blocking:
                        type: array
                        description: "No override: { code: blocked_steps, steps: [{ id, type, status }] } | { code: integrity, problems: [{ code, count }] } | { code: validator_unavailable } (no canonical validator on this server: nothing can be committed) | { code: validation_new_errors, new_errors: [{ code, before, after }] } (the validator ran with the preview and finds new errors: change the plan)."
                        items:
                          type: object
                          additionalProperties: true
                          required: [code]
                          properties:
                            code:
                              type: string
                              enum: [blocked_steps, integrity, validator_unavailable, validation_new_errors]
                      acknowledgeable:
                        type: array
                        description: "Committed only when a NAMED person acknowledges them (AcknowledgeRequest): { code: clauses_failing, clauses: [GateClause] } (the plan's must clauses failing after it) | { code: clauses_unknown, clauses: [GateClause] } (must clauses that cannot be measured: `note` says why) | { code: sources_unverified, operations: [{ id, reason: not_found | pdf | unchecked | generated }] } (applied operations whose quote the engine could not verify; an operation the user wrote or edited — source.author user — or one with no quote at all is never listed) | { code: baseline_errors, errors, rules: { ruleCode: count } } (the errors the reference feed already carried — the loaded feed's baseline —, still there after the plan, none new: accepted by name, acknowledge.baseline_errors — 2026-10-05) | { code: current_errors, errors, rules: { ruleCode: count } } (the errors the working copy carried before the plan that the loaded feed's baseline did not — an edit by hand —, none new: accepted by name, acknowledge.current_errors, never recorded as the reference feed's) | { code: changes_not_asked, changes: [{ route, label, count, from, to, dates } | { table, what: added | removed | changed, rows, columns (changed), examples }] } or { code: changes_not_asked, error } (the lines and dates the plan changes, and the rows of the other tables it writes, that no clause of the plan asks for — judge/changeAccounting, none for a plan without clauses —, or an accounting that could not run: accepted by name, acknowledge.changes)."
                        items:
                          type: object
                          additionalProperties: true
                          required: [code]
                          properties:
                            code:
                              type: string
                              enum: [clauses_failing, clauses_unknown, sources_unverified, baseline_errors, current_errors, changes_not_asked]
                      validation:
                        type: string
                        enum: [passed, new_errors, not_run, unavailable]
                        description: "passed | new_errors: the validator ran with the preview; not_run: it will run at commit (`validate: false`, nothing to change, or the validator could not answer with the preview); unavailable: no validator on this server (the commit is refused)."
                  verdict:
                    $ref: "#/components/schemas/Verdict"
                  geo:
                    type: object
                    description: "What the plan touches on the map (routes whose patterns or shapes change; stops added, removed, moved, losing or gaining service); polylines of at most 300 points."
                    properties:
                      routes:
                        type: array
                        items:
                          type: object
                          properties:
                            route_id:
                              type: string
                            short_name:
                              type: string
                            color:
                              type: string
                              nullable: true
                            status:
                              type: string
                              enum: [added, removed, changed]
                            before:
                              type: array
                              nullable: true
                              description: "[[lat, lon], …]"
                              items:
                                type: array
                                items:
                                  type: number
                            after:
                              type: array
                              nullable: true
                              description: "[[lat, lon], …]"
                              items:
                                type: array
                                items:
                                  type: number
                      stops:
                        type: array
                        items:
                          type: object
                          properties:
                            stop_id:
                              type: string
                            name:
                              type: string
                            lat:
                              type: number
                            lon:
                              type: number
                            status:
                              type: string
                              enum: [added, removed, moved, lost_service, gained_service]
                            before:
                              type: array
                              description: "[lat, lon] before a move."
                              items:
                                type: number
                      bbox:
                        type: array
                        nullable: true
                        description: "[S, W, N, E]"
                        items:
                          type: number
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: PLAN_TOO_LARGE — the plan exceeds 400 000 characters.
        "429":
          description: "RATE_LIMITED — the route's own per-minute budget per IP (TRANSFORM_PREVIEW_RATE_LIMIT_MAX, default 60; licensed accounts BETA_TRANSFORM_PREVIEW_RATE_LIMIT_MAX, default 120, per account): a simulation costs seconds of CPU on a big feed."
        "500":
          description: PREVIEW_FAILED { message }.
  /gtfs/transform/preview/{id}/gtfs-diff/{format}:
    get:
      tags:
        - Transform
      summary: "A preview's row-level changes in the GTFS Diff format (MobilityData / transport.data.gouv.fr): v1 CSV (id, file, action, target, identifier, initial_value, new_value, note — updates carry the changed fields before and after, a compare-and-set) or the v2 draft JSON (file_diffs with row_changes, ≤ 50 rows per file)."
      security:
        - SessionId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum:
              - csv
              - json
      responses:
        "200":
          description: The GTFS Diff (text/csv or JSON).
        "404":
          description: The preview expired or belongs to another session.
  /gtfs/transform/preview/{id}/diff:
    get:
      tags:
        - Transform
      summary: "A stored preview's semantic diff ({ items, totals, empty }, the items as POST /gtfs/transform/preview answers them) and its geometry (geo: the routes and stops it touches, before and after), computed again from the stored changeset: what the web reads for a preview it did not simulate itself (the direct mode's). 409 PREVIEW_STALE once the working copy changed since the preview."
      security:
        - SessionId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{ preview_id, diff: { items, totals, empty }, geo }."
        "400":
          description: INVALID_INPUT (not a preview id).
        "404":
          description: The preview expired or belongs to another session.
        "409":
          description: PREVIEW_STALE (the working copy changed since the preview).
  /gtfs/transform/draft:
    get:
      tags:
        - Transform
      summary: "The working copy's draft (X-Session-ID names the working copy): { draft: { session, created_at, edits } | null }. A draft is a copy of the working copy kept as a session of its own: the reader reads it and the editors write it with X-Session-ID set to draft.session."
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"

    post:
      tags:
        - Transform
      summary: "Open the working copy's draft: the live one, or a new copy of the working copy (its journal empty, its edit mode on) → { draft }."
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"

    delete:
      tags:
        - Transform
      summary: "Abandon the working copy's draft: its copy removed → { dropped }."
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"

  /gtfs/transform/draft/preview:
    post:
      tags:
        - Transform
      summary: "Compare the draft with the working copy whole, as POST /gtfs/transform/preview answers (steps empty): the semantic diff, the rows per table, the integrity, the canonical validator before/after (validate defaults to true where it is available), the gate and the engine's verdict; the preview stored is the draft's changes on the working copy. 404 DRAFT_NOT_FOUND without a draft."
      security:
        - SessionId: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                validate:
                  type: boolean
                language:
                  type: string
                today:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /gtfs/transform/draft/merge:
    post:
      tags:
        - Transform
      summary: "Join a plan simulated on the draft (POST /gtfs/transform/preview with X-Session-ID set to the draft's session) to the draft as ONE retouche of its journal, undone like any other, with the row-count check; no validator and no acknowledgement (the draft's application is the delivery). 409 PLAN_BLOCKED / PREVIEW_STALE / INTEGRITY_FAILED / COMMIT_DIVERGED; 404 PREVIEW_NOT_FOUND / DRAFT_NOT_FOUND."
      security:
        - SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - previewId
              properties:
                previewId:
                  type: string
                  pattern: "^[a-f0-9]{18}$"
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /gtfs/transform/draft/apply:
    post:
      tags:
        - Transform
      summary: "Apply the draft on the working copy through the commit's gate (as POST /gtfs/transform/commit: one undoable edit, the validator, the named decision acknowledge.hand or acknowledge.direct, the proof), then drop the draft. 409 PREVIEW_STALE when the draft changed since the preview; 404 DRAFT_NOT_FOUND without a draft."
      security:
        - SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - previewId
              properties:
                previewId:
                  type: string
                  pattern: "^[a-f0-9]{18}$"
                acknowledge:
                  $ref: "#/components/schemas/AcknowledgeRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /gtfs/transform/draft/reopen:
    post:
      tags:
        - Transform
      summary: "Undo an application on its draft: a draft opened on the version the working copy holds (vN), the working copy taken back to vN-1 (the application's edit undone), and the draft holding the change as one retouche (the commit's own statements), so it can be applied again or undone. A brief's application keeps the review report its commit recorded with the edit (never one the client sends); an edit without one reopens a draft without a report, applied again by hand. 409 UNDO_TARGET_NOT_LATEST when the application is no longer the latest change; 409 DRAFT_OPEN when a draft is already open."
      security:
        - SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - editId
              properties:
                editId:
                  type: integer
                  minimum: 1
                title:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /gtfs/transform/commit:
    post:
      tags:
        - Transform
      summary: "Apply a previewed plan to the feed as ONE undoable edit (edit mode): a DELIVERY, through the preview's gate, whatever the client sends. Refused in this order — 404 PREVIEW_NOT_FOUND (expired, or another session's); 409 PLAN_BLOCKED { steps } while a step is blocked or failed; 409 PREVIEW_STALE when the feed changed since the preview; 409 INTEGRITY_FAILED { integrity } when the plan breaks the feed's consistency (no override); 400 INVALID_INPUT / ACKNOWLEDGEMENT_UNNAMED when `acknowledge` is malformed or acknowledges anything without a name; 409 CLAUSES_FAILING / CLAUSES_UNKNOWN { clauses, unacknowledged } while a must clause of the plan fails or cannot be measured and `acknowledge.clauses` does not list it; 409 SOURCES_UNVERIFIED { operations } while an applied operation cites unverified words and `acknowledge.sources` is not true; 409 CHANGES_NOT_ASKED { changes, error? } while the plan changes lines on dates, or rows of a table, that no clause of the plan asks for (or the accounting could not run) and `acknowledge.changes` is not true. A change made by hand is applied on the person's named act (`acknowledge.hand`, recorded as an item { kind: hand_decision, title, operations }). A preview of the direct mode (POST /gtfs/transform/direct) is refused 409 DIRECT_REPORT_UNACCEPTED { report } until `acknowledge.direct` names who delivers its review report as shown — that one decision also accepts the reference feed's own errors. Then the canonical validator runs (when the preview did not run it) on the feed as the plan would leave it and on the feed as it is (tens of seconds on a big feed): a validator that is not installed, unverified or crashed REFUSES (503 VALIDATOR_UNAVAILABLE / VALIDATOR_FAILED), and a new error refuses with 409 VALIDATION_NEW_ERRORS { new_errors, preexisting } with NO override (`acknowledge.validation` is ignored, not refused); the errors the reference feed already carried, still there (none new), refuse with 409 BASELINE_ERRORS { errors, rules, preexisting } until `acknowledge.baseline_errors` names who accepts them (2026-10-05); the errors the working copy carried before the plan that the loaded feed's baseline did not (an edit by hand, never gated) refuse with 409 CURRENT_ERRORS { errors, rules, preexisting } until `acknowledge.current_errors` names who accepts them, so the record never calls them the reference feed's. A refused preview stays committable once acknowledged, fixed or validated. The changeset, the edit-log entry and the acknowledgement record are written in ONE transaction; the edit's description names who acknowledged what; the commit's DeliveryProof (verdict, validator record, every open item with who accepted it — the review report or the decision by hand among them) is written next to the working copy and answered as `proof` — a version frozen from the copy carries it."
      security:
        - SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - previewId
              properties:
                previewId:
                  type: string
                  pattern: "^[a-f0-9]{18}$"
                acknowledge:
                  $ref: "#/components/schemas/AcknowledgeRequest"
      responses:
        "200":
          description: Applied as one undoable edit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  editId:
                    type: integer
                  description:
                    type: string
                    description: "The plan's title, then `acknowledged by NAME: clauses c3 (fail), hop (unknown); sources op2 (pdf); assumptions a1` when anything was acknowledged."
                  tables:
                    type: array
                    items:
                      type: string
                  validation:
                    type: object
                    description: "Always the validator's verified answer: the commit never succeeds without one."
                    properties:
                      status:
                        type: string
                        enum: [passed]
                      engine:
                        type: string
                        nullable: true
                        description: "mobilitydata-canonical; stub-no-jar under the unit tests only (NODE_ENV=test without the JAR)."
                      before:
                        type: object
                        nullable: true
                        additionalProperties: true
                        description: "{ errors, warnings, infos } of the feed as it was."
                      after:
                        type: object
                        nullable: true
                        additionalProperties: true
                        description: "{ errors, warnings, infos } of the feed as delivered."
                      new_errors:
                        type: array
                        description: Always empty on a success.
                        items:
                          type: object
                  acknowledgement:
                    $ref: "#/components/schemas/AcknowledgementRecord"
                  proof:
                    type: object
                    additionalProperties: true
                    description: "The commit's DeliveryProof { id, scope: commit, at, edit_id, verdict, validator: { engine, version, errors, warnings, rules }, acknowledgements, open_items: [{ kind, id, …, accepted_by: { name } | null, accepted_at, basis }] } — names only, never an account id nor an e-mail."
        "400":
          description: "INVALID_INPUT (previewId missing, or a malformed acknowledge), ACKNOWLEDGEMENT_UNNAMED { required: [by.name] }."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: PREVIEW_NOT_FOUND.
        "409":
          description: "Refused by the gate, nothing written: PLAN_BLOCKED { steps } | PREVIEW_STALE | INTEGRITY_FAILED { integrity } | CLAUSES_FAILING / CLAUSES_UNKNOWN { clauses: [GateClause], unacknowledged: [ids] } | SOURCES_UNVERIFIED { operations: [{ id, reason }] } | CHANGES_NOT_ASKED { changes, error? } (lines changed on dates, rows of a table written, that no clause of the plan asks for, accepted by name: acknowledge.changes) | DIRECT_REPORT_UNACCEPTED { report } (a direct-mode preview: the review report accepted by name, acknowledge.direct) | VALIDATION_NEW_ERRORS { new_errors: [{ code, before, after }], preexisting } (no override) | BASELINE_ERRORS { errors, rules, preexisting } (the reference feed's own errors, accepted by name: acknowledge.baseline_errors) | CURRENT_ERRORS { errors, rules, preexisting } (errors present before the plan that the reference feed did not carry, accepted by name: acknowledge.current_errors) | SESSION_NOT_IN_EDIT_MODE."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [error, message]
                properties:
                  error:
                    type: string
                    enum: [PLAN_BLOCKED, PREVIEW_STALE, INTEGRITY_FAILED, CLAUSES_FAILING, CLAUSES_UNKNOWN, SOURCES_UNVERIFIED, CHANGES_NOT_ASKED, DIRECT_REPORT_UNACCEPTED, VALIDATION_NEW_ERRORS, BASELINE_ERRORS, CURRENT_ERRORS, SESSION_NOT_IN_EDIT_MODE]
                  message:
                    type: string
        "503":
          $ref: "#/components/responses/ValidatorUnavailable"
  /gtfs/transform/direct:
    post:
      tags:
        - Transform
      summary: "The Change Studio's direct mode, a brief draft's workflow (SSE, gated like the chat: the studio entitlement, the assistant's gate, the trial's free messages, the AI limiter and the turn's ceiling AI_TURN_MAX_WEIGHTED_TOKENS). A fixed workflow held by the server (services/direct): an agent (DIRECT_AGENT_MODEL) changes a working copy of the session's feed in SQL — each write run as the engine's sql operation over every write so far, its answer the engine's diff or refusal —; the engine states the facts (semantic diff, rows per table with examples, the canonical validator's new errors); a reviewer on another model (DIRECT_REVIEWER_MODEL, default claude-sonnet-5-5), reading ONLY the brief, the text of its documents and the facts — never the agent's messages or account —, measures each demand on the feed after (read-only SQL before and after, the judge's clause kinds) and reports; demands not done, changes not asked, a new validator error or a broken integrity send the agent back with the findings, twice at most. The result is a preview the person delivers through POST /gtfs/transform/commit with acknowledge { by: { name }, direct: true }."
      description: |-
        Events: `meta` { mode: "direct", models: { agent, reviewer }, trial, allowance: { hourly, daily, global: { used, limit } } }, `step` { kind: reading | querying | writing | measuring | reviewing | correcting, by: agent | reviewer, purpose?, intent?, clause?, document?, documents?, feed?: before | after, round?, findings? } (what is happening, for the wait screen: never the models' words nor a tool's answer), `question` (the agent's one question: { question, options: [2–4], why? } — the turn stops; send the same brief and documents again with `answer` to resume it, its writes kept), `report` (after each review: { round, previewId, report: DirectReport, facts: DirectFacts, validation }), `retry` (a round's stream was cut and is sent again), `usage` ({ agent: { rounds, input_tokens, output_tokens }, reviewer: { … }, budget: { weighted, max }, durationMs }), `error`, then `done` { reason: complete | incomplete | asked | aborted | error, incomplete?: rounds | budget | errors | refusal | max_tokens, previewId (null when nothing changed), deliverable (the preview's gate can commit — no new validator error, no broken integrity — and the review concluded: report.complete), report, facts, validation, account: { demands: [{ quote, account }], doubts, text? } (the agent's own account, for the person: the reviewer never reads it), corrections: { rounds, max: 2 }, question? }. The models' words are not streamed.

        DirectReport: { demands: [{ quote: the brief's words, status: done | not_done | unproven, evidence: one sentence, where: { line?, date?, stop? } }], not_asked: [{ what, why }], complete: false when the reviewer ended without reporting even when asked for it once more (stop: the reason), model }. A change whose report is not complete is not delivered (409 REVIEW_INCOMPLETE at the commit): POST /gtfs/transform/direct/review runs the review again on its own. DirectFacts: { preview_id, diff: [semantic diff lines], diff_more, tables: [{ table, added, removed, changed, examples: { added: [row key], removed: [row key], changed: [{ row, columns: { column: [before, after] } }] } }], integrity: [{ code, count }], validator: { status: passed | new_errors | not_run | unavailable | error, new_errors: [{ code, before, after }], errors_after?, error? } } — deterministic, stated without a model.
      security:
        - SessionId: []
        - SessionId: []
          SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brief
              properties:
                brief:
                  type: string
                documentIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                  description: "The brief's documents (POST /gtfs/network/documents): the agent reads them (a spreadsheet's grids by read_grid), the reviewer their text."
                answer:
                  description: "The person's answer to the agent's `question`: a text, or { question, text }. With the same brief and documents within 30 minutes the held turn resumes; otherwise the turn starts again with the answer said."
                  oneOf:
                    - type: string
                    - type: object
                      properties:
                        question:
                          type: string
                        text:
                          type: string
                language:
                  type: string
      responses:
        "200":
          description: Server-sent events.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/EntitlementRequired"
  /gtfs/transform/direct/review:
    post:
      tags:
        - Transform
      summary: "The independent review run again on its own (SSE, gated like POST /gtfs/transform/direct), on a brief draft whose turn ended without a complete review. The brief, its documents and the person's answers are those kept with the draft's report; the facts are stated again from the draft compared with its working copy; the agent is not called. The report replaces the draft's, and the change is deliverable once it is complete."
      description: |-
        The X-Session-ID is the draft's session. Events: `meta` { mode: "review", models: { reviewer }, trial }, `step` { kind: reviewing | querying | measuring, by: reviewer, … }, `report` { round: 0, previewId, report: DirectReport, facts: DirectFacts, validation }, `retry`, `usage` { reviewer: { rounds, input_tokens, output_tokens, … }, budget, durationMs }, `error` (a refusal: NO_REVIEW_TO_RUN when the draft keeps no brief, changed since its turn or differs from nothing; the AI limiter's codes), then `done` { reason: complete | aborted | error, previewId (the draft compared with its working copy), deliverable, report, facts, validation }.
      security:
        - SessionId: []
        - SessionId: []
          SessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
      responses:
        "200":
          description: Server-sent events.
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/EntitlementRequired"
        "409":
          description: NO_REVIEW_TO_RUN — the session is no brief draft, or its draft keeps no brief to review.
  /gtfs/network/coherence:
    get:
      tags:
        - Network
      summary: "The coherence report of the session's feed (target design §6.2, D11): one row per line × direction × day type — first and last departure, headway at the trunk in the peak (07–09, 16–19) and off-peak (09–16, 19–end) windows, departures, the patterns used, running time — measured on the day type's representative date (the most common timetable among its dates), and the anomalies first (no_service_vs_clause, school_pattern_in_holidays, headway_one_direction, uncovered_dates, stop_without_coords, calendar_without_day). Day types come from calendar.txt and calendar_dates.txt and the school calendar the server knows (a French network: its public holidays computed, its school holidays from the territory dossier, else OpenHolidays — SCHOOL_HOLIDAYS_FETCH_ENABLED=false keeps the server offline); outside France, or without the school calendar, weekdays are one `weekday` and `school_calendar.status` says why. Read only, paginated by line, computed once per state of the feed, cancelled when the client leaves."
      security:
        - SessionId: []
      parameters:
        - name: offset
          in: query
          required: false
          description: The first line of the page (lines sorted by route_sort_order, then name).
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Lines per page (default 200, at most 500). The anomalies come whole with every page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: region
          in: query
          required: false
          description: "The school zone (France: A, B or C, a région or an académie). Without it: the one the feed's own calendars follow (region_source: inferred), else the holidays common to every zone (region_source: common)."
          schema:
            type: string
            example: C
        - name: clauses
          in: query
          required: false
          description: "The clauses as a JSON array (at most 240: 409 TOO_MANY_CLAUSES beyond, never a silent cut): the kinds days, headway_max and span are cross-checked by the anomalies no_service_vs_clause and headway_one_direction; waived ones are ignored. Without the parameter, or with an empty array (`[]`), no clause is cross-checked. A long list outgrows a URL (a request line past 16 KB is refused 431, about fifty clauses): send it in the body of the POST form of this path. The report never judges a clause (the verdict is the conformance engine's)."
          schema:
            type: string
            example: '[{"id":"c2","kind":"days","params":{"line":"A","days":["sun"]}}]'
      responses:
        "200":
          description: The report (CoherenceReport, mode `single`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoherenceReport"
        "400":
          description: INVALID_SESSION.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: SESSION_NOT_FOUND (the working copy expired or was never opened here).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "TOO_MANY_CLAUSES { max: 240, count }: more clauses than the bound were sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Network
      summary: "The same report as GET /gtfs/network/coherence, the clauses in a JSON body: a long list (a specification read from offer sheets states some thirty clauses a line) outgrows a URL — a request line past 16 KB is refused 431, about fifty clauses — so the body carries them, every one, up to the contract's bound of 240 (409 TOO_MANY_CLAUSES beyond, never a silent cut). The query's other parameters (offset, limit, region) are read as for the GET; the body's clauses win over a `clauses` query parameter. The same report, the same cache, the same refusals."
      security:
        - SessionId: []
      parameters:
        - name: offset
          in: query
          required: false
          description: The first line of the page (lines sorted by route_sort_order, then name).
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
