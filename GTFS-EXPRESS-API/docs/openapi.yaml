  /gtfs/network/{buildId}/export.zip:
    get:
      tags:
        - Network Studio
      summary: "Download a network built here as a GTFS ZIP, WITHOUT edit mode (D8): the build was validated by the server and touched nothing that existed, so the licence (which gates the retouching of a network) has nothing to gate. The session header names the working copy (the session id never travels in a URL); `buildId` is the build's public handle (POST /network/compile answers it). The same export gate as every exit runs first, through validatorGate: 503 VALIDATOR_UNAVAILABLE / VALIDATOR_FAILED when the validator does not verify the feed now, 422 VALIDATION_ERRORS / VALIDATION_NEW_ERRORS when it carries an error — nothing is streamed before it answers. A working copy edited since the build is refused (409 BUILD_EDITED): a retouched network is delivered from edit mode (GET /edit/export). The file is named `<network>_v<N>_<date>.zip` (D28), N being the project's version the build is (`version`, v1 when absent)."
      security:
        - SessionId: []
      parameters:
        - name: buildId
          in: path
          required: true
          description: The build's public handle (16 hex characters), from the build's answer (`buildId`) or its report (`build_id`).
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: "The project's version this build is (the N of vN: a create project builds v1, then v2…), written in the file name `<network>_v<N>_<date>.zip`; 1 when absent. An integer from 1 to 9999, else 400 INVALID_INPUT."
          schema:
            type: integer
            minimum: 1
            maximum: 9999
        - name: lineEnding
          in: query
          required: false
          description: "`crlf` for RFC 4180 / Excel consumers; anything else is LF (advisory, never a 400)."
          schema:
            type: string
      responses:
        "200":
          description: GTFS ZIP archive (application/zip), the feed as built.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: "Bad or missing session id; INVALID_INPUT — `version` is not an integer from 1 to 9999."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: "NO_REPORT — the session holds no network built with this id (not built here, or another build); also a session without a feed."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          description: "BUILD_EDITED — the working copy was edited since the build: deliver it from edit mode (the export preflight)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: "VALIDATION_ERRORS { errors, warnings, by_rule } / VALIDATION_NEW_ERRORS { new_errors, preexisting }, with errorCount, warningCount, infoCount and the report: the feed carries an error now."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: "VALIDATOR_UNAVAILABLE { reason } / VALIDATOR_FAILED { validator_error }: the validator did not verify the feed; nothing is streamed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
