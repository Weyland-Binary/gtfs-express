  /gtfs/share:
    post:
      tags:
        - Share
      summary: "Create a public read-only share of the loaded feed: a snapshot behind a token, with its card (counts, validation, Diagnostic, network report). A DELIVERY: the snapshot (the edited state when an edit database exists) goes through the canonical validator before the share exists — 503 VALIDATOR_UNAVAILABLE / VALIDATOR_FAILED when it cannot answer, 409 VALIDATION_NEW_ERRORS { new_errors, preexisting } on errors above the session's baseline (409 VALIDATION_ERRORS { errors, warnings, by_rule } on any error when the session has no baseline); on a refusal the share folder is removed, nothing is published. A draft's session id is refused 409 DRAFT_NOT_APPLIED (a draft leaves only applied on its working copy). The validator run costs seconds on big feeds: queued behind the compute gate (429 BUSY with Retry-After beyond it)."
      security:
        - SessionId: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
                include_names:
                  type: boolean
                  default: false
                  description: "« Inclure les acceptations nominatives » (D39): keep the names (and notes) of the acknowledgements the shared state stands on. Default false: the records are anonymised when the share is created."
      responses:
        "201":
          description: "{ token, secret, expiresAt, card }. `card.acknowledgements` lists the named acknowledgements the shared state stands on (the working copy's `_acknowledgements`): { id, at, scope, clauses, items } — with `by` and `note` only when `include_names` was true (`card.includes_names`, D39). `card.validation` is the report of THIS snapshot, never a stored report of an older state: { errors, warnings, infos, valid, engine, preexisting_errors (what the baseline already carried), new_errors: [] }."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ValidationRefused"
        "429":
          description: "BUSY — the compute gate is full (the validator run is queued like the demand and project work); `Retry-After` says when to try again."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          $ref: "#/components/responses/ValidatorUnavailable"
  /gtfs/share/{token}:
    get:
      tags:
        - Share
      summary: "The card of a share: title, counts, validation of the shared snapshot itself ({ errors, warnings, infos, valid, engine, preexisting_errors: what the baseline already carried, new_errors: [] }), Diagnostic, sources, versions; `acknowledgements` and `includes_names` (D39)."
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/share/{token}/open:
    post:
      tags:
        - Share
      summary: "Open a share: a fresh session built from the snapshot (the visitor's own copy). Its verified report is the new session's modification baseline."
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          $ref: "#/components/responses/OkJson"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/BadRequest"
  /gtfs/share/{token}/versions:
    post:
      tags:
        - Share
      summary: "Publish the session's current feed as a new version of a share (X-Share-Secret): the link and the zip serve the latest, with a changelog (counts, routes and stops added or removed). The same delivery gate as POST /gtfs/share: the new snapshot goes through the canonical validator before it replaces the current one (503 VALIDATOR_UNAVAILABLE / VALIDATOR_FAILED, 409 VALIDATION_NEW_ERRORS above the session's baseline, 409 VALIDATION_ERRORS without one); on a refusal the staging folder is removed and the share is unchanged; a draft's session id is refused 409 DRAFT_NOT_APPLIED. 429 BUSY behind the compute gate."
      security:
        - SessionId: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                include_names:
                  type: boolean
                  default: false
                  description: "As for POST /gtfs/share: the acknowledgements' names travel with this version only when true (D39)."
      responses:
        "201":
          description: "{ token, version: { n, createdAt, counts, validation, design, note, changelog }, card }: `validation` is the report of the published snapshot ({ errors, warnings, infos, valid, engine, preexisting_errors, new_errors: [] })."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: SHARE_FORBIDDEN — the share secret does not match.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "TOO_MANY_VERSIONS, DRAFT_NOT_APPLIED (a draft's session id), or the gate's VALIDATION_NEW_ERRORS { new_errors, preexisting } / VALIDATION_ERRORS { errors, warnings, by_rule } (no override; nothing published)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "429":
          description: "BUSY — the compute gate is full; `Retry-After` says when to try again."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          $ref: "#/components/responses/ValidatorUnavailable"
  /gtfs/documents/timetable:
    get:
      tags:
        - Documents
      summary: "A line's timetable as print-ready HTML (matrix or hour/minutes grid), for a date."
      security:
        - SessionId: []
      parameters:
        - name: route_id
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: text/html
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/documents/sheets/setup:
    get:
      tags:
        - Documents
      summary: "What the stop sheets can be printed for: the stops with departures (and the stations over them), each with its lines; the lines with their stops in order; the feed's validity; the timetable periods from today (where the network's timetable changes for good, a one-off date being a note, not a period) with the first as the default period; the school calendar that splits the weekdays; the agency; whether the session is a draft (POST /gtfs/documents/sheets/changes then lists the sheets it changes) and the watermark the sheets carry under the paid offer: null with a licence that delivers, `trial` during the trial, `preview` without a licence (reading the sheets is free; printing them is the licence's, the web opening the offer instead). Read only."
      security:
        - SessionId: []
      parameters:
        - name: region
          in: query
          required: false
          description: "The school zone (France: A, B or C, a région or an académie). Without it: the one the feed's own calendars follow, else the holidays common to every zone."
          schema:
            type: string
      responses:
        "200":
          description: "{ range, periods: [{ from, to }], period, today, school: { status, region, region_source, covered_until, periods }, agency: { name, url, phone }, draft, watermark, stops: [{ id, name, code, station, parent, lines }], routes: [{ id, short, long, color, text, sort, directions: [{ direction_id, headsign, terminus, stops }] }] }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/documents/sheets:
    post:
      tags:
        - Documents
      summary: "The stop sheets of a batch of stops over a period, as data the client lays out and prints. Per stop, one block per line and direction: the usual terminus and headsign, one column per day type (school weekdays, holiday weekdays, Saturday, Sunday and public holidays; columns with the same departures merged; the weekdays one column without a school calendar), the departures by hour (times keep the service day's order, printed on the clock), the notes the calendars imply (a departure not running on every date of its column, ending short of the usual terminus, on booking or on request: a mark and its text, in the sheet's language), the dates of a column without service, the day types without service, and the next stops of the direction's most common pattern with their running time and the other lines met there. A call where boarding is not allowed (pickup_type 1, a trip's last call) is not a departure. What to check before printing comes with each sheet: no departure, the same departure twice, calls without a time. A stop's poster (no route_id) carries the area around it for its map (area: the place marked, the places within 1 km and the lines calling there, each cut to them and carried one place beyond, with its real ends)."
      security:
        - SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stop_ids]
              properties:
                stop_ids:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                from:
                  type: string
                  description: YYYY-MM-DD; without it, today (or the feed's first date).
                to:
                  type: string
                  description: YYYY-MM-DD; without it, a year later at most. The period stays inside the feed's validity (clamped) and within 400 days (capped).
                lang:
                  type: string
                  description: The sheet's language (en, fr, es, de, pt, zh, hi), apart from the screen's.
                region:
                  type: string
                  description: The school zone, as for the setup.
                route_id:
                  type: string
                  description: That line alone on the sheets (a stop's other lines left out).
      responses:
        "200":
          description: "{ period: { from, to, clamped, capped }, school, undated, lang, labels, watermark (null | trial | preview, as for the setup), sheets: [{ stop, blocks: [{ route, direction_id, headsign, columns, notes, path, summary, … }], warnings }], unknown }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: TOO_MANY_STOPS, more than 200 stops in one request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: NO_SERVICE_DATES, the feed has no service dates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /gtfs/documents/sheets/plan:
    post:
      tags:
        - Documents
      summary: "A line's plan over a period, as data the client lays out and prints: the whole line once for both directions. Its trunk (the longest busy pattern of the first direction) with each stop's running time from the first terminus, the other lines met at its place (a station's quays, the stops of one name within 400 m, the line's opposite platforms within 40 m), whether it is a hub (three other lines, or a rail, metro or tram line), whether one direction alone serves it, whether some journeys end there; the runs off the trunk (the stops one direction alone serves, a detour some journeys take with the days they run, a spur served out and back) with their level when spans overlap; whether the line is circular; the facts of its busiest weekday (how often, from when to when, how long end to end) in the sheet's language. Only journeys running over the period count."
      security:
        - SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route_id]
              properties:
                route_id:
                  type: string
                from:
                  type: string
                  description: YYYY-MM-DD, as for the sheets.
                to:
                  type: string
                  description: YYYY-MM-DD, as for the sheets.
                lang:
                  type: string
                  description: The plan's language (en, fr, es, de, pt, zh, hi), apart from the screen's.
      responses:
        "200":
          description: "{ period, lang, labels, watermark (as for the setup), plan: { route, directions, circular, trunk: [{ stop_id, name, code, lat, lon, links, hub, min, partial, terminus, one_way }], runs: [{ from, to, spur, main, one_way, label, dashed, level, stops }], levels, facts, date, outOfPeriod } }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: LINE_NOT_FOUND, no line with journeys has this id (or the session is unknown).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: NO_SERVICE_DATES, the feed has no service dates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /gtfs/documents/sheets/network:
    post:
      tags:
        - Documents
      summary: "The network as its map draws it over the period, as data the client lays on a basemap and prints: every line once as the places it calls at in order (its plan's trunk, and the other direction's own way where it differs), how often it runs between 9:00 and 16:00 on its busiest weekday (tier frequent: every 15 minutes or less with 30 departures a direction at least; regular: every 30 or less with 14 at least; occasional otherwise), the places with their position (the mean of their stops), their name, the lines met there and whether a line ends there, and the segments between two places with the lines along them and, when the feed has the shape the first line's journeys follow, its points between the two places. Only journeys running over the period count."
      security:
        - SessionId: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
                lang:
                  type: string
                  description: The map's language (en, fr, es, de, pt, zh, hi), apart from the screen's.
      responses:
        "200":
          description: "{ period, lang, labels, watermark, network: { routes: [{ id, short, long, color, text, sort, mode, headway, trips, tier, path, ways, ends, circular }], places: [{ id, name, lat, lon, lines, terminus }], segments: [{ a, b, lines, pts: [[lat, lon]] | null }] } }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: NO_SERVICE_DATES, the feed has no service dates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /gtfs/documents/sheets/changes:
    post:
      tags:
        - Documents
      summary: "On a draft's session, the stops whose sheet the draft changes over the period, compared with the working copy it was made from: the departures added and removed (a moved time is one of each) and the lines concerned; and the lines whose plan it changes (their stops, the lines met there, their runs or facts), so the sheets and plans to post again are known before the change is applied. Outside a draft: { draft: false, changed: [], plans: [] }."
      security:
        - SessionId: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
      responses:
        "200":
          description: "{ draft, period, changed: [{ stop_id, added, removed, lines }], plans: [{ route_id, short }] }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/documents/sheets/notices:
    post:
      tags:
        - Documents
      summary: "On a draft's session, the notice each place it changes calls for over the period, compared with the working copy, in the notice's language: from the first date the departures there differ (and until when, when the line runs as before again on the same days within the period), line by line what changes: no longer calling (with the nearest place the line still calls at within 1500 m, the walk there and the lines still calling, and a small map: the line's paths and stops near both places, those it no longer calls at), calling there now, fewer or more departures between 9:00 and 16:00 (with both days' departures), an earlier or later first or last departure, other times changed (added and removed); a stop moved over 25 m or renamed. The days a change concerns are said when they are not all the days the line runs; the same change both ways is said once. Outside a draft: { draft: false, notices: [] }."
      security:
        - SessionId: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
                lang:
                  type: string
                  description: The notices' language (en, fr, es, de, pt, zh, hi), apart from the screen's.
      responses:
        "200":
          description: "{ draft, period, lang, labels, watermark, notices: [{ place, stop_id, name, code, lat, lon, effective, until, header, items: [{ kind: not_served | now_served | headway | first | last | times | moved | renamed, route, effective, until, days, towards, … }] }] }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/documents/sheets/calendar:
    get:
      tags:
        - Documents
      summary: "The day classes a period of the network shows, read from its calendars alone (the working days, the blocks of dates run with another timetable, the rest days with the public holidays run like them), each with the name it carries, and the names kept with the working copy: the periods and public holidays the person confirmed or the model proposed (source user, ai, official; confirmed or not). A sheet prints a name only once it is confirmed. Read only."
      security:
        - SessionId: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
        - in: query
          name: to
          schema:
            type: string
        - in: query
          name: lang
          schema:
            type: string
        - in: query
          name: region
          schema:
            type: string
      responses:
        "200":
          description: "{ period, lang, school, classes: [{ id, kind, dows, ranges, dates, name, holidays, label }], updatedAt, periods: [{ from, to, name, kind, source, confirmed }], holidays: [{ date, name, source, confirmed }] }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "NO_SERVICE_DATES"
    put:
      tags:
        - Documents
      summary: "The calendar's names as the person leaves them: every period and public holiday with its name, kind (school or other) and whether it is confirmed; the whole list replaces the one kept (an entry left out is forgotten). Answers as GET, for the period given."
      security:
        - SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                periods:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                holidays:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                from:
                  type: string
                to:
                  type: string
                lang:
                  type: string
      responses:
        "200":
          description: "As GET /gtfs/documents/sheets/calendar."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/documents/sheets/calendar/suggest:
    post:
      tags:
        - Documents
      summary: "The model names what the network shows over the period: the blocks of weekdays run with another timetable (a school holiday, a summer timetable) and the weekdays run like a Sunday (public holidays), in the sheet's language, with a confidence; it never adds, moves or merges a date, and a proposal on a date the network does not show is dropped. The proposals wait in the calendar unconfirmed, beside the dates they name, until the person confirms them. Behind the licence or the trial (402 SUBSCRIPTION_REQUIRED, 401 NOT_SIGNED_IN), on the account's AI envelope (AI_ALLOWANCE_EXHAUSTED), counted as the sheets feature."
      security:
        - SessionId: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
                lang:
                  type: string
                region:
                  type: string
      responses:
        "200":
          description: "As GET /gtfs/documents/sheets/calendar, plus proposed: { periods, holidays } (the counts the model named)."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: "SUBSCRIPTION_REQUIRED"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: "RATE_LIMITED or AI_ALLOWANCE_EXHAUSTED"
        "503":
          description: "AI_UNAVAILABLE, BUDGET_EXHAUSTED or AI_BUDGET_EXHAUSTED (the server's AI spend for the UTC day, retryAfterSec until midnight UTC)"
  /gtfs/realtime/validate:
    post:
      tags:
        - Realtime
      summary: "Check a GTFS-Realtime feed (protobuf body, { feed } JSON, or { url }) against the loaded static feed: unknown trips/stops/routes, sequence and time order, absurd delays, vehicles outside the network, stale timestamps, alerts pointing nowhere."
      security:
        - SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
  /gtfs/share/{token}/gtfs.zip:
    get:
      tags:
        - Share
      summary: The shared feed as a GTFS zip (a stable URL).
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: application/zip
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/network/documents:
    post:
      tags:
        - Network
      summary: "Upload a document of a brief for the direct mode (PDF read natively by the model, and its text layer read at ingestion, a scan without one read by OCR there (tesseract.js, French and English; the document answers text_ocr and ocr_pages) — deterministically, the parser in a child process — and stored with the document: `text_chars` in the answer, 0 for a scan without a text layer; the quote checks (G2) read it; Word .docx and OpenDocument .odt reduced to text; spreadsheets .xlsx, .xlsm, .xls, .ods reduced to one text table per sheet; text, Markdown, CSV, JSON). Kept two hours; a direct-mode turn references it by id. With ACCOUNTS_ENABLED the `studio` entitlement is required (401 NOT_SIGNED_IN / 403 ENTITLEMENT_REQUIRED)."
      security:
        - {}
        - SessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/EntitlementRequired"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
  /gtfs/network/documents/{id}:
    delete:
      tags:
        - Network
      summary: "Forget an uploaded specification document. A document a workspace project keeps is forgotten only by a caller reaching that project (its account or browser token, or a working copy bound to it): anyone else gets 404 DOCUMENT_NOT_FOUND."
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: "DOCUMENT_NOT_FOUND — a project keeps this document and the caller does not reach it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /gtfs/network/catalog:
    get:
      tags:
        - Network
      summary: "The public GTFS feeds serving a territory, most relevant first. France: the National Access Point (transport.data.gouv.fr) matched through the official geography (commune, EPCI, département, région) — local network, département, région, neighbours, national operators with stops at the place — with each feed's validity, size and page; then the Mobility Database entries it does not already publish. Elsewhere: the Mobility Database. `sources` says which answered."
      security: []
      parameters:
        - name: place
          in: query
          required: true
          schema:
            type: string
        - name: light
          in: query
          required: false
          description: "Accepted for compatibility: the place is always resolved by the geocoder alone (Nominatim). The answer has `light: true`."
          schema:
            type: string
            enum: ["1", "true"]
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: PLACE_NOT_FOUND — the geocoder knows no such place (light mode).
  /gtfs/network/catalog/open:
    post:
      tags:
        - Network
      summary: "Open a public GTFS feed in the application as it is: downloaded (public internet only, 50 MB like an upload), extracted, validated and migrated like an uploaded file into a new session. Every trip, variant, calendar exception and shape is kept, ready for the Change Studio. Its verified report is the session's modification baseline (see Delivery guarantees). Rate-limited like uploads."
      parameters:
        - $ref: "#/components/parameters/ImportProgress"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: The GTFS zip (http or https; public internet only).
                name:
                  type: string
                  description: The network's name, kept as the session's source name.
                place:
                  type: string
                  description: A territory already loaded (its country sets the validator's national rules).
      responses:
        "201":
          $ref: "#/components/responses/OkJson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The feed is larger than the upload limit.
        "422":
          description: The URL does not return a GTFS zip.
  /gtfs/transform/demand:
    post:
      tags:
        - Transform
      summary: "The ridership ESTIMATE of the loaded feed (boardings per line and stop, peak load vs capacity, annual boardings, calibration status and uncertainty) and its KPIs — or, with `previewId`, of the feed a previewed change plan would produce (a scenario, on the same demand, so the two compare). With a place, the territory's residents and places; without, the area the feed's stops cover (official data where available), else a stop-based population proxy, flagged as such."
      security:
        - SessionId: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                costs:
                  $ref: "#/components/schemas/DemandCosts"
                previewId:
                  type: string
                  pattern: "^[a-f0-9]{18}$"
                  description: A preview of this session (POST /gtfs/transform/preview) to estimate as a scenario.
      responses:
        "200":
          description: "{ estimate, kpis, inputs, warnings, basis: feed | scenario, previewId? }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimate:
                    $ref: "#/components/schemas/DemandEstimate"
                  kpis:
                    $ref: "#/components/schemas/DemandKpis"
                  inputs:
                    type: object
                  basis:
                    type: string
                    enum: [feed, scenario]
                  previewId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: "No feed loaded for the session, or (PREVIEW_NOT_FOUND) the preview expired or belongs to another session."
        "409":
          description: "PREVIEW_STALE: the feed changed since the preview; preview the plan again."
  /gtfs/transform/operations:
    get:
      tags:
        - Transform
      summary: "The catalogue of transformation operations: type, title, category, parameters (name, type, required, description), requires_one_of and examples. requires_one_of (always an array) lists the groups of parameters that stand in for each other — [[\"route\", \"routes\"]] for adjust_running_times and set_dwell, [[\"end_date\", \"start_date\"]] for extend_validity, [[\"direction\", \"pattern\"], [\"days\", \"dates\"]] for add_trips, [[\"days\", \"dates\"]] for set_span: one parameter of each group is needed, none of them is marked required on its own, and an operation given none of a group asks its usual question (which line, until when, which direction, which days). With ?lang= (fr, en…) the titles, descriptions and parameter labels are in that language. One bound rule for every operation: a time window from–to (set_headway, a create_route service period, an add_trips series, a trip selection, running-time bands) holds the departures at or after `from` and before `to` (`to` excluded: the next band starts there; a window ending on its own grid names the departure it leaves out), and a date range (from_date–to_date, a named calendar's from–to, end_date) includes both of its dates. The scope parameters include `holiday_weekdays` (weekday | network): the Monday–Friday dates on which the network runs its Saturday timetable (school holidays on some networks), asked by set_headway, add_trips, remove_trips, shift_trips, set_span and create_route when their weekday change meets them (the other operations never ask). set_headway covers its window from `from` on the grid of the line's first departure (`start: keep_first` keeps that departure as the first) and reads the window at `at_stop` when given (a headway_max clause measures a feed at each direction's trunk stop, named in `measured` when the trips start elsewhere); extend_validity asks `repeat` (before | last_week) when the feed's last week runs another timetable than the weeks before. build_timetable (mission step 6) builds exactly the trips an offer order states for one line, one direction and one day type — first, last and bands [{ from, to, headway_min }] (each departure the previous one plus its band's headway, a more frequent band starting at its start, the last always a departure), `times`, or a full `timetable` { stops, trips: [[HH:MM | null | \"pass\"]], numbers? } (null: no time given, placed by the running times; \"pass\": a stop the trip does not serve, never given a time) — on the existing stop patterns, in place of the direction's trips on the scope's dates, and asks what the order does not say: `pattern` when the direction runs several, `running_times` (existing: the pattern's trip nearest in time; not asked when a timetable gives every stop), `new_dates` (add | skip) for dates the direction runs nothing on, `others` (replace | keep) for the direction's other patterns, `gaps` (band_start) for a departure no band holds, `pass_stops` (serve) when every pattern holding a timetable trip calls at a stop it marks \"pass\". A band whose headway is null has no departure: a departure that would fall in it is not run (the next one is the start of the next band with a headway, or the last departure)."
      security: []
      parameters:
        - name: lang
          in: query
          required: false
          description: "The reader's language (fr, en, fr-FR…): titles, descriptions and parameter labels in it; without it, the English a model reads."
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
  /gtfs/transform/overview:
    get:
      tags:
        - Transform
      summary: "The feed as the transformation engine reads it: counts, validity range, a representative date per weekday, and each route with its patterns, termini and service per day type (trips, first/last departures, headways by period, running time, vehicles at peak)."
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/OkJson"
  /gtfs/transform/preview/{id}/alerts:
    get:
      tags:
        - Transform
      summary: "What riders must be told about a previewed plan, from what it really changes: GTFS-Realtime service alerts (one per line and period; lines changed the same way share one; effect NO_SERVICE, DETOUR, STOP_MOVED, REDUCED_SERVICE, ADDITIONAL_SERVICE, MODIFIED_SERVICE or OTHER_EFFECT; active period in the agency's timezone; lines and stops concerned) and a notice to post, in French or English. format=json (the structured alerts, the FeedMessage in the protobuf JSON mapping, the notice), pb (the FeedMessage as application/x-protobuf) or txt (the notice)."
      security:
        - SessionId: []
      parameters:
        - name: id
          in: path
          required: true
