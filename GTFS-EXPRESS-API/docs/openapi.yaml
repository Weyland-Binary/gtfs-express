  /gtfs/network/compile:
    post:
      tags:
        - Network Studio
      summary: "Compile a Network Spec into a new validated session (GTFS built server-side): a DELIVERY, gated before and after the write. Before any write, the brief (`options.requirements`) is measured again on the compiled timetable: a must clause failing or not measurable is refused (409 CLAUSES_FAILING / CLAUSES_UNKNOWN { clauses, unacknowledged }) unless `acknowledge` names the person accepting each of them. After the write, the canonical validator runs on the feed as built: a validator that cannot answer refuses (503 VALIDATOR_UNAVAILABLE / VALIDATOR_FAILED) and a creation carries no error at all (409 VALIDATION_ERRORS { errors, warnings, by_rule }); nothing of a refused build survives (no session, no folder). The validator's answer is asserted inside the ingest, before it writes anything durable: a 503 VALIDATOR_* or 409 VALIDATION_ERRORS refusal leaves no validation baseline, no upload statistic and no `upload` event. The stored report carries `gate` { conformance: Verdict, validation: { status: valid, errors, warnings, engine }, acknowledgement: AcknowledgementRecord | null }. A spec whose `origin.kind` is `simplified_import` (a simplified copy of an existing feed, see POST /network/catalog/import) is refused with 409 SIMPLIFIED_BASELINE unless `acknowledgeSimplification` is true: building it would replace the operator's real timetables. Acknowledged — by a named person since 2026-10-05 (`acknowledge.by.name`, else the signed-in account's name; 400 ACKNOWLEDGEMENT_UNNAMED otherwise) — the acceptance is an item `simplified_baseline` of the build's acknowledgement record and the report records `origin` with `acknowledged: true`. Since the owner's rule of 2026-10-05 a build needs a ready `contract` (decided, assumed, or recorded empty by a named person): 409 CONTRACT_REQUIRED { reason: missing | draft | unnamed, status } otherwise (the dry run does not); an empty contract holds its uncovered requirement sentences like any other (409 REQUIREMENTS_UNCOVERED), and a wish (« à vérifier à la main ») nobody checked by hand is an assumption to accept by name (`contract_<wish id>`). The 201 answer carries `proof`, the build's DeliveryProof (also written next to the session), and `report.gate` gains `validator` (engine, version, errors, warnings, rules) and `proof_id`. School calendars (`period: school_days | school_holidays`) are resolved from the territory's school holidays (options.place), else OpenHolidays, never approximated: the response's `calendars` gives each dated calendar's period, zone, source, holiday periods (the summer break after the end of classes is flagged `assumed`), active days and GTFS form (`week`: weekly flags plus removals; `dates`: additions only). A calendar that cannot be resolved (zone missing, holidays not published that far, provider unavailable) is refused with 400 SPEC_INVALID and its blockers. A road leg over twice the straight distance adds the warning `routing_suspicious`. The build is part of the by-hand journey: no Studio entitlement is required (only the planner is the Studio's). The answer's `buildId` is the build's public handle: GET /network/{buildId}/export.zip downloads the built network without edit mode. With `dry_run: true` nothing is built: the spec is compiled, measured against the brief and validated in a temporary folder that is removed (the Checks step) — 200 { dry_run, validation, verdict, coherence, counts }, errors reported by rule rather than refused, 503 VALIDATOR_* when the validator does not verify it (that refusal still carries `coherence`). `coherence` is the design's coherence report (CoherenceReport, read from the compiled tables; { error } when it could not be read — never a reason to refuse the checks)."
      security:
        - {}
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec:
                  type: object
                  description: The Network Spec; may carry `origin` (NetworkSpecOrigin).
                dry_run:
                  type: boolean
                  description: "Check without building: compile, measure the brief (the engine's verdict) and run the canonical validator on a temporary copy; nothing is kept (no session, no baseline, no statistic, no acknowledgement record). The plan limit (402) and the simplified baseline (409) are refused as for a build."
                options:
                  type: object
                  description: "`routing` (\"straight\"), `shapes` (boolean), `place` (a territory already loaded), `requirements` (the brief's clauses, measured by the gate on the compiled timetable; without them there is no clause gate)."
                acknowledgeSimplification:
                  type: boolean
                  description: "Build a simplified import anyway, accepted by the person `acknowledge.by.name` names (else the signed-in account's name); the report records `origin.acknowledged = true`."
                acknowledge:
                  $ref: "#/components/schemas/AcknowledgeRequest"
                contract:
                  description: "Required for a build (not for a dry run) since 2026-10-05: decided, assumed, or recorded empty by a named person (`decided_by`), else 409 CONTRACT_REQUIRED."
                  allOf:
                    - $ref: "#/components/schemas/Contract"
                brief:
                  type: string
                  description: "The brief's text pasted by the person (the coverage detector reads it with the documents and the text the contract was extracted from)."
                documents:
                  type: array
                  description: The ids of the project's documents whose text the coverage detector reads.
                  items:
                    type: string
      responses:
        "200":
          description: "The dry run (`dry_run: true`): { dry_run: true, validation: { errors, warnings, infos, valid, engine, by_rule }, verdict: Verdict | null (null without requirements), coherence: CoherenceReport | { error }, counts, checked_at, durationMs }. Nothing was built or kept."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [dry_run, validation]
                properties:
                  dry_run:
                    type: boolean
                  validation:
                    type: object
                    additionalProperties: true
                  verdict:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/Verdict"
                  coherence:
                    description: "The design's coherence report (CoherenceReport), or { error } when it could not be read."
                    type: object
                    additionalProperties: true
                  counts:
                    type: object
                    additionalProperties: true
        "201":
          description: "{ sessionId, buildId, validationReport, migration_ms, counts, stats, warnings, issues, geometry, report, proof, durationMs }. `buildId` (16 hex characters, also `report.build_id`) is the build's public handle for GET /network/{buildId}/export.zip. `report.gate` is the delivery record: the engine's verdict (`conformance`, Verdict with the coverage of the brief and the contract's status — `deliverable` is true only when every must clause is met, else the build was delivered under the acknowledgement; an unread document's acknowledgement says `acknowledged: true`, its name stays in the proof), the validation of the feed as written (`validation`), the validator's record (`validator`: engine, version, errors, warnings, rules), who acknowledged what and when (`acknowledgement`, AcknowledgementRecord or null) and the id of the build's proof (`proof_id`). `proof` is the build's DeliveryProof, names included (a version frozen from the session carries it; the package's manifest prints it)."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: "SPEC_INVALID { issues, blockers } (a blocking spec), ACKNOWLEDGEMENT_UNNAMED { required: [by.name] } (an acknowledgement that names nobody), INVALID_INPUT (a malformed acknowledge)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "402":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/EntitlementRequired"
        "409":
          description: "CONTRACT_REQUIRED { reason: missing | draft | unnamed, status } — no ready contract (decided, assumed, or recorded empty by a named person), refused before anything is compiled (2026-10-05); SIMPLIFIED_BASELINE { losses } — the spec is a simplified import and the body does not acknowledge it; CLAUSES_FAILING / CLAUSES_UNKNOWN { clauses: [GateClause], unacknowledged: [ids] } — a must clause of the brief fails (or, none failing, cannot be measured) and `acknowledge.clauses` does not cover it, refused before any write; VALIDATION_ERRORS { errors, warnings, by_rule } — the canonical validator finds errors in the built feed (the session is removed; no upload statistic, no `upload` event); REQUIREMENTS_UNCOVERED { uncovered: [{ id, text, source, page }] } — a requirement sentence of the brief is answered by no clause of the ready `contract` (G5, an empty one included), refused before anything is compiled into a session, no acknowledgement lifts it (the contract answers it: a clause, a wish, a named dismissal); ASSUMPTIONS_UNVALIDATED { assumptions, unacknowledged: [contract_assumed, contract_<id>…] } — the contract is assumed, carries an assumption nobody confirmed, or a wish nobody checked by hand (items { id: contract_<wish id>, kind: wish, quote, text }), and `acknowledge.assumptions` does not name it."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [error, message]
                properties:
                  error:
                    type: string
                    enum: [CONTRACT_REQUIRED, SIMPLIFIED_BASELINE, CLAUSES_FAILING, CLAUSES_UNKNOWN, VALIDATION_ERRORS, REQUIREMENTS_UNCOVERED, ASSUMPTIONS_UNVALIDATED]
                  losses:
                    $ref: "#/components/schemas/NetworkImportLosses"
                  message:
                    type: string
        "503":
          description: "Server at capacity (COMPILE_FAILED), or the canonical validator could not answer: VALIDATOR_UNAVAILABLE { reason } / VALIDATOR_FAILED { validator_error } — the build is refused and removed, never delivered unvalidated (no upload statistic, no `upload` event). On a dry run the refusal also carries `coherence` (the design's coherence report, CoherenceReport | { error }): the report never needs the validator."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
