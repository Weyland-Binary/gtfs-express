  /gtfs/transform/preview/{id}/coherence:
    get:
      tags:
        - Transform
      summary: "The coherence report of a previewed plan, before → after (target design §6.2): the feed as the plan would leave it (its changeset replayed on an in-memory copy, nothing written) against the feed as it is, one row per line × direction × day type × period — the dates where the plan changes the day's trips form periods (a gap over a week opens a new one), the unchanged ones the `rest` (dropped when they are a few outliers); each row carries `before`, the same measures on the same date, and `changed`. Anomalies are those of the feed after the plan, `preexisting` when the feed had them already, plus day_type_touched_out_of_scope when the framing (day_types, from, to: project.context) is given and the plan changes a day type or dates outside it. Computed once per preview and parameters, cancelled when the client leaves."
      security:
        - SessionId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{18}$"
        - name: offset
          in: query
          required: false
          description: The first line of the page (lines sorted by route_sort_order, then name).
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Lines per page (default 200, at most 500). The anomalies come whole with every page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: region
          in: query
          required: false
          description: "The school zone (France: A, B or C, a région or an académie). Without it: the one the feed's own calendars follow (region_source: inferred), else the holidays common to every zone (region_source: common)."
          schema:
            type: string
            example: C
        - name: clauses
          in: query
          required: false
          description: "The clauses as a JSON array (at most 240: 409 TOO_MANY_CLAUSES beyond, never a silent cut): the kinds days, headway_max and span are cross-checked by the anomalies no_service_vs_clause and headway_one_direction; waived ones are ignored. A long list outgrows a URL (a request line past 16 KB is refused 431, about fifty clauses): send it in the body of the POST form of this path. The report never judges a clause (the verdict is the conformance engine's)."
          schema:
            type: string
            example: '[{"id":"c2","kind":"days","params":{"line":"A","days":["sun"]}}]'
        - name: day_types
          in: query
          required: false
          description: "The change's framing: the day types it concerns, comma-separated (school_weekday, holiday_weekday, weekday, saturday, sunday_holiday)."
          schema:
            type: string
            example: school_weekday
        - name: from
          in: query
          required: false
          description: The framing's first date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: The framing's last date (YYYY-MM-DD).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "The report (CoherenceReport, mode `compare`) with `preview_id` and the plan's `title`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoherenceReport"
        "400":
          description: "INVALID_INPUT (a malformed preview id), INVALID_SESSION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "PREVIEW_NOT_FOUND (the preview expired or belongs to another session), SESSION_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "PREVIEW_STALE: the feed changed since the preview — preview the plan again. TOO_MANY_CLAUSES { max: 240, count }: more clauses than the bound were sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Transform
      summary: "The same report as GET /gtfs/transform/preview/{id}/coherence, the clauses in a JSON body: a long list (a specification read from offer sheets states some thirty clauses a line) outgrows a URL — a request line past 16 KB is refused 431, about fifty clauses — so the body carries them, every one, up to the contract's bound of 240 (409 TOO_MANY_CLAUSES beyond, never a silent cut). The query's other parameters (offset, limit, region, the framing) are read as for the GET; the body's clauses win over a `clauses` query parameter. The same report, the same cache, the same refusals."
      security:
        - SessionId: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{18}$"
        - name: offset
          in: query
          required: false
          description: The first line of the page (lines sorted by route_sort_order, then name).
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Lines per page (default 200, at most 500). The anomalies come whole with every page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - $ref: "#/components/parameters/CoherenceRegion"
        - $ref: "#/components/parameters/CoherenceDayTypes"
        - $ref: "#/components/parameters/CoherenceFrom"
        - $ref: "#/components/parameters/CoherenceTo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoherenceClausesBody"
      responses:
        "200":
          description: "The report (CoherenceReport, mode `compare`) with `preview_id` and the plan's `title`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoherenceReport"
        "400":
          description: "INVALID_INPUT (a malformed preview id), INVALID_SESSION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "PREVIEW_NOT_FOUND (the preview expired or belongs to another session), SESSION_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "PREVIEW_STALE: the feed changed since the preview — preview the plan again. TOO_MANY_CLAUSES { max: 240, count }: more clauses than the bound were sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
