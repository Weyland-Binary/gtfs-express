  /gtfs/edit/history:
    get:
      tags:
        - History
      summary: Last 200 edit-log entries (most recent first), each with the named acknowledgement recorded with it.
      description: |-
        Each entry names who made it and why (WP10): `actor` (the account), `actor_name` (the
        account's name, or the one the browser declares in the X-Actor-Name header of the edit,
        URI-encoded) and `reason` (manual · plan · sql). Every request may carry X-Actor-Name; it
        is read only for the edit log, never as an authentication.
        An edit committed under a named acknowledgement (POST /gtfs/transform/commit with
        `acknowledge`) carries its record as `acknowledgement` (`EditAcknowledgement`): who accepted
        what and when (the server's clock), the note, and the one-line `description` the edit log
        already carries (acknowledgement.describe). The other entries carry none, and so does every
        entry of a session database created before the `_acknowledgements` table existed. The audit
        trail is visible from the first delivery that writes it.
        The journal reads in edit mode or not (undo, redo and jump stay edit mode's): a draft's
        retouches are listed beside its plan. `since_edit_id` is the last edit the working copy's
        project version holds (its workspace binding), null without a project: the newer entries
        are the retouches no version holds yet. A working copy never edited answers an empty history.
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/HistoryOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/edit/undo:
    post:
      tags:
        - History
      summary: Undo the most recent edit (SAVEPOINT replay of stored undo ops).
      description: |-
        Optional body `{ expectedEntryId }`: when provided and the newest active (not undone)
        edit-log entry has a different id, nothing is changed and the call answers **409**
        `{ error: "UNDO_TARGET_NOT_LATEST", latestId, expectedEntryId }`. The success body is
        `{ undone: <HistoryEntry incl. id>, currentState }`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedEntryId:
                  type: integer
                  minimum: 1
                  description: Id of the edit-log entry the client expects to undo (e.g. the
                    `undoEntryId` returned by the mutation).
      security:
        - SessionId: []
      responses:
        "200":
          description: Entry undone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  undone:
                    $ref: "#/components/schemas/HistoryEntry"
                  currentState:
                    type: object
                    nullable: true
                    additionalProperties: true
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session not in edit mode (`SESSION_NOT_IN_EDIT_MODE`), or the newest active
            entry is not the one the client expected (`UNDO_TARGET_NOT_LATEST`, with `latestId`
            and `expectedEntryId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /gtfs/edit/redo:
    post:
      tags:
        - History
      summary: Redo the most recently undone edit.
      security:
        - SessionId: []
      responses:
        "200":
