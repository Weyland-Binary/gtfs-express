          type: string
          pattern: "^[a-f0-9]{24}$"
    delete:
      tags:
        - Workspace
      summary: Remove a document from the project.
      description: >-
        400 INVALID_ID for anything but a 24-hexadecimal document id (a decoded "../" included), before
        anything is touched; the file goes only when the project listed the document (404
        DOCUMENT_NOT_FOUND otherwise).
      security:
        - ClientToken: []
        - SessionCookie: []
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
  /gtfs/workspace/attach:
    post:
      tags:
        - Workspace
      summary: "« Rattacher mes travaux à mon compte » (D5, D39): the browser's projects move to the signed-in account (a year's retention), the token is revoked, a new one is handed back."
      security:
        - ClientToken: []
          SessionCookie: []
      parameters:
        - name: X-Client-Token-Previous
          in: header
          required: false
          description: "A token this browser kept aside when the server stopped knowing it (401 CLIENT_TOKEN_REQUIRED after a change of CLIENT_TOKEN_SECRET). When it is live again, its projects move to the account too and it is revoked; `previous` says whether it was."
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
      responses:
        "200":
          description: Moved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved:
                    type: integer
                  token:
                    type: string
                  previous:
                    type: boolean
                    nullable: true
                    description: Whether the X-Client-Token-Previous sent was live (its projects moved); null when none was sent.
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
