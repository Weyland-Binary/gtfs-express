      tags:
        - Export
      summary: Export the session feed as a GTFS ZIP (re-validated at export time).
      security:
        - SessionId: []
      responses:
        "200":
          $ref: "#/components/responses/ZipOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/EditModeRequired"
        "404":
          $ref: "#/components/responses/NotFound"
  /gtfs/edit/export/netex:
    get:
      tags:
        - Export
      summary: >-
        Export the session feed as NeTEx France (converted by the embedded
        gtfs2netexfr binary). Same pre-export validation gate as the GTFS
        export, without the admin force bypass. 503 when the converter is
        not installed on the server.
      security:
        - SessionId: []
      parameters:
        - name: participant
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9_.\\-]{1,64}$"
          description: >-
            Export instigator written into the NeTEx headers
            (default GTFS-Express).
      responses:
        "200":
          $ref: "#/components/responses/ZipOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EditModeRequired"
        "422":
          description: Export blocked — the feed still has ERROR-severity canonical findings.
            The body carries the severity summary and the full validation report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/SessionSaturated"
