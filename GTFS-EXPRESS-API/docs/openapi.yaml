  /gtfs/network/catalog/import:
    post:
      tags:
        - Network Studio
      summary: "Download a public GTFS feed and reverse-compile it into a SIMPLIFIED Network Spec: a baseline to compare a redesign with, never a way to change the network that runs (POST /network/catalog/open does that). One stop sequence per line and direction; each service as the weekly periods it really runs; public holidays carried when the feed treats them so; each line's speed calibrated on the observed running times. The answer says what the simplification loses (`losses`, human `warnings`) with the baseline design report; the spec carries `origin` (kind simplified_import), which POST /network/compile refuses unacknowledged. With `place` (a territory already loaded), only the lines serving it are kept, the busiest first, and its public holidays are used."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: The GTFS zip (http or https; public internet only).
                place:
                  type: string
                  description: A territory already loaded.
                name:
                  type: string
                  description: The network's name, kept in `origin.name`.
      responses:
        "200":
          description: The simplified spec, what it loses, and its baseline report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spec:
                    type: object
                    description: The Network Spec, with `origin` (NetworkSpecOrigin).
                  ok:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: object
                  blockers:
                    type: array
                    items:
                      type: object
                  estimate:
                    type: object
                  stats:
                    type: object
                  losses:
                    $ref: "#/components/schemas/NetworkImportLosses"
                  warnings:
                    type: array
                    description: Human sentences (English) built from the losses; the studio localizes from the numbers.
                    items:
                      type: string
                  report:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /gtfs/network/catalog/open:
    post:
      tags:
