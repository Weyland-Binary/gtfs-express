                by:
                  type: object
                  properties:
                    name:
                      type: string
                package_id:
                  type: string
                  description: The id of a package POST …/package built for this version (kept 24 hours). Required.
                files:
                  type: array
                  description: Ignored since 2026-10-05 (the files are the package's).
                  items:
                    type: string
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceProjectOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ClientTokenRequired"
        "403":
          $ref: "#/components/responses/RoleRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/WorkspaceDisabled"
