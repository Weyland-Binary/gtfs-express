      summary: Create a trips record.
      description: |-
        Generic edit CRUD endpoint — request/response envelope described in the **Edit CRUD
        pattern** section of the API description.

        When `trip_id` is absent or empty the server generates one
        (`<route_id>_<direction_id or 0>_<n>`, zero-padded and de-duplicated) and echoes it in the
        created `trip`; the response also carries `id_generated: true`. Same behaviour for
        `stop_id` on `POST /gtfs/edit/stops` (`S<n>` zero-padded after the highest numeric id, or
        `stop_<hex>`) and `route_id` on `POST /gtfs/edit/routes` (`R_<route_short_name slug>`,
        de-duplicated with a numeric suffix).
      requestBody:
        $ref: "#/components/requestBodies/EntityCreate"
      security:
        - SessionId: []
      responses:
        "201":
          $ref: "#/components/responses/EditCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EditModeRequired"
  /gtfs/edit/trips/shift:
    post:
      tags:
        - Edit
      summary: Shift the times of one or more trips by a fixed offset.
      description: |-
        Adds `offset_secs` to `arrival_time` / `departure_time` of every stop_time of the given
        trips whose `stop_sequence >= from_stop_sequence` (default: all stops). Times keep the GTFS
        `HH:MM:SS` form and may exceed 24:00:00 (`23:59:00 + 360 s → 24:05:00`). When
        `from_stop_sequence` is omitted, `frequencies.start_time` / `end_time` of those trips are
        shifted as well. Null or empty times are left untouched.

        Atomic: one transaction and ONE edit-log entry (entity `trip`, action `shift_times`,
        `entity_id` = comma-joined trip ids) with pre-image undo ops and post-image redo ops.
        Rejected with **400** (`SHIFT_NEGATIVE_TIME`) if any resulting time would be negative,
        **404** if any trip id is unknown (`missing` lists them).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trip_ids
                - offset_secs
              properties:
                trip_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                offset_secs:
                  type: integer
                  description: Non-zero offset in seconds, |offset_secs| <= 86400.
                  example: 300
                from_stop_sequence:
                  type: integer
                  minimum: 0
                  description: Only stop_times with stop_sequence >= this value are shifted.
                    Frequencies are not shifted when this field is set.
      security:
        - SessionId: []
      responses:
        "200":
          description: Times shifted. `shifted_trips` counts the trips that had at least one row
            changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  shifted_trips:
                    type: integer
                  shifted_stop_times:
                    type: integer
                  shifted_frequencies:
                    type: integer
                  offset_secs:
                    type: integer
                  undoEntryId:
                    type: integer
                    nullable: true
                    description: Id of the edit-log entry, usable as `expectedEntryId` on
                      `POST /gtfs/edit/undo`.
                  validation:
                    type: object
                    additionalProperties: true
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EditModeRequired"
