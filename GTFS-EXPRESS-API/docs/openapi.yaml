      summary: "The coherence report as an operator's service-méthode sheet (mission step 7): the report of the session's feed (the version's offer), WHOLE (every page of lines), as a workbook (SheetJS): the anomalies first (with the header), then one worksheet per day type (and period), lines × directions in rows — first and last departure, headway at peak and off-peak (minutes, numbers), trips, patterns, running time min and max; times as text (GTFS's clock runs past 24:00), no formula. Rendered by the server from the same data as the JSON report (one model, two files: the same figures, cell for cell); the header names the network, the version and its date, the date of the report, the canonical validator's engine and the SHA-256 fingerprint of its report (the session's latest one; a simulation's validation for a preview; « none » said otherwise) and the version's fingerprint (report.version.fingerprint). Read only; the filename is attachment `rapport-coherence_<network>_<version>_<date>.xlsx`; the header X-Coherence-Fingerprint repeats the version's fingerprint."
