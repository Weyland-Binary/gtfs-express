# HTTP security headers — included in every location to avoid Nginx add_header inheritance bug
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# script-src has no 'unsafe-inline': Vite emits only external module scripts
# (CRA's inline runtime chunk is gone). The JSON-LD block in index.html is a
# non-executable data block — script-src does not apply to it.
# style-src keeps 'unsafe-inline' (Emotion/MUI runtime styles + Leaflet).
# connect-src allows the OSRM road-routing host used by the shape editor
# (snap to road / auto-generate). If VITE_OSRM_URL points to another host,
# add that host here too, otherwise routing silently falls back to straight lines.
# Basemaps (src/components/map/basemapConfig.js): the vector styles are
# fetched by MapLibre (connect-src) which renders in a Web Worker created
# from a blob URL (worker-src blob:); raster tiles load as images (img-src).
# Every provider is listed so a key can be switched without touching the CSP:
# CARTO (basemaps.cartocdn.com), MapTiler (api.maptiler.com), OpenFreeMap
# (tiles.openfreemap.org), OpenStreetMap and Esri for the raster choices.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://server.arcgisonline.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://api.maptiler.com https://tiles.openfreemap.org; connect-src 'self' https://router.project-osrm.org https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://api.maptiler.com https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none';" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
