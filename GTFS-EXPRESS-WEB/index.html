<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1565C0" />

    <!-- What an index and a share read of the page: written per language at build by vite.seo.js (the title,
         description, canonical address, hreflang alternates, Open Graph and structured data), from the same
         translations the app shows. -->
    <!-- seo:start -->
    <title>GTFS Express — Modifiez votre réseau de transport à partir d'un cahier des charges</title>
    <meta name="description" content="Explorez gratuitement votre réseau GTFS, puis modifiez-le à partir d'un cahier des charges ou à la main. Chaque changement est vérifié, rien n'est livré sans votre accord." />
    <!-- seo:end -->

    <!-- Favicon -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/img/favicon_16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/favicon_32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/img/favicon_48x48.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/img/apple-touch-icon.png"
    />

    <!-- Inter is part of the build (src/assets/fonts/inter): no font CDN, no third-party request at load. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
