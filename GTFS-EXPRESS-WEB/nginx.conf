# The protocol the visitor used. Caddy terminates TLS and sends
# X-Forwarded-Proto: https; forwarding this hop's own $scheme (http) instead
# would hide it from the API (req.secure, the Secure flag of the session
# cookie). Without the header (a direct call inside the stack), this hop's
# own scheme. This file is included in the http block (conf.d), where map lives.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The addresses the app's router resolves (src/utils/routes.jsx) that have no page of their own: they get app.html.
# Any other unknown address is a real 404, so that search engines never index the app under it.
map $uri $app_route {
    default                                 0;
    ~^/(r|p|partage|admin)(/|$)             1;
    ~^/(modifier|conditions|fr)/?$          1;
    ~^/conditions/[^/]+/?$                  1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTTP security headers — included in every location to avoid Nginx add_header inheritance bug
    include /etc/nginx/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    error_page 404 /404.html;

    # Vite emits hashed filenames under /assets/: cached for good, whatever their type.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/security-headers.conf;
    }

    # index.html must never be cached — it carries hashed asset references
    # that change on every deploy. Stale index.html + new chunks = load error.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }

    # Home (/), a language's Home (/en/, /es/…), the public pages (/regles…) and the content pages are served as
    # vite.seo.js wrote them; the app's own addresses fall back to app.html for client-side routing. Pages are never
    # cached: they carry hashed asset references that change on every deploy.
    location / {
        try_files $uri $uri/index.html @app;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location @app {
        if ($app_route = 0) {
            return 404;
        }
        rewrite ^ /app.html break;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Proxy to Express API
    location /api/gtfs/ {
        proxy_pass http://api:3004/gtfs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Timeout for large uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 55m;
    }

    # Healthcheck for Docker
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
